name: CI

on:
  # Every pull request runs, so the required ci-ok check always reports; the changes job skips the
  # platform jobs whose inputs a pull request leaves alone.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'android/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - 'fixtures/**'
      - 'coverage/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current release from main after every check passes
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run the platform jobs only when their inputs change; everything else runs them all.
  # On main it also reports whether the push moved the current release, which publishes it.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      android: ${{ steps.filter.outputs.android }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Pull requests list their files through the API; pushes diff against the commit before the push.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - 'harness/**'
              - 'scenarios/**'
              - 'fixtures/**'
              - 'coverage/evidence/**'
              - 'spec/current-release.txt'
              - 'spec/refs.yaml'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            swift:
              - *shared
              - 'Package.swift'
              - 'swift/**'
            kotlin:
              - *shared
              - 'kotlin/**'
            android:
              - *shared
              - 'kotlin/**'
              - 'android/**'
            release:
              - 'spec/current-release.txt'

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Test generator tooling
        run: uv run --locked pytest
      - name: Lint generator tooling
        run: uv run --locked ruff check tools harness
      - name: Lint workflows
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml
      - name: Audit pinned release schema
        run: |
          ref="$(cat spec/current-release.txt)"
          uv run --locked python -m tools.schema_audit --ref "$ref"
          git diff --exit-code -- "spec/out/$ref/schema-audit.json"
      - name: Check committed generated sources
        run: make check-gen
      - name: Check reviewed REST overlays
        run: |
          make rest
          make check-rest
          ref="$(cat spec/current-release.txt)"
          git diff --exit-code -- "spec/out/$ref/openapi.raw.json" "spec/out/$ref/openapi.json" \
            "spec/out/$ref/rest-hashes.json" "spec/out/$ref/rest-meta.json"
      - name: Report contract coverage
        run: |
          make coverage
          git diff --exit-code -- coverage

  swift:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Build
        run: swift build
      - name: Test
        run: swift test --no-parallel

  kotlin:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.kotlin == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check
        working-directory: kotlin
        run: ./gradlew check

  live:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.swift == 'true' || needs.changes.outputs.kotlin == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run both clients against tagged Hermes
        run: make live
      - name: Verify ticket subprotocols in both clients
        run: make live-ticket

  apple:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build for iOS and iPadOS devices and simulators
        run: make apple
      - name: Run the test suite and live scenarios in the iOS simulator
        run: make live CLIENTS=ios

  # Build and lint run apart from the emulator job so neither waits for the other.
  android-build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build and lint for Android
        run: make android

  android-live:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVD_API_LEVEL: '35'
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
      AVD_OPTIONS: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs the newest emulator and system image on every run, and a snapshot
      # only resumes on the pair that saved it, so both versions key the cache.
      - name: Resolve emulator and system image versions
        id: avd
        run: |
          image="system-images;android-$AVD_API_LEVEL;$AVD_TARGET;$AVD_ARCH"
          versions=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 2>/dev/null | awk -F'|' -v image="$image" '
            /^Available Packages:/ { available = 1; next }
            /^[A-Z]/ { available = 0 }
            available {
              gsub(/ /, "", $1); gsub(/ /, "", $2)
              if ($1 == "emulator") emulator = $2
              if ($1 == image) image_version = $2
            }
            END { if (emulator != "" && image_version != "") print "emulator-" emulator "-image-" image_version }')
          if [ -z "$versions" ]; then
            echo "sdkmanager lists no emulator or $image version" >&2
            exit 1
          fi
          echo "key=avd-$AVD_API_LEVEL-$AVD_TARGET-$AVD_ARCH-$versions" >> "$GITHUB_OUTPUT"
      # A booted emulator snapshot, so later runs resume it instead of cold-booting.
      - id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.key }}
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ env.AVD_OPTIONS }}
          script: echo 'Saved the emulator snapshot.'
      - name: Run live scenarios on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save ${{ env.AVD_OPTIONS }}
          script: make live CLIENTS=android

  # The single required check: fails when any job above failed or was cancelled; skipped jobs pass.
  ci-ok:
    needs: [changes, tooling, swift, kotlin, live, apple, android-build, android-live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Publishes when a push to main moves the current release, or on a dispatch with publish set;
  # every check above has already built and tested this commit on every platform.
  publish:
    needs: [changes, ci-ok]
    if: >-
      ${{ !cancelled() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.changes.outputs.release == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    # Releases publish one at a time and never cancel one already underway.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Enforce complete tagged coverage
        run: |
          make coverage
          uv run --locked python -m tools.coverage --ref "$(cat spec/current-release.txt)" --gate
      - name: Publish Maven and SwiftPM release
        run: |
          release=$(uv run --locked python -m tools.release_version)
          if git rev-parse "refs/tags/$release" >/dev/null 2>&1; then
            existing=$(git rev-parse "refs/tags/$release^{commit}")
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Release tag $release points to another commit" >&2
              exit 1
            fi
          else
            (cd kotlin && ./gradlew publishHermesAPIPublicationToGitHubPackagesRepository)
            (cd android && ./gradlew publishHermesAPIAndroidPublicationToGitHubPackagesRepository)
            git tag "$release"
            git push origin "$release"
          fi
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --title "HermesAPI $release" --notes-file "coverage/$(cat spec/current-release.txt).md"
          fi
