name: CI

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test generator tooling
        run: uv run --locked pytest
      - name: Lint generator tooling
        run: uv run --locked ruff check tools

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        working-directory: kotlin
        run: ./gradlew check
