name: CI

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test generator tooling
        run: uv run --locked pytest
      - name: Lint generator tooling
        run: uv run --locked ruff check tools harness
      - name: Lint workflows
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml
      - name: Audit pinned release schema
        run: |
          uv run --locked python -m tools.schema_audit --ref "$(cat spec/current-release.txt)"
          git diff --exit-code -- spec/out/$(cat spec/current-release.txt)/schema-audit.json
      - name: Check committed generated sources
        run: make check-gen
      - name: Check reviewed REST overlays
        run: |
          make rest
          make check-rest
          git diff --exit-code -- spec/out/$(cat spec/current-release.txt)/openapi.raw.json spec/out/$(cat spec/current-release.txt)/openapi.json spec/out/$(cat spec/current-release.txt)/rest-hashes.json spec/out/$(cat spec/current-release.txt)/rest-meta.json
      - name: Report contract coverage
        run: |
          make coverage
          git diff --exit-code -- coverage

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        working-directory: kotlin
        run: ./gradlew check

  live:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run both clients against tagged Hermes
        run: make live
      - name: Verify ticket subprotocols in both clients
        run: make live-ticket
