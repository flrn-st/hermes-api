name: CI

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'android/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - 'fixtures/**'
      - 'coverage/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitattributes'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'swift/**'
      - 'kotlin/**'
      - 'android/**'
      - 'tools/**'
      - 'spec/**'
      - 'scenarios/**'
      - 'harness/**'
      - 'fixtures/**'
      - 'coverage/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main and releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run the platform jobs only when their inputs change; everything else runs them all.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'harness/**'
              - 'scenarios/**'
              - 'fixtures/**'
              - 'spec/current-release.txt'
              - 'spec/refs.yaml'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            swift:
              - *shared
              - 'Package.swift'
              - 'swift/**'
            kotlin:
              - *shared
              - 'kotlin/**'
            android:
              - *shared
              - 'kotlin/**'
              - 'android/**'

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test generator tooling
        run: uv run --locked pytest
      - name: Lint generator tooling
        run: uv run --locked ruff check tools harness
      - name: Lint workflows
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml
      - name: Audit pinned release schema
        run: |
          ref="$(cat spec/current-release.txt)"
          uv run --locked python -m tools.schema_audit --ref "$ref"
          git diff --exit-code -- "spec/out/$ref/schema-audit.json"
      - name: Check committed generated sources
        run: make check-gen
      - name: Check reviewed REST overlays
        run: |
          make rest
          make check-rest
          ref="$(cat spec/current-release.txt)"
          git diff --exit-code -- "spec/out/$ref/openapi.raw.json" "spec/out/$ref/openapi.json" \
            "spec/out/$ref/rest-hashes.json" "spec/out/$ref/rest-meta.json"
      - name: Report contract coverage
        run: |
          make coverage
          git diff --exit-code -- coverage

  swift:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        run: swift build
      - name: Test
        run: swift test --no-parallel

  kotlin:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.kotlin == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        working-directory: kotlin
        run: ./gradlew check

  live:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.swift == 'true' || needs.changes.outputs.kotlin == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run both clients against tagged Hermes
        run: make live
      - name: Verify ticket subprotocols in both clients
        run: make live-ticket

  apple:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build for iOS and iPadOS devices and simulators
        run: make apple
      - name: Run the test suite and live scenarios in the iOS simulator
        run: make live CLIENTS=ios

  android:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint for Android
        run: make android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run live scenarios on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: make live CLIENTS=android
