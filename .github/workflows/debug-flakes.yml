# [DEBUG-rst1] Temporary reproduction loop for the intermittent live failures; delete before merging.
name: Debug live flakes

on:
  push:
    branches: [fix-live-flakes]

permissions:
  contents: read

jobs:
  apple-live:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
        copy: [1, 2, 3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run the test suite and live scenarios in the iOS simulator
        env:
          DEBUG_RST1_DIR: ${{ runner.temp }}/rst1
        run: |
          mkdir -p "$DEBUG_RST1_DIR"
          xcodebuild -version
          # A timestamp every 5 s: a gap means the whole runner stalled.
          ( while true; do date -u +%H:%M:%S; sleep 5; done >> "$DEBUG_RST1_DIR/ticks.log" ) &
          make live CLIENTS=ios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rst1-${{ matrix.image }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/rst1
