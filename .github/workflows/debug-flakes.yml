# [DEBUG-rst1] Temporary reproduction loop for the intermittent live failures; delete before merging.
name: Debug live flakes

on:
  push:
    branches: [fix-live-flakes]

permissions:
  contents: read

jobs:
  apple-live:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run the test suite and live scenarios in the iOS simulator
        run: make live CLIENTS=ios

  android-live:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVD_API_LEVEL: '35'
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
      AVD_OPTIONS: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs the newest emulator and system image on every run, and a snapshot
      # only resumes on the pair that saved it, so both versions key the cache.
      - name: Resolve emulator and system image versions
        id: avd
        run: |
          image="system-images;android-$AVD_API_LEVEL;$AVD_TARGET;$AVD_ARCH"
          versions=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 2>/dev/null | awk -F'|' -v image="$image" '
            /^Available Packages:/ { available = 1; next }
            /^[A-Z]/ { available = 0 }
            available {
              gsub(/ /, "", $1); gsub(/ /, "", $2)
              if ($1 == "emulator") emulator = $2
              if ($1 == image) image_version = $2
            }
            END { if (emulator != "" && image_version != "") print "emulator-" emulator "-image-" image_version }')
          if [ -z "$versions" ]; then
            echo "sdkmanager lists no emulator or $image version" >&2
            exit 1
          fi
          echo "key=avd-$AVD_API_LEVEL-$AVD_TARGET-$AVD_ARCH-$versions" >> "$GITHUB_OUTPUT"
      # A booted emulator snapshot, so later runs resume it instead of cold-booting.
      - id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.key }}
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ env.AVD_OPTIONS }}
          script: echo 'Saved the emulator snapshot.'
      - name: Run live scenarios on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save ${{ env.AVD_OPTIONS }}
          script: make live CLIENTS=android
      - name: '[DEBUG-rst1] Failed Android tests'
        if: failure()
        run: grep -rho '<testcase[^>]*>\s*<failure[^>]*message="[^"]*"' android/build/outputs/androidTest-results || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ matrix.copy }}
          path: android/build/reports/androidTests
