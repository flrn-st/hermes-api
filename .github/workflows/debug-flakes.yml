# [DEBUG-rst1] Temporary reproduction loop for the intermittent live failures; delete before merging.
name: Debug live flakes

on:
  push:
    branches: [fix-live-flakes]

permissions:
  contents: read

jobs:
  apple-live:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-26]
        copy: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run the test suite and live scenarios in the iOS simulator
        env:
          DEBUG_RST1_DIR: ${{ runner.temp }}/rst1
        run: |
          mkdir -p "$DEBUG_RST1_DIR"
          # Hermes dumps every thread's stack every 5 s from a C watchdog thread (no signals), after a
          # timestamp line from a Python thread: a missing timestamp means the interpreter itself stalled.
          cat > "$DEBUG_RST1_DIR/sitecustomize.py" <<'EOF'
          import faulthandler, sys, threading, time
          faulthandler.dump_traceback_later(5, repeat=True, file=sys.stderr)
          def _tick():
              while True:
                  print(time.strftime("[DEBUG-rst1] tick %H:%M:%S"), file=sys.stderr, flush=True)
                  time.sleep(5)
          threading.Thread(target=_tick, daemon=True).start()
          EOF
          xcodebuild -version
          # Every second: how late the probe woke (CPU stall) and how long a 4 KB write + fsync took
          # (disk stall). Reported through the job log, not the disk, and only when over 0.5 s.
          python3 -u -c '
          import os, time
          probe = os.path.join(os.environ["RUNNER_TEMP"], "disk-probe")
          last = 0.0
          while True:
              began = time.monotonic(); time.sleep(1); woke = time.monotonic()
              fd = os.open(probe, os.O_WRONLY | os.O_CREAT | os.O_APPEND); os.write(fd, b"x" * 4096); os.fsync(fd); os.close(fd)
              done = time.monotonic(); late, write = woke - began - 1, done - woke
              if late > 0.5 or write > 0.5 or done - last > 30:
                  stamp = time.strftime("%H:%M:%S")
                  print(f"[DEBUG-rst1] {stamp} probe wake_late={late:.2f}s write_fsync={write:.2f}s", flush=True); last = done
          ' &
          make live CLIENTS=ios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rst1-${{ matrix.image }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/rst1
