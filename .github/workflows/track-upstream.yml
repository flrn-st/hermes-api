name: Track Hermes releases

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A manual run never races the scheduled one on the same update branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Detect newest released Hermes version
        id: tag
        run: uv run --locked python -m tools.track_upstream --github-output "$GITHUB_OUTPUT"

  update:
    needs: detect
    if: needs.detect.outputs.ref != ''
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      REF: ${{ needs.detect.outputs.ref }}
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for an existing update PR
        id: existing
        run: |
          head=$(gh pr list --state open --head "hermes/$REF" --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -n "$head" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            # PRs opened with the workflow token start no CI of their own; a lost dispatch would leave
            # the PR without the required ci-ok check.
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq 'length')" = 0 ]; then
              gh workflow run ci.yml --ref "hermes/$REF"
            fi
          fi
      - name: Generate tagged release update
        if: steps.existing.outputs.skip != 'true'
        run: |
          previous=$(cat spec/current-release.txt)
          echo "PREVIOUS_REF=$previous" >> "$GITHUB_ENV"
          git switch -c "hermes/$REF"
          uv run --locked python -m tools.track_upstream --adopt "$REF" --tag "$TAG"
          uv run --locked python -m tools.fetch_spec --ref "$REF"
          mkdir -p "reports/$REF"
          if ! uv run --locked python -m tools.schema_audit --ref "$REF" > "reports/$REF/schema-audit.log" 2>&1; then
            echo 'Schema audit needs review.' >> "reports/$REF/generation.md"
          fi
          if ! uv run --locked python -m tools.gen_gateway_models --ref "$REF" > "reports/$REF/gateway-models.log" 2>&1; then
            echo 'Gateway model generation needs review.' >> "reports/$REF/generation.md"
          fi
          if ! uv run --locked python -m tools.gen_gateway_api --ref "$REF" > "reports/$REF/gateway-api.log" 2>&1; then
            echo 'Gateway API generation needs review.' >> "reports/$REF/generation.md"
          fi
          uv run --locked python -m tools.extract_openapi --ref "$REF" > "reports/$REF/rest-extraction.log"
          if uv run --locked python -m tools.apply_overlay --ref "$REF" > "reports/$REF/overlay.log" 2>&1; then
            if ! uv run --locked python -m tools.gen_rest_api --ref "$REF" > "reports/$REF/rest-generation.log" 2>&1; then
              echo 'REST generator needs new schema support.' >> "reports/$REF/generation.md"
            fi
          else
            echo 'REST overlays have stale handler hashes or changed routes. Review the tagged handlers and update the overlays.' >> "reports/$REF/generation.md"
          fi
          if ! make record REF="$REF" > "reports/$REF/live-record.log" 2>&1; then
            echo 'Live recording or a client suite needs review; see live-record.log.' >> "reports/$REF/generation.md"
          fi
          uv run --locked python -m tools.contract_diff --from-ref "$previous" --to-ref "$REF" --output "reports/$REF/openrpc.md"
          uv run --locked python -m tools.coverage --ref "$REF"
      - name: Compare REST contracts with oasdiff
        if: steps.existing.outputs.skip != 'true'
        run: |
          curl -fsSL -o /tmp/oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_darwin_all.tar.gz
          echo 'e4d74b7e2dfb9d4819e7fc720c905ec86547e4637ac270a2b0187c0f1fb7187e  /tmp/oasdiff.tar.gz' | shasum -a 256 --check
          mkdir -p /tmp/oasdiff
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp/oasdiff
          /tmp/oasdiff/oasdiff breaking -f markdown "spec/out/$PREVIOUS_REF/openapi.raw.json" "spec/out/$REF/openapi.raw.json" > "reports/$REF/rest-breaking.md"
      - name: Commit and open update PR
        if: steps.existing.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only the current release's pinned data is used; git history keeps the previous one.
          git rm -r -q --ignore-unmatch "spec/out/$PREVIOUS_REF" "fixtures/$PREVIOUS_REF" \
            "coverage/evidence/$PREVIOUS_REF.json" "coverage/$PREVIOUS_REF.json" "coverage/$PREVIOUS_REF.md"
          git add -A
          git commit -m "Track Hermes $REF ($TAG) release contracts"
          # The bot owns this branch; a rerun after a failed PR step replaces its earlier generation.
          git push --force origin "hermes/$REF"
          {
            printf '## Hermes %s (tag %s)\n\n' "$REF" "$TAG"
            printf 'Generated from the published stable tag. Review any stale REST overlays before merging.\n\n'
            cat "reports/$REF/openrpc.md"
            printf '\n## REST breaking changes\n\n'
            cat "reports/$REF/rest-breaking.md"
            printf '\n## Generation review\n\n'
            if [ -f "reports/$REF/generation.md" ]; then cat "reports/$REF/generation.md"; else printf 'No generation errors.\n'; fi
            printf '\n'
            cat "coverage/$REF.md"
          } > /tmp/hermes-release-pr.md
          gh pr create --base main --head "hermes/$REF" --title "Track Hermes $REF" --body-file /tmp/hermes-release-pr.md
          gh workflow run ci.yml --ref "hermes/$REF"
