- {method: groups.state, params: {room_id: "room-${@unique}"}}
- {method: groups.send, params: {room_id: "room-${@unique}", event_id: "hello-${@unique}", payload: {text: Hello room, thread_id: main}}}
- {method: groups.log, params: {room_id: "room-${@unique}"}}
- {method: groups.rename, params: {room_id: "room-${@unique}", event_id: "rename-${@unique}", name: Scenario room renamed}}
- {method: groups.stop, params: {room_id: "room-${@unique}"}}
- {method: groups.disband, params: {room_id: "room-${@unique}"}}
