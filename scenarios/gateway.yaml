# A hosted room of two local profiles.
- {method: groups.create, params: {room_id: "room-${@unique}", name: Scenario room, members: [{member_id: host, profile: default, handle: host, display_name: Host}, {member_id: member, profile: "probe-${@unique}", handle: member, display_name: Member}]}}
