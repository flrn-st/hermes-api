- {method: mcp.servers.add, params: {name: "probe-${@unique}", config: {command: /usr/bin/true, enabled: false}}}
- {method: mcp.servers.set_api_key, params: {name: "probe-${@unique}", value: not-a-real-key}}
- {method: mcp.servers.remove, params: {name: "probe-${@unique}"}}
- {method: cron.manage, params: {action: list}}
- {method: cron.manage, params: {action: add, name: "probe-${@unique}", schedule: every 1h, prompt: Say hello.}}
