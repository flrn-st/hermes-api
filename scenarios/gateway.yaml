# Gateway methods every client runs through its generated method table, and the recorder records.
#
# Each call names a method, its params, dotted `capture` paths into the result, and optionally an event to
# `wait` for, from the call's session, when the method's work completes later. `${@home}` is the isolated Hermes home, `${@repo}` a
# scratch git repository in it, and `${@unique}` a value each run fills in, so every client can run the
# scenario against the same server. Methods that act on the host outside the isolated home (installs,
# the screen, clipboard, microphone, password managers, foreign agents' sessions), need external
# accounts or networks, or need a hosted-room worker are not called here.
name: gateway
calls:
# Read-only views of the isolated home.
- {method: agents.list}
- {method: commands.catalog}
- {method: command.resolve, params: {name: help}}
- {method: complete.slash, params: {text: /he}}
- {method: complete.path, params: {word: "${@repo}/R"}}
- {method: config.get, params: {key: provider}}
- {method: config.get, params: {key: full}}
- {method: config.show}
- {method: delegation.status}
- {method: display.status}
- {method: free_tier.status}
- {method: groups.capabilities}
- {method: groups.list}
- {method: insights.get, params: {days: 7}}
- {method: learning.frames}
- {method: learning.detail}
- {method: mcp.catalog}
- {method: mcp.servers.list}
- {method: mcp.servers.status}
- {method: model.options}
- {method: pet.gallery, params: {localOnly: true}}
- {method: pet.generate.status}
- {method: pet.info}
- {method: pet.info.meta}
- {method: plugins.list}
- {method: plugins.manage, params: {action: list}}
- {method: profiles.list}
- {method: profiles.describe, params: {name: default}}
- {method: project.facts, params: {cwd: "${@repo}"}}
- {method: projects.for_cwd, params: {cwd: "${@repo}"}}
- {method: projects.list}
- {method: projects.tree}
- {method: session.active_list}
- {method: session.events.stats}
- {method: session.most_recent}
- {method: setup.status}
- {method: setup.runtime_check}
- {method: skills.manage, params: {action: list}}
- {method: spawn_tree.list}
- {method: system.battery}
- {method: tools.list}
- {method: tools.show}
- {method: toolsets.list}
- {method: verification.status, params: {cwd: "${@repo}"}}
- {method: wake.status}
# Configuration, restored where a later run would notice.
- {method: config.set, params: {key: details_mode, value: collapsed}}
- {method: tools.configure, params: {action: disable, names: [web]}}
- {method: tools.configure, params: {action: enable, names: [web]}}
- {method: delegation.pause, params: {paused: true}}
- {method: delegation.pause, params: {paused: false}}
- {method: pet.scale, params: {scale: 1.0}}
