name: liveness
calls:
  - method: ping
    params: {}
  - method: gateway.capabilities
    params: {}
  - method: session.create
    params:
      title: HermesAPI live session
      cwd: /tmp
      close_on_disconnect: true
    capture:
      session_id: session_id
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Reply with a short greeting.
    wait_for_event: message.complete
    expect_event_text: HermesAPI fixture reply.
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Ask which release channel to use for HermesAPI.
    wait_for_server_request: clarify
    wait_for_event: message.complete
    expect_event_text: HermesAPI stable release selected.
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Try the fixture cleanup command and report whether it was approved.
    wait_for_server_request: approval
    wait_for_event: message.complete
    expect_event_text: HermesAPI approval denied as expected.
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Run the fixture command that needs approval and report the result.
    wait_for_server_request: approval
    server_requests:
      approval:
        choice: once
    wait_for_event: message.complete
    expect_event_text: HermesAPI approval accepted.
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Load the HermesAPI fixture skill that needs a secret.
    wait_for_server_request: secret
    wait_for_event: message.complete
    expect_event_text: HermesAPI secret request answered.
  - method: prompt.submit
    params:
      session_id: ${session_id}
      text: Ask a HermesAPI question that will be withdrawn.
    wait_for_server_request: clarify
    withhold_server_requests: [clarify]
  - method: session.interrupt
    params:
      session_id: ${session_id}
    wait_for_event: request.cancel
  - method: session.list
    params: {}
  - method: session.close
    params:
      session_id: ${session_id}
server_requests:
  clarify:
    answers:
      q0: Stable
  approval:
    choice: deny
  # Skipped: Hermes stores nothing and asks again next time.
  secret:
    value: ""
