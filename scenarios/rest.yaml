# A second tagged server behind the dashboard auth gate (the bundled password provider, user
# `hermes-api`, password `scenario-password`), started without credentials: public routes, the
# native app's PKCE sign-in, Bearer-authenticated calls (`auth: native` signs requests with the
# tokens captured as `tokens`), token refresh, and a browser cookie session. `name#param` captures
# the query parameter `param` of the URL at `name`.
gated_calls:
- {operation: GET /api/auth/providers}
- {operation: GET /login}
- operation: GET /auth/login
  query: {provider: basic}
- operation: GET /auth/native/authorize
  query: {provider: basic, code_challenge: Mqlx6tel6Hd6jvw673vAco05qVPhjcMLuakGjpQsmZw, code_challenge_method: S256,
    redirect_uri: 'http://127.0.0.1:1/callback', state: scenario-state}
- operation: POST /auth/password-login
  body: {provider: basic, username: hermes-api, password: scenario-password}
  capture: {code: 'next#code'}
- operation: POST /auth/native/token
  body: {code: '${code}', code_verifier: hermes-api-scenario-code-verifier-0123456789abcdefghijklmnop}
  capture: {first_refresh: refresh_token}
- operation: POST /auth/native/refresh
  body: {refresh_token: '${first_refresh}', provider: basic}
  capture: {tokens: $}
- operation: GET /api/auth/me
  auth: native
- operation: POST /api/auth/ws-ticket
  auth: native
- operation: GET /api/sessions/empty/count
  auth: native
- operation: POST /auth/password-login
  body: {provider: basic, username: hermes-api, password: scenario-password}
- {operation: GET /api/auth/me}
- {operation: POST /auth/logout}
