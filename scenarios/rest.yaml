# REST calls the recorder and every live client run, in order, against one isolated tagged server.
# Each call names an operation ("METHOD /path" as in the OpenAPI document) and its arguments:
# `path`, `query`, `form` (multipart fields; a file is {filename, content_type, text}) and `body`.
# `capture` remembers values from the JSON result by dotted path (`$` is the whole result);
# `${name}` uses them later. `${@name}` is a harness value: `home` (the isolated HERMES_HOME) and
# `repo` (a scratch git repository in it). `until: {path, equals, timeout}` repeats a call until
# the result at `path` equals `equals`, for waiting on background actions.
# The scenario runs several times against the same server (recorder, then each client), so every
# call that creates something also removes it or uses a name unique to the run, and every call
# that changes configuration restores it.
# Operations that act on the host outside the isolated home (gateway service control, updates,
# terminals, OS permission prompts), install or download software, or need external accounts are
# not called here; they are listed in the pull request as proposed exemptions.
