# Reviewed meanings of the error codes Hermes' gateway answers with.
#
# Hermes declares no errors in its gateway contract. `make rest` reads them from the tagged handlers into
# spec/out/<ref>/gateway-errors.json: every code a method's handler can return, with its message
# templates ("{…}" stands for text Hermes fills in). Hermes reuses codes for unrelated failures, so a code
# alone does not identify an error: 4001 is "session not found" for session methods and an invalid audio
# frame for wake.feed. The generators therefore classify by code and, where it differs, by message.
#
# kinds: what a client can do about the error.
#   invalidRequest  the call itself is wrong: fix the parameters, the method or the order of calls
#   unsupported     this backend, agent or host does not offer it
#   notFound        the target does not exist, or no longer does
#   conflict        the current state rules it out until something else changes
#   busy            Hermes is occupied; the same call can succeed shortly
#   forbidden       this client, account or configuration may not do it
#   unavailable     a part of Hermes is down or starting; retry later, possibly after reconnecting
#   serverError     Hermes failed while doing it
#
# codes: every code of the release. `kind` is the code's meaning; `messages` overrides it for message
# templates that mean something else. `reviewed` is the SHA-256 of the code's sorted message templates
# (JSON, UTF-8) when it was last reviewed: when a release changes them, generation stops until the code is
# reviewed again and the hash updated.
#
# names: errors with a stable meaning that clients match on. Each lists the code and message templates
# that identify it; an entry without a message matches every message of its code.
names:
  parseError:
    summary: The frame was not valid JSON.
    match: [{code: -32700}]
  malformedRequest:
    summary: The frame was not a valid JSON-RPC request.
    match: [{code: -32600}]
  unknownMethod:
    summary: This Hermes release has no such method; client and backend versions differ.
    match: [{code: -32601}]
  invalidParams:
    summary: The parameters are not an object, or a parameter has the wrong type.
    match: [{code: -32602}]
  paramsRejected:
    summary: The parameters violate the method's contract, or a required one is missing.
    match: [{code: 4000}]
  internalError:
    summary: Hermes failed to handle or answer the request.
    match: [{code: -32603}, {code: -32000, message: "handler error: {…}"}]
  sessionNotFound:
    summary: No live session has this runtime id, or it belongs to another connection.
    match:
    - {code: 4001, message: "session not found"}
    - {code: 4001, message: "session not found or not owned by this transport"}
    - {code: 4007, message: "session not found"}
  sessionNotLive:
    summary: The session was reclaimed; resume it by its stored id.
    match: [{code: 4007, message: "session no longer live; retry resume"}]
  sessionSettling:
    summary: Hermes is still interrupting the turn it orphaned when the client left; retry shortly.
    match: [{code: 4009, message: "session disconnect interrupt settling"}]
  sessionBusy:
    summary: A turn or subagent is running; retry once it finishes.
    match:
    - {code: 4009, message: "session busy"}
    - {code: 4009, message: "session busy — wait for the current turn to finish, then retry the handoff"}
    - {code: 4009, message: "subagent still running — wait for it to finish"}
    - {code: 4091, message: "hosted room member session is busy"}
  sessionStarting:
    summary: The session's agent is still loading; retry once it is ready.
    match: [{code: 5032}]
  sessionTooLarge:
    summary: The stored session is too large to resume.
    match: [{code: 4130}]
  profileNotFound:
    summary: No Hermes profile has this name.
    match: [{code: 4064, message: "profile '{…}' not found"}]
  signInRequired:
    summary: The account must sign in before using connectors.
    match: [{code: 4032}]
  storageUnavailable:
    summary: Hermes cannot open its session storage.
    match:
    - {code: -32000, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5000, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5006, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5007, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5008, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5017, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5036, message: "Session storage is unavailable: {…}. {…}"}
    - {code: 5072}
  storageFull:
    summary: The disk is full, so the message was not saved.
    match: [{code: 5070}]
  messageNotSaved:
    summary: Session storage failed to write, so the message was not saved.
    match: [{code: 5071}]
  backendRetiring:
    summary: The backend is shutting down; reconnect to continue.
    match: [{code: 5035, message: "backend is retiring; reconnect to continue"}]
