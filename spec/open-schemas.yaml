# Schema locations reviewed as free-form by design. The coverage gate counts a surface as typed when
# every open location it reaches is listed under `reviewed` with a reason and a reviewer: values of any
# shape (message content, tool arguments, vendor pass-through) and objects that keep undeclared keys as
# extras. `proposed` entries carry a reason but no reviewer yet and count only in
# `tools.coverage --assume-proposed`; move an entry to `reviewed` and add `reviewed_by` to sign it.
# Locations read `gateway:Component.field` or `rest:Component.field`; `[]` is an array item and `{}` a
# map value.
