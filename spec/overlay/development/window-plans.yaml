# Window plans (usage-window Nous subscriptions): the gateway contract additions of the Hermes development
# branch `window-plans` (rob-maron/hermes-agent, commit 2b8e9ffce4 "window plans"), merged on top of the
# pinned release by tools/development_overlay.py for every generator, the schema audit and coverage.
# An exception to the release-only tracking policy, authorised by the repository owner.
#
# gateway: copied verbatim from that commit's apps/shared/src/gateway-contract.openrpc.json. Only the
#   window-plans additions are taken; the branch is based on an older main, and its other differences from
#   the release (rollback.session_diff, refusal fields it predates) are not applied.
# rest: the same rows over REST (GET /api/model/options, hermes_cli/inventory.py `_attach_nous_plan_usage`
#   and `_apply_pricing` at that commit). The tagged handler is unchanged, so the operation keeps its
#   reviewed x-source / x-handler-hash in spec/overlay/rest/contracts/models.yaml; this file only adds the
#   optional fields to its row. PlanUsage and PlanUsageGauge are the gateway's schemas (Swift and Kotlin
#   name the REST copies RESTPlanUsage and RESTPlanUsageGauge).
#
# Merging fails once the pinned contract has any of these: drop the entry (or the file) then.
source:
  repository: rob-maron/hermes-agent
  branch: window-plans
  commit: 2b8e9ffce43b00c375ddce73f2446c870eb1c3a1
  subject: window plans
releases:
- v0.22.1
gateway:
  methods:
  - after: billing.charge_status
    method:
      name: billing.keep_going_on_credits
      summary: 'Window plans: turn ''Keep going on credits'' on/off (billing:manage).'
      params:
      - name: params
        schema:
          $ref: '#/components/schemas/BillingKeepGoingOnCreditsParams'
      result:
        name: result
        schema:
          $ref: '#/components/schemas/BillingMutationResult'
    # tui_gateway/methods_session.py `_billing_route`: like every billing route it answers a refusal as an
    # `ok: false` result, never a JSON-RPC error (the release's billing.* entries are empty too).
    errors: []
  schemas:
    BillingKeepGoingOnCreditsParams:
      additionalProperties: false
      properties:
        profile:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Profile
        enabled:
          default: false
          title: Enabled
          type: boolean
      title: BillingKeepGoingOnCreditsParams
      type: object
    PlanUsage:
      additionalProperties: false
      description: '``hermes_cli/model_picker_usage.py::PickerUsage.to_payload`` — usage-window plan chrome.'
      properties:
        kind:
          title: Kind
          type: string
        plan:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Plan
        gauges:
          items:
            $ref: '#/components/schemas/PlanUsageGauge'
          title: Gauges
          type: array
        top_tier_model_ids:
          items:
            type: string
          title: Top Tier Model Ids
          type: array
        featured_model_ids:
          items:
            type: string
          title: Featured Model Ids
          type: array
        paused_reason:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Paused Reason
        credits_pay:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Credits Pay
      required:
      - kind
      title: PlanUsage
      type: object
    PlanUsageGauge:
      additionalProperties: false
      description: 'One server allowance on ``ModelOptionProvider.plan_usage``, in the server''s order. ``label``
        is the

        server''s id (``day`` / ``week`` / ``month`` / ``top_tier`` have client words; any other id shows

        ``title``). ``scope``: which models a full one stops (``all`` / ``top_tier``).'
      properties:
        label:
          title: Label
          type: string
        left_fraction:
          title: Left Fraction
          type: number
        style:
          title: Style
          type: string
        resets_at_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Resets At Ms
        scope:
          default: all
          title: Scope
          type: string
        title:
          default: ''
          title: Title
          type: string
      required:
      - label
      - left_fraction
      - style
      title: PlanUsageGauge
      type: object
    UsageLimit:
      additionalProperties: false
      description: '``agent/plan_limits.py::LimitHit`` — a usage-window plan''s limit: what ran out, when it resets,
        and

        the one-click ways on (switch to a recommended model, use / add credits).'
      properties:
        gauge_id:
          title: Gauge Id
          type: string
        scope:
          title: Scope
          type: string
        limit_name:
          title: Limit Name
          type: string
        resets_at_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Resets At Ms
        message:
          title: Message
          type: string
        suggestions:
          items:
            $ref: '#/components/schemas/UsageLimitSuggestion'
          title: Suggestions
          type: array
        credits:
          anyOf:
          - $ref: '#/components/schemas/UsageLimitCredits'
          - type: 'null'
          default: null
        current_model:
          default: ''
          title: Current Model
          type: string
      required:
      - gauge_id
      - scope
      - limit_name
      - message
      title: UsageLimit
      type: object
    UsageLimitCredits:
      additionalProperties: false
      description: '``agent/plan_limits.py::CreditsOption`` — ``use_credits`` (turn on Keep going) or ``add_credits``.'
      properties:
        action:
          title: Action
          type: string
      required:
      - action
      title: UsageLimitCredits
      type: object
    UsageLimitSuggestion:
      additionalProperties: false
      description: '``agent/plan_limits.py::ModelSuggestion`` — a recommended model that still works past the limit.'
      properties:
        model:
          title: Model
          type: string
        label:
          title: Label
          type: string
        note:
          title: Note
          type: string
        provider:
          default: nous
          title: Provider
          type: string
      required:
      - model
      - label
      - note
      title: UsageLimitSuggestion
      type: object
  properties:
    BillingStateResult:
      keep_going_on_credits:
        after: auto_reload
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Keep Going On Credits
      plan_usage:
        after: usage
        schema:
          anyOf:
          - $ref: '#/components/schemas/PlanUsage'
          - type: 'null'
          default: null
    SubscriptionStateResult:
      plan_usage:
        after: usage
        schema:
          anyOf:
          - $ref: '#/components/schemas/PlanUsage'
          - type: 'null'
          default: null
    ModelOptionProvider:
      plan_usage:
        after: unavailable_models
        schema:
          anyOf:
          - $ref: '#/components/schemas/PlanUsage'
          - type: 'null'
          default: null
      usage_levels:
        after: plan_usage
        schema:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          default: null
          title: Usage Levels
    ErrorSurface:
      usage_limit:
        after: resets_at
        schema:
          anyOf:
          - $ref: '#/components/schemas/UsageLimit'
          - type: 'null'
          default: null
    SessionUsageResult:
      credits_usage_window:
        after: credits_lines
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Credits Usage Window
rest:
  x-source: hermes_cli/inventory.py
  gateway-schemas:
  - PlanUsage
  - PlanUsageGauge
  properties:
    ModelOptionProviderRow:
      plan_usage:
        schema:
          anyOf:
          - $ref: '#/components/schemas/PlanUsage'
          - type: 'null'
          description: '``_attach_nous_plan_usage``: ``PickerUsage.to_payload`` on the ``nous`` row of a usage-window
            plan; the same object as ``ModelOptionProvider.plan_usage``.'
      usage_levels:
        schema:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: '``model_picker_usage.usage_levels`` on a usage-window plan''s ``nous`` row: model id to
            its usage word (``free`` / ``low`` / ``medium`` / ``top_tier``). Such a row carries no ``pricing``.'
