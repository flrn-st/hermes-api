# re-run the importer rather than editing, and review changes like any overlay.
components:
  ActionStatusResponse:
    additionalProperties: false
    description: '``get_action_status``; ``action_id`` and ``receipt`` only for ``hermes-update``.'
    properties:
      action_id:
        anyOf:
        - type: string
        - type: 'null'
      exit_code:
        anyOf:
        - type: integer
        - type: 'null'
      lines:
        items:
          type: string
        type: array
      name:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      receipt:
        anyOf:
        - $ref: '#/components/schemas/UpdateReceiptSummary'
        - type: 'null'
      running:
        type: boolean
    required:
    - name
    - running
    - exit_code
    - pid
    - lines
    type: object
  GatewayDrainResponse:
    additionalProperties: false
    description: '``gateway_drain``: ``cancel`` answers ``was_draining``; ``drain`` echoes the marker it wrote

      (``gateway/drain_control.py::write_drain_request``) and whether a drain is now active.'
    properties:
      action:
        enum:
        - drain
        - cancel
        type: string
      draining:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      requested_at:
        anyOf:
        - type: string
        - type: 'null'
      suppress_notification:
        anyOf:
        - type: boolean
        - type: 'null'
      was_draining:
        anyOf:
        - type: boolean
        - type: 'null'
    required:
    - ok
    - action
    type: object
  GatewayMigrationPlanResponse:
    additionalProperties: false
    description: '``gateway_migrate_plan`` → ``hermes_cli/gateway_migrate.py::MigrationPlan.to_dict`` (the

      same JSON as ``hermes gateway migrate --plan``).'
    properties:
      already_multiplexed:
        type: boolean
      blockers:
        items:
          type: string
        type: array
      command:
        type: string
      default_home:
        type: string
      eligible:
        type: boolean
      interrupted:
        type: boolean
      live_served:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      multiplex_flag_on:
        type: boolean
      notices:
        items:
          type: string
        type: array
      profiles:
        items:
          $ref: '#/components/schemas/GatewayMigrationProfile'
        type: array
      standalone_by_config:
        items:
          type: string
        type: array
    required:
    - default_home
    - profiles
    - standalone_by_config
    - multiplex_flag_on
    - live_served
    - already_multiplexed
    - interrupted
    - blockers
    - notices
    - eligible
    - command
    type: object
  GatewayMigrationProfile:
    additionalProperties: false
    description: '``hermes_cli/gateway_migrate.py::ProfileGateway.to_dict``.'
    properties:
      home:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      profile:
        type: string
      run_as_user:
        anyOf:
        - type: string
        - type: 'null'
      runtime_home:
        anyOf:
        - type: string
        - type: 'null'
      service:
        anyOf:
        - $ref: '#/components/schemas/GatewayMigrationService'
        - type: 'null'
      services:
        items:
          $ref: '#/components/schemas/GatewayMigrationService'
        type: array
      uid:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - profile
    - home
    - pid
    - service
    - services
    - run_as_user
    - uid
    - runtime_home
    type: object
  GatewayMigrationService:
    additionalProperties: false
    description: '``hermes_cli/gateway_migrate.py::_service_dict`` — ``kind`` is ``systemd``, ``launchd``,

      ``s6`` or ``windows``; ``system`` marks a system-scope systemd unit.'
    properties:
      kind:
        type: string
      system:
        type: boolean
    required:
    - kind
    - system
    type: object
  UpdateReceiptResponse:
    additionalProperties: false
    description: '``get_update_receipt``: the full latest receipt plus its compact summary.'
    properties:
      receipt:
        $ref: '#/components/schemas/UpdateReceiptRecord'
      summary:
        anyOf:
        - $ref: '#/components/schemas/UpdateReceiptSummary'
        - type: 'null'
    required:
    - receipt
    - summary
    type: object
  UpdateReceiptSkip:
    additionalProperties: true
    description: '``hermes_cli/update_receipt.py::UpdateReceipt.skip``.'
    properties:
      at:
        type: string
      name:
        type: string
      reason:
        type: string
    required:
    - name
    - reason
    - at
    type: object
  UpdateReceiptStep:
    additionalProperties: true
    description: '``hermes_cli/update_receipt.py::UpdateReceipt.step``.'
    properties:
      at:
        type: string
      detail:
        type: string
      name:
        type: string
      ok:
        type: boolean
    required:
    - name
    - ok
    - detail
    - at
    type: object
  UpdateReceiptSummary:
    additionalProperties: false
    description: '``_latest_update_receipt_summary``; values are copied out of the receipt file, so any may be

      ``null`` when that receipt lacks them.'
    properties:
      finished_at:
        anyOf:
        - type: string
        - type: 'null'
      fleet_states:
        items:
          type: string
        type: array
      outcome:
        anyOf:
        - type: string
        - type: 'null'
      post_sha:
        anyOf:
        - type: string
        - type: 'null'
      post_version:
        anyOf:
        - type: string
        - type: 'null'
      pre_sha:
        anyOf:
        - type: string
        - type: 'null'
      started_at:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - outcome
    - started_at
    - finished_at
    - pre_sha
    - post_sha
    - post_version
    - fleet_states
    type: object
