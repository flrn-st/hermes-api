# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  ActionStatusResponse:
    additionalProperties: false
    description: '``get_action_status``; ``action_id`` and ``receipt`` only for ``hermes-update``.'
    properties:
      action_id:
        anyOf:
        - type: string
        - type: 'null'
      exit_code:
        anyOf:
        - type: integer
        - type: 'null'
      lines:
        items:
          type: string
        type: array
      name:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      receipt:
        anyOf:
        - $ref: '#/components/schemas/UpdateReceiptSummary'
        - type: 'null'
      running:
        type: boolean
    required:
    - name
    - running
    - exit_code
    - pid
    - lines
    type: object
  GatewayDrainResponse:
    additionalProperties: false
    description: '``gateway_drain``: ``cancel`` answers ``was_draining``; ``drain`` echoes the marker it wrote

      (``gateway/drain_control.py::write_drain_request``) and whether a drain is now active.'
    properties:
      action:
        enum:
        - drain
        - cancel
        type: string
      draining:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      requested_at:
        anyOf:
        - type: string
        - type: 'null'
      suppress_notification:
        anyOf:
        - type: boolean
        - type: 'null'
      was_draining:
        anyOf:
        - type: boolean
        - type: 'null'
    required:
    - ok
    - action
    type: object
  GatewayMigrationPlanResponse:
    additionalProperties: false
    description: '``gateway_migrate_plan`` → ``hermes_cli/gateway_migrate.py::MigrationPlan.to_dict`` (the

      same JSON as ``hermes gateway migrate --plan``).'
    properties:
      already_multiplexed:
        type: boolean
      blockers:
        items:
          type: string
        type: array
      command:
        type: string
      default_home:
        type: string
      eligible:
        type: boolean
      interrupted:
        type: boolean
      live_served:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      multiplex_flag_on:
        type: boolean
      notices:
        items:
          type: string
        type: array
      profiles:
        items:
          $ref: '#/components/schemas/GatewayMigrationProfile'
        type: array
      standalone_by_config:
        items:
          type: string
        type: array
    required:
    - default_home
    - profiles
    - standalone_by_config
    - multiplex_flag_on
    - live_served
    - already_multiplexed
    - interrupted
    - blockers
    - notices
    - eligible
    - command
    type: object
  GatewayMigrationProfile:
    additionalProperties: false
    description: '``hermes_cli/gateway_migrate.py::ProfileGateway.to_dict``.'
    properties:
      home:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      profile:
        type: string
      run_as_user:
        anyOf:
        - type: string
        - type: 'null'
      runtime_home:
        anyOf:
        - type: string
        - type: 'null'
      service:
        anyOf:
        - $ref: '#/components/schemas/GatewayMigrationService'
        - type: 'null'
      services:
        items:
          $ref: '#/components/schemas/GatewayMigrationService'
        type: array
      uid:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - profile
    - home
    - pid
    - service
    - services
    - run_as_user
    - uid
    - runtime_home
    type: object
  GatewayMigrationService:
    additionalProperties: false
    description: '``hermes_cli/gateway_migrate.py::_service_dict`` — ``kind`` is ``systemd``, ``launchd``,

      ``s6`` or ``windows``; ``system`` marks a system-scope systemd unit.'
    properties:
      kind:
        type: string
      system:
        type: boolean
    required:
    - kind
    - system
    type: object
  HermesUpdateCheckResponse:
    additionalProperties: false
    description: '``check_hermes_update``. ``behind``: commits behind, ``0`` up to date, ``-1`` behind by an

      unknown count, ``null`` when the check could not run or does not apply. ``commits`` only when

      an update is available, together with ``channel`` / ``branch`` / ``source_version`` (the release

      channel and release that pick its notes source; each null when the source check names none);

      ``rollback_to`` only when that "update" is a stable release older than this build.'
    properties:
      behind:
        anyOf:
        - type: integer
        - type: 'null'
      branch:
        anyOf:
        - type: string
        - type: 'null'
      can_apply:
        type: boolean
      channel:
        anyOf:
        - type: string
        - type: 'null'
      commits:
        anyOf:
        - items:
            $ref: '#/components/schemas/HermesUpdateCommit'
          type: array
        - type: 'null'
      current_version:
        type: string
      install_method:
        type: string
      message:
        anyOf:
        - type: string
        - type: 'null'
      rollback_to:
        anyOf:
        - type: string
        - type: 'null'
      source_version:
        anyOf:
        - type: string
        - type: 'null'
      update_available:
        type: boolean
      update_command:
        type: string
    required:
    - install_method
    - current_version
    - behind
    - update_available
    - can_apply
    - update_command
    - message
    type: object
  HermesUpdateCommit:
    additionalProperties: false
    description: '``hermes_cli/source_check.py::_commits`` row, reshaped by ``check_hermes_update``: ``sha``

      shortened to 7 chars, ``at`` in epoch seconds.'
    properties:
      at:
        type: integer
      author:
        type: string
      sha:
        type: string
      summary:
        type: string
    required:
    - sha
    - summary
    - author
    - at
    type: object
  HermesUpdateStartResponse:
    additionalProperties: false
    description: '``update_hermes``: a refusal (``ok: false`` + ``error``/``message``/``update_command``,

      via ``_update_refused``), the already-running update, or the freshly spawned one.'
    properties:
      action_id:
        anyOf:
        - type: string
        - type: 'null'
      already_running:
        anyOf:
        - type: boolean
        - type: 'null'
      error:
        anyOf:
        - type: string
        - type: 'null'
      message:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      ok:
        type: boolean
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      update_command:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    - pid
    - name
    type: object
  UpdateFollowup:
    additionalProperties: false
    description: A post-commit step a committed update still owes (``update_receipt`` follow-up).
    properties:
      reason:
        type: string
      step:
        type: string
    required:
    - step
    - reason
    type: object
  UpdateReceiptRecord:
    additionalProperties: true
    description: '``latest.json`` as ``hermes_cli/update_receipt.py`` wrote it, returned verbatim. The file

      outlives the code that wrote it, so every key may be absent; ``finalize_update_receipt`` also

      embeds ``pm_*`` sync sections, ``update_cmd_fleet`` adds ``runtime_outcomes``.'
    properties:
      argv:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      exit_code:
        anyOf:
        - type: integer
        - type: 'null'
      finished_at:
        anyOf:
        - type: string
        - type: 'null'
      fleet:
        anyOf:
        - items:
            additionalProperties: true
            type: object
          type: array
        - type: 'null'
      gateway_restart:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      outcome:
        anyOf:
        - type: string
        - type: 'null'
      pending_manual_serves:
        anyOf:
        - items:
            additionalProperties: true
            type: object
          type: array
        - type: 'null'
      pid:
        anyOf:
        - type: integer
        - type: 'null'
      plan:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      post_update:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      pre_update:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      schema:
        anyOf:
        - type: integer
        - type: 'null'
      skips:
        anyOf:
        - items:
            $ref: '#/components/schemas/UpdateReceiptSkip'
          type: array
        - type: 'null'
      started_at:
        anyOf:
        - type: string
        - type: 'null'
      steps:
        anyOf:
        - items:
            $ref: '#/components/schemas/UpdateReceiptStep'
          type: array
        - type: 'null'
      stop_reason:
        anyOf:
        - type: string
        - type: 'null'
      update_id:
        anyOf:
        - type: string
        - type: 'null'
    type: object
  UpdateReceiptResponse:
    additionalProperties: false
    description: '``get_update_receipt``: the full latest receipt plus its compact summary.'
    properties:
      receipt:
        $ref: '#/components/schemas/UpdateReceiptRecord'
      summary:
        anyOf:
        - $ref: '#/components/schemas/UpdateReceiptSummary'
        - type: 'null'
    required:
    - receipt
    - summary
    type: object
  UpdateReceiptSkip:
    additionalProperties: true
    description: '``hermes_cli/update_receipt.py::UpdateReceipt.skip``.'
    properties:
      at:
        type: string
      name:
        type: string
      reason:
        type: string
    required:
    - name
    - reason
    - at
    type: object
  UpdateReceiptStep:
    additionalProperties: true
    description: '``hermes_cli/update_receipt.py::UpdateReceipt.step``.'
    properties:
      at:
        type: string
      detail:
        type: string
      name:
        type: string
      ok:
        type: boolean
    required:
    - name
    - ok
    - detail
    - at
    type: object
  UpdateReceiptSummary:
    additionalProperties: false
    description: '``_latest_update_receipt_summary``; values are copied out of the receipt file, so any may be

      ``null`` when that receipt lacks them. ``action_id`` names the run the receipt belongs to.'
    properties:
      action_id:
        anyOf:
        - type: string
        - type: 'null'
      finished_at:
        anyOf:
        - type: string
        - type: 'null'
      fleet_states:
        items:
          type: string
        type: array
      followups:
        items:
          $ref: '#/components/schemas/UpdateFollowup'
        type: array
      outcome:
        anyOf:
        - type: string
        - type: 'null'
      post_sha:
        anyOf:
        - type: string
        - type: 'null'
      post_version:
        anyOf:
        - type: string
        - type: 'null'
      pre_sha:
        anyOf:
        - type: string
        - type: 'null'
      started_at:
        anyOf:
        - type: string
        - type: 'null'
      user_action:
        anyOf:
        - $ref: '#/components/schemas/UpdateUserAction'
        - type: 'null'
    required:
    - outcome
    - started_at
    - finished_at
    - action_id
    - pre_sha
    - post_sha
    - post_version
    - fleet_states
    - followups
    - user_action
    type: object
  UpdateUserAction:
    additionalProperties: true
    description: '``update_receipt.record_user_action``: something only the user can do is still owed; copied

      from the receipt file as stored.'
    properties:
      reason:
        type: string
      step:
        type: string
    required:
    - step
    - reason
    type: object
