# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  AudioSpeakResponse:
    additionalProperties: false
    description: '``speak_text``.'
    properties:
      data_url:
        description: '``data:<mime_type>;base64,<audio>``.'
        type: string
      mime_type:
        enum:
        - audio/mpeg
        - audio/ogg
        - audio/wav
        - audio/flac
        type: string
      ok:
        type: boolean
      provider:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    - data_url
    - mime_type
    - provider
    type: object
  AudioTranscriptionResponse:
    additionalProperties: false
    description: '``transcribe_audio_upload``; ``transcript`` is ``""`` when no speech was detected.'
    properties:
      ok:
        type: boolean
      provider:
        anyOf:
        - type: string
        - type: 'null'
      transcript:
        type: string
    required:
    - ok
    - transcript
    - provider
    type: object
  ElevenLabsVoice:
    additionalProperties: false
    properties:
      label:
        type: string
      name:
        type: string
      voice_id:
        type: string
    required:
    - voice_id
    - name
    - label
    type: object
  ElevenLabsVoicesResponse:
    additionalProperties: false
    description: '``get_elevenlabs_voices``; ``available: false`` with no key configured, or with

      ``error: "unauthorized"`` when ElevenLabs rejected the key.'
    properties:
      available:
        type: boolean
      error:
        anyOf:
        - const: unauthorized
          type: string
        - type: 'null'
      voices:
        items:
          $ref: '#/components/schemas/ElevenLabsVoice'
        type: array
    required:
    - available
    - voices
    type: object
  TtsLeaseResponse:
    additionalProperties: false
    description: '``tts_lease`` — the request''s ``lease`` / ``active`` plus

      ``tools/tts_tool_lifecycle.py::acquire_tts_lease`` (warm-up result) or ``release_tts_lease``

      (``released``). A lifecycle exception is reported in the body (``action: "error"``,

      ``leases: null``), never as an HTTP error.'
    properties:
      action:
        anyOf:
        - enum:
          - noop
          - loaded
          - cached
          - warmed
          - installed
          - error
          type: string
        - type: 'null'
      active:
        type: boolean
      elapsed_ms:
        anyOf:
        - type: integer
        - type: 'null'
      error:
        anyOf:
        - type: string
        - type: 'null'
      lease:
        type: string
      leases:
        anyOf:
        - type: integer
        - type: 'null'
      ok:
        type: boolean
      provider:
        anyOf:
        - type: string
        - type: 'null'
      released:
        anyOf:
        - type: integer
        - type: 'null'
      warmed:
        anyOf:
        - type: boolean
        - type: 'null'
    required:
    - ok
    - lease
    - active
    - leases
    type: object
  VoiceClientConfigResponse:
    additionalProperties: false
    description: '``get_client_voice_config`` — ``tools/voice_client_config.py::resolve_client_voice_config``.'
    properties:
      ok:
        type: boolean
      stt:
        $ref: '#/components/schemas/VoiceClientSttConfig'
      tts:
        $ref: '#/components/schemas/VoiceClientTtsConfig'
    required:
    - ok
    - stt
    - tts
    type: object
  VoiceClientSttConfig:
    additionalProperties: false
    description: '``tools/voice_client_config.py::_resolve_stt_client_config``. ``mode: "relay"`` carries only

      ``reason``; ``"direct"`` carries the provider wire and credentials.'
    properties:
      api_key:
        anyOf:
        - type: string
        - type: 'null'
      base_url:
        anyOf:
        - type: string
        - type: 'null'
      language:
        anyOf:
        - type: string
        - type: 'null'
      mode:
        enum:
        - relay
        - direct
        type: string
      model:
        anyOf:
        - type: string
        - type: 'null'
      provider:
        anyOf:
        - type: string
        - type: 'null'
      reason:
        anyOf:
        - type: string
        - type: 'null'
      timeout_s:
        anyOf:
        - type: number
        - type: 'null'
      wire:
        anyOf:
        - enum:
          - openai-multipart
          - xai-stt
          - elevenlabs-stt
          type: string
        - type: 'null'
    required:
    - mode
    type: object
  VoiceClientTtsConfig:
    additionalProperties: false
    description: '``tools/voice_client_config.py::_resolve_tts_client_config`` (same relay/direct split as

      STT). ``speed`` is ``null`` for providers that take none; ``extra_body`` is OpenAI-only.'
    properties:
      api_key:
        anyOf:
        - type: string
        - type: 'null'
      base_url:
        anyOf:
        - type: string
        - type: 'null'
      extra_body:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
        description: Optional ``lang_code`` / ``consent_attestation`` from ``tts.openai``.
      min_len:
        anyOf:
        - type: integer
        - type: 'null'
      mode:
        enum:
        - relay
        - direct
        type: string
      model:
        anyOf:
        - type: string
        - type: 'null'
      provider:
        anyOf:
        - type: string
        - type: 'null'
      reason:
        anyOf:
        - type: string
        - type: 'null'
      speed:
        anyOf:
        - type: number
        - type: 'null'
      voice:
        anyOf:
        - type: string
        - type: 'null'
      wire:
        anyOf:
        - enum:
          - openai-speech
          - elevenlabs-tts
          type: string
        - type: 'null'
    required:
    - mode
    type: object
  VoiceLiveSessionInfo:
    additionalProperties: true
    properties:
      id:
        anyOf:
        - type: string
        - type: 'null'
    type: object
  VoiceLiveSessionResponse:
    additionalProperties: true
    description: '``create_voice_live_session`` — ``{"ok": true}`` merged over the vendor''s

      ``POST /v1/live/sessions`` response (``tools/voice_live.py::create_webrtc_session``), which the

      vendor owns; the session id and SDP answer are the fields the renderer reads.'
    properties:
      ok:
        type: boolean
      session:
        anyOf:
        - $ref: '#/components/schemas/VoiceLiveSessionInfo'
        - type: 'null'
      transport:
        anyOf:
        - $ref: '#/components/schemas/VoiceLiveTransport'
        - type: 'null'
    required:
    - ok
    type: object
  VoiceLiveStatusResponse:
    additionalProperties: false
    description: '``get_voice_live_status`` — ``tools/voice_live.py::resolve_gpt_live_status``.'
    properties:
      available:
        type: boolean
      mode:
        enum:
        - chained
        - gpt-live
        type: string
      model:
        type: string
      ok:
        type: boolean
      reason:
        anyOf:
        - type: string
        - type: 'null'
      voice:
        type: string
    required:
    - ok
    - mode
    - available
    - reason
    - model
    - voice
    type: object
  VoiceLiveTransport:
    additionalProperties: true
    properties:
      sdp:
        anyOf:
        - type: string
        - type: 'null'
      type:
        anyOf:
        - type: string
        - type: 'null'
    type: object
