# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  ConfigDefaultsResponse:
    additionalProperties: true
    description: '``get_defaults`` — ``hermes_cli.config.DEFAULT_CONFIG`` verbatim (including

      ``_config_version``); its tree is owned by ``hermes_cli/config_defaults.py``.'
    properties: {}
    type: object
  ConfigResponse:
    additionalProperties: true
    description: '``get_config`` — the user''s config tree through ``_normalize_config_for_web`` minus the

      ``_``-prefixed internal keys. The sections are owned by ``DEFAULT_CONFIG`` / config.yaml, so

      only the keys the normaliser itself rewrites are typed.'
    properties:
      model:
        anyOf:
        - type: string
        - type: 'null'
      model_context_length:
        type: integer
    required:
    - model_context_length
    type: object
  ConfigSchemaField:
    additionalProperties: false
    description: 'One ``hermes_cli/web_server_config.py::_build_schema_from_config`` entry, with any

      ``_SCHEMA_OVERRIDES`` layered on (``_select`` adds ``options``/``searchable``/``clearable``).

      Dict values recurse into dotted keys, so ``_infer_type``''s ``"object"`` never reaches the wire.'
    properties:
      category:
        type: string
      clearable:
        anyOf:
        - type: boolean
        - type: 'null'
      description:
        type: string
      options:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      searchable:
        anyOf:
        - type: boolean
        - type: 'null'
      type:
        enum:
        - boolean
        - number
        - list
        - string
        - select
        type: string
    required:
    - type
    - description
    - category
    type: object
  ConfigSchemaResponse:
    additionalProperties: false
    description: '``get_schema`` — ``_schema_with_dynamic_provider_options`` keyed by dotted config path.'
    properties:
      category_order:
        items:
          type: string
        type: array
      fields:
        additionalProperties:
          $ref: '#/components/schemas/ConfigSchemaField'
        type: object
    required:
    - fields
    - category_order
    type: object
  CustomEndpointActivateResponse:
    additionalProperties: false
    description: '``activate_custom_endpoint``.'
    properties:
      model:
        type: string
      ok:
        type: boolean
      provider:
        type: string
    required:
    - ok
    - provider
    - model
    type: object
  CustomEndpointCurrentModel:
    additionalProperties: false
    properties:
      base_url:
        type: string
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    - base_url
    type: object
  CustomEndpointDeleteResponse:
    additionalProperties: false
    description: '``delete_custom_endpoint`` — the refreshed list.'
    properties:
      current:
        $ref: '#/components/schemas/CustomEndpointCurrentModel'
      endpoints:
        items:
          $ref: '#/components/schemas/CustomEndpointRow'
        type: array
      ok:
        type: boolean
    required:
    - endpoints
    - current
    - ok
    type: object
  CustomEndpointListResponse:
    additionalProperties: false
    description: '``list_custom_endpoints`` — ``_custom_endpoint_response``.'
    properties:
      current:
        $ref: '#/components/schemas/CustomEndpointCurrentModel'
      endpoints:
        items:
          $ref: '#/components/schemas/CustomEndpointRow'
        type: array
    required:
    - endpoints
    - current
    type: object
  CustomEndpointRow:
    additionalProperties: false
    description: One ``_endpoint_row``.
    properties:
      api_key_preview:
        anyOf:
        - type: string
        - type: 'null'
      api_mode:
        enum:
        - ''
        - chat_completions
        - codex_responses
        - anthropic_messages
        type: string
      base_url:
        type: string
      context_length:
        anyOf:
        - type: integer
        - type: 'null'
      discover_models:
        type: boolean
      has_api_key:
        type: boolean
      id:
        type: string
      is_current:
        type: boolean
      model:
        type: string
      models:
        items:
          type: string
        type: array
      name:
        type: string
      source:
        enum:
        - providers
        - custom_providers
        - direct-config
        type: string
    required:
    - id
    - name
    - base_url
    - model
    - models
    - api_mode
    - context_length
    - discover_models
    - has_api_key
    - api_key_preview
    - is_current
    - source
    type: object
  CustomEndpointUpsertResponse:
    additionalProperties: false
    description: '``upsert_custom_endpoint`` — the refreshed list plus the saved endpoint''s id.'
    properties:
      current:
        $ref: '#/components/schemas/CustomEndpointCurrentModel'
      endpoints:
        items:
          $ref: '#/components/schemas/CustomEndpointRow'
        type: array
      id:
        type: string
      ok:
        type: boolean
    required:
    - endpoints
    - current
    - ok
    - id
    type: object
  CustomEndpointValidateResponse:
    additionalProperties: false
    description: '``validate_custom_endpoint`` — the early failures carry only the first four keys.'
    properties:
      message:
        type: string
      model_details:
        anyOf:
        - items:
            $ref: '#/components/schemas/ProviderModelEntry'
          type: array
        - type: 'null'
      models:
        items:
          type: string
        type: array
      ok:
        type: boolean
      reachable:
        type: boolean
      resolved_base_url:
        anyOf:
        - type: string
        - type: 'null'
      transport_checked:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    - reachable
    - message
    - models
    type: object
  EgressStatusResponse:
    additionalProperties: false
    description: '``get_egress_status`` — ``hermes_cli/proxy_cli.py::format_status_text``.'
    properties:
      text:
        type: string
    required:
    - text
    type: object
  EnvProviderProfile:
    additionalProperties: false
    description: '``_catalog_provider_env_metadata._profile``: one provider sharing an env var with others.'
    properties:
      description:
        type: string
      primary:
        type: boolean
      provider:
        type: string
      provider_label:
        type: string
      url:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - provider
    - provider_label
    - description
    - url
    - primary
    type: object
  EnvVarInfo:
    additionalProperties: false
    description: 'One ``_get_env_vars_sync._row``: ``OPTIONAL_ENV_VARS`` prose layered over the provider

      catalog''s card metadata. ``GET /api/env`` returns ``{VAR_NAME: EnvVarInfo}``.'
    properties:
      advanced:
        type: boolean
      category:
        type: string
      channel_managed:
        type: boolean
      custom:
        type: boolean
      description:
        type: string
      is_password:
        type: boolean
      is_set:
        type: boolean
      provider:
        type: string
      provider_label:
        type: string
      provider_primary:
        type: boolean
      provider_profiles:
        description: Every built-in provider this credential serves; [] when only one does.
        items:
          $ref: '#/components/schemas/EnvProviderProfile'
        type: array
      redacted_value:
        anyOf:
        - type: string
        - type: 'null'
      tools:
        items:
          type: string
        type: array
      url:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - is_set
    - redacted_value
    - description
    - url
    - category
    - is_password
    - tools
    - advanced
    - channel_managed
    - provider
    - provider_label
    - provider_profiles
    - provider_primary
    - custom
    type: object
  EnvVarRemoveResponse:
    additionalProperties: false
    description: '``remove_env_var`` — ``credential_lifecycle.py::remove_provider_env_credential`` (the

      handler 404s when ``found`` is false, so a 200 always carries ``found: true``).'
    properties:
      config_scrubbed:
        items:
          type: string
        type: array
      found:
        type: boolean
      key:
        type: string
      ok:
        type: boolean
      pool_pruned:
        items:
          type: string
        type: array
      providers:
        items:
          type: string
        type: array
      removed:
        type: boolean
    required:
    - ok
    - key
    - removed
    - pool_pruned
    - providers
    - config_scrubbed
    - found
    type: object
  EnvVarRevealResponse:
    additionalProperties: false
    description: '``reveal_env_var``.'
    properties:
      key:
        type: string
      value:
        type: string
    required:
    - key
    - value
    type: object
  EnvVarSaveResponse:
    additionalProperties: false
    description: '``set_env_var`` — ``hermes_cli/credential_lifecycle.py::save_provider_env_credential``.'
    properties:
      config_updates:
        items:
          type: string
        type: array
      key:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - key
    - config_updates
    type: object
  ProviderCredentialValidateResponse:
    additionalProperties: false
    description: '``validate_provider_credential``; ``models``/``model_details``/``resolved_base_url`` only on

      the ``OPENAI_BASE_URL`` connectivity branch.'
    properties:
      message:
        type: string
      model_details:
        anyOf:
        - items:
            $ref: '#/components/schemas/ProviderModelEntry'
          type: array
        - type: 'null'
      models:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      ok:
        type: boolean
      reachable:
        type: boolean
      resolved_base_url:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    - reachable
    - message
    type: object
  ProviderModelEntry:
    additionalProperties: false
    description: 'One ``hermes_cli/web_server_profiles.py::_parse_model_entries`` row; the alias metadata is

      only present when the endpoint advertised it.'
    properties:
      canonical_model:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - id
    type: object
