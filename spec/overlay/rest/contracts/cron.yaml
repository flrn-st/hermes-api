# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  CronBlueprint:
    additionalProperties: false
    description: '``cron/blueprint_catalog.py::blueprint_catalog_entry``.'
    properties:
      appUrl:
        description: '``hermes://blueprint/...`` deep link.'
        type: string
      category:
        type: string
      command:
        description: Ready-to-paste ``/blueprint`` slash command.
        type: string
      description:
        type: string
      fields:
        items:
          $ref: '#/components/schemas/CronBlueprintField'
        type: array
      key:
        type: string
      schedule:
        description: Cron expression template with ``{slot}`` placeholders.
        type: string
      scheduleHuman:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - key
    - title
    - description
    - category
    - tags
    - fields
    - schedule
    - scheduleHuman
    - command
    - appUrl
    type: object
  CronBlueprintField:
    additionalProperties: false
    description: One ``cron/blueprint_catalog.py::BlueprintSlot`` as a form field.
    properties:
      default:
        anyOf:
        - type: string
        - type: 'null'
      help:
        type: string
      label:
        type: string
      name:
        type: string
      optional:
        type: boolean
      options:
        items:
          type: string
        type: array
      strict:
        description: 'False: ``options`` are suggestions, any value is accepted.'
        type: boolean
      type:
        enum:
        - time
        - enum
        - text
        - weekdays
        type: string
    required:
    - name
    - type
    - label
    - default
    - options
    - optional
    - strict
    - help
    type: object
  CronBlueprintsResponse:
    additionalProperties: false
    description: '``list_cron_blueprints``.'
    properties:
      blueprints:
        items:
          $ref: '#/components/schemas/CronBlueprint'
        type: array
    required:
    - blueprints
    type: object
  CronDeliveryTarget:
    additionalProperties: false
    description: '``cron/scheduler_delivery.py::cron_delivery_targets`` (plus the implicit ``local`` row).'
    properties:
      home_env_var:
        anyOf:
        - type: string
        - type: 'null'
      home_target_set:
        type: boolean
      id:
        type: string
      name:
        type: string
    required:
    - id
    - name
    - home_target_set
    - home_env_var
    type: object
  CronDeliveryTargetsResponse:
    additionalProperties: false
    description: '``get_cron_delivery_targets``.'
    properties:
      targets:
        items:
          $ref: '#/components/schemas/CronDeliveryTarget'
        type: array
    required:
    - targets
    type: object
  CronFireResponse:
    additionalProperties: false
    description: '``cron_fire_webhook`` success: its own ``gone``/``gateway_stopped`` answers, or the

      gateway api_server''s (``gateway/platforms/api_server.py::_handle_cron_fire``) passed through:

      ``accepted`` (202) or ``duplicate`` (200).'
    properties:
      detail:
        anyOf:
        - type: string
        - type: 'null'
      job_id:
        type: string
      profile:
        anyOf:
        - type: string
        - type: 'null'
      status:
        description: '"gone", "gateway_stopped", "duplicate" or "accepted".'
        type: string
    required:
    - status
    - job_id
    type: object
  CronJob:
    additionalProperties: true
    description: 'One ``jobs.json`` record as the dashboard sees it: ``cron/jobs.py::create_job`` fields

      (read paths go through ``_normalize_job_record``) plus the profile annotation of

      ``hermes_cli/web_server_cron.py::_annotate_cron_job``.


      Open because the scheduler stamps bookkeeping keys onto the record (``run_claim``,

      ``fire_claim``, ``pending_slot``, ``preflight_alerted``, quota-hold state, ...). Keys that

      ``create_job`` always writes are still optional here: legacy/hand-edited records may predate

      them, and readers fall back (``enabled`` defaults to true).'
    properties:
      attach_to_session:
        anyOf:
        - type: boolean
        - type: 'null'
      base_url:
        anyOf:
        - type: string
        - type: 'null'
      context_from:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      created_at:
        anyOf:
        - type: string
        - type: 'null'
      deliver:
        anyOf:
        - type: string
        - type: 'null'
      enabled:
        default: true
        type: boolean
      enabled_toolsets:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      failure_deliver:
        anyOf:
        - type: string
        - type: 'null'
      failure_streak:
        default: 0
        type: integer
      hermes_home:
        type: string
      id:
        type: string
      is_default_profile:
        type: boolean
      last_delivery_error:
        anyOf:
        - type: string
        - type: 'null'
      last_delivery_unverified:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        description: '``platform:chat_id`` targets acked without delivery evidence.'
      last_error:
        anyOf:
        - type: string
        - type: 'null'
      last_fire_error:
        anyOf:
        - $ref: '#/components/schemas/CronJobFireError'
        - type: 'null'
      last_run_at:
        anyOf:
        - type: string
        - type: 'null'
      last_status:
        anyOf:
        - type: string
        - type: 'null'
      latest_execution:
        anyOf:
        - $ref: '#/components/schemas/CronJobExecution'
        - type: 'null'
        description: Only on list rows (``cron/jobs.py::list_jobs``); null when never executed.
      manual_run_at:
        anyOf:
        - type: string
        - type: 'null'
      manual_run_prompt:
        anyOf:
        - type: string
        - type: 'null'
      model:
        anyOf:
        - type: string
        - type: 'null'
      monitor_script:
        anyOf:
        - type: string
        - type: 'null'
      monitor_state:
        anyOf:
        - $ref: '#/components/schemas/CronJobMonitorState'
        - type: 'null'
      monitor_url:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      next_run_at:
        anyOf:
        - type: string
        - type: 'null'
      no_agent:
        default: false
        type: boolean
      origin:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      paused_at:
        anyOf:
        - type: string
        - type: 'null'
      paused_reason:
        anyOf:
        - type: string
        - type: 'null'
      profile:
        type: string
      profile_name:
        type: string
      prompt:
        type: string
      provider:
        anyOf:
        - type: string
        - type: 'null'
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
      repeat:
        anyOf:
        - $ref: '#/components/schemas/CronJobRepeat'
        - type: 'null'
      schedule:
        $ref: '#/components/schemas/CronJobSchedule'
      schedule_display:
        type: string
      scheduler_heartbeat_age_s:
        anyOf:
        - type: number
        - type: 'null'
        description: Seconds since the profile's ticker last iterated; null when never/unknown.
      script:
        anyOf:
        - type: string
        - type: 'null'
      skill:
        anyOf:
        - type: string
        - type: 'null'
        description: 'Legacy single-skill alias: the first of ``skills``.'
      skills:
        items:
          type: string
        type: array
      state:
        description: Effective state; "scheduled", "paused", "completed" or "error".
        type: string
      workdir:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - id
    - name
    - prompt
    - skills
    - skill
    - schedule
    - schedule_display
    - state
    - profile
    - profile_name
    - hermes_home
    - is_default_profile
    - scheduler_heartbeat_age_s
    type: object
  CronJobExecution:
    additionalProperties: false
    description: One ``executions`` row of ``cron/executions.db`` (``cron/executions.py::latest_executions``).
    properties:
      claimed_at:
        type: string
      delivery_outcome:
        anyOf:
        - type: string
        - type: 'null'
      error:
        anyOf:
        - type: string
        - type: 'null'
      finished_at:
        anyOf:
        - type: string
        - type: 'null'
      handoff_pending:
        type: integer
      handoff_started_at:
        anyOf:
        - type: number
        - type: 'null'
      id:
        type: string
      job_id:
        type: string
      pid:
        type: integer
      process_id:
        type: string
      process_started_at:
        anyOf:
        - type: integer
        - type: 'null'
      scheduled_instant:
        anyOf:
        - type: string
        - type: 'null'
      source:
        type: string
      started_at:
        anyOf:
        - type: string
        - type: 'null'
      status:
        enum:
        - claimed
        - running
        - completed
        - failed
        - unknown
        type: string
    required:
    - id
    - job_id
    - source
    - process_id
    - pid
    - process_started_at
    - status
    - handoff_pending
    - handoff_started_at
    - claimed_at
    - started_at
    - finished_at
    - error
    - delivery_outcome
    - scheduled_instant
    type: object
  CronJobFireError:
    additionalProperties: false
    description: '``cron/jobs.py::note_fire_forward_failure``.'
    properties:
      at:
        type: string
      detail:
        type: string
    required:
    - at
    - detail
    type: object
  CronJobMonitorState:
    additionalProperties: false
    description: '``cron/monitor.py::_persist_monitor_state``.'
    properties:
      last_changed_at:
        type: string
      last_output_hash:
        type: string
    required:
    - last_output_hash
    - last_changed_at
    type: object
  CronJobRepeat:
    additionalProperties: false
    properties:
      completed:
        type: integer
      times:
        anyOf:
        - type: integer
        - type: 'null'
        description: None = forever.
    required:
    - times
    - completed
    type: object
  CronJobSchedule:
    additionalProperties: true
    description: '``cron/jobs.py::parse_schedule``; open because hand-edited/legacy records may carry other

      keys (``_schedule_display_for_job`` still reads a legacy ``value``).'
    properties:
      display:
        anyOf:
        - type: string
        - type: 'null'
      expr:
        anyOf:
        - type: string
        - type: 'null'
      kind:
        enum:
        - once
        - interval
        - cron
        type: string
      minutes:
        anyOf:
        - type: integer
        - type: 'null'
      run_at:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - kind
    type: object
