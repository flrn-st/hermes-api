# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  DashboardAuthBearerTokenResponse:
    additionalProperties: false
    description: '``_bearer_payload`` (``auth_native_token``, ``auth_native_refresh``): tokens in the body,

      no cookie.'
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      provider:
        type: string
      refresh_token:
        type: string
      token_type:
        const: Bearer
        type: string
      user_id:
        type: string
    required:
    - access_token
    - refresh_token
    - token_type
    - expires_at
    - provider
    - user_id
    type: object
  DashboardAuthMeResponse:
    additionalProperties: false
    description: '``api_auth_me``: the verified ``request.state.session`` minus its tokens. With the auth gate

      off it reports the loopback identity instead (``user_id: "local"``, ``provider: "loopback"``,

      ``expires_at: 0``).'
    properties:
      display_name:
        type: string
      email:
        type: string
      expires_at:
        type: integer
      org_id:
        type: string
      provider:
        type: string
      user_id:
        type: string
    required:
    - user_id
    - email
    - display_name
    - org_id
    - provider
    - expires_at
    type: object
  DashboardAuthPasswordLoginResponse:
    additionalProperties: false
    description: '``auth_password_login``: ``next`` is the validated landing path (session cookies set), or

      the desktop''s loopback redirect URL on a native sign-in (no cookies).'
    properties:
      next:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - next
    type: object
  DashboardAuthProviderOption:
    additionalProperties: false
    properties:
      display_name:
        type: string
      name:
        type: string
      supports_password:
        type: boolean
    required:
    - name
    - display_name
    - supports_password
    type: object
  DashboardAuthProvidersResponse:
    additionalProperties: false
    description: '``api_auth_providers``: the interactive (session) providers, the login page''s options.'
    properties:
      providers:
        items:
          $ref: '#/components/schemas/DashboardAuthProviderOption'
        type: array
    required:
    - providers
    type: object
  DashboardAuthWsTicketResponse:
    additionalProperties: false
    description: '``api_auth_ws_ticket``: a single-use WS upgrade ticket (``ws_tickets.TTL_SECONDS``).'
    properties:
      ticket:
        type: string
      ttl_seconds:
        type: integer
    required:
    - ticket
    - ttl_seconds
    type: object
