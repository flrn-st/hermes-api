components:
  ChatImageUploadResponse:
    additionalProperties: false
    description: '``upload_chat_image``: where the clipboard image landed under ``HERMES_HOME/images/``.'
    properties:
      bytes:
        type: integer
      mime_type:
        type: string
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - path
    - name
    - bytes
    - mime_type
    type: object
  FsDataUrlResponse:
    additionalProperties: false
    description: '``fs_read_data_url``.'
    properties:
      dataUrl:
        type: string
    required:
    - dataUrl
    type: object
  FsDefaultCwdResponse:
    additionalProperties: false
    description: '``fs_default_cwd``; ``branch`` is ``""`` outside a git checkout or on a detached HEAD.'
    properties:
      branch:
        type: string
      cwd:
        type: string
    required:
    - cwd
    - branch
    type: object
  FsGitRootResponse:
    additionalProperties: false
    description: '``fs_git_root``: the nearest ancestor holding ``.git``, else null.'
    properties:
      root:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - root
    type: object
  FsListEntry:
    additionalProperties: false
    properties:
      isDirectory:
        type: boolean
      name:
        type: string
      path:
        type: string
    required:
    - name
    - path
    - isDirectory
    type: object
  FsListResponse:
    additionalProperties: false
    description: '``fs_list``. A read failure is a 200 with ``entries: []`` and ``error`` (an errno name

      such as ``ENOENT``, else the OS ``strerror`` or ``"read-error"``).'
    properties:
      entries:
        items:
          $ref: '#/components/schemas/FsListEntry'
        type: array
      error:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - entries
    type: object
  FsReadTextResponse:
    additionalProperties: false
    description: '``fs_read_text``: a UTF-8 (``replace``) preview capped at 512 KiB.'
    properties:
      binary:
        type: boolean
      byteSize:
        type: integer
      language:
        type: string
      mimeType:
        type: string
      path:
        type: string
      text:
        type: string
      truncated:
        type: boolean
    required:
    - binary
    - byteSize
    - language
    - mimeType
    - path
    - text
    - truncated
    type: object
  FsWriteTextResponse:
    additionalProperties: false
    description: '``fs_write_text``.'
    properties:
      byteSize:
        type: integer
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - path
    - byteSize
    type: object
  ManagedFileDeleteResponse:
    additionalProperties: false
    description: '``delete_managed_file``.'
    properties:
      can_change_path:
        type: boolean
      locked_root:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      path:
        type: string
      root:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - root
    - locked_root
    - can_change_path
    - ok
    - path
    type: object
  ManagedFileEntry:
    additionalProperties: false
    description: '``hermes_cli/web_server_files.py::_managed_file_entry``; ``size``/``mime_type`` are null

      for directories.'
    properties:
      is_directory:
        type: boolean
      mime_type:
        anyOf:
        - type: string
        - type: 'null'
      mtime:
        type: number
      name:
        type: string
      path:
        type: string
      size:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - name
    - path
    - is_directory
    - size
    - mtime
    - mime_type
    type: object
  ManagedFileListResponse:
    additionalProperties: false
    description: '``list_managed_files``; ``parent`` is null at the filesystem or locked root.'
    properties:
      can_change_path:
        type: boolean
      entries:
        items:
          $ref: '#/components/schemas/ManagedFileEntry'
        type: array
      locked_root:
        anyOf:
        - type: string
        - type: 'null'
      parent:
        anyOf:
        - type: string
        - type: 'null'
      path:
        type: string
      root:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - root
    - locked_root
    - can_change_path
    - path
    - parent
    - entries
    type: object
  ManagedFileReadResponse:
    additionalProperties: false
    description: '``read_managed_file``.'
    properties:
      can_change_path:
        type: boolean
      data_url:
        type: string
      locked_root:
        anyOf:
        - type: string
        - type: 'null'
      mime_type:
        type: string
      name:
        type: string
      path:
        type: string
      root:
        anyOf:
        - type: string
        - type: 'null'
      size:
        type: integer
    required:
    - root
    - locked_root
    - can_change_path
    - name
    - path
    - size
    - mime_type
    - data_url
    type: object
  ManagedFileWriteResponse:
    additionalProperties: false
    description: '``_managed_write_result`` (upload, upload-stream, mkdir).'
    properties:
      can_change_path:
        type: boolean
      entry:
        $ref: '#/components/schemas/ManagedFileEntry'
      locked_root:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      path:
        type: string
      root:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - root
    - locked_root
    - can_change_path
    - ok
    - entry
    - path
    type: object
  MediaDataUrlResponse:
    additionalProperties: false
    description: '``get_media``: an allowlisted image under the media roots as a base64 ``data:`` URL.'
    properties:
      data_url:
        type: string
    required:
    - data_url
    type: object
