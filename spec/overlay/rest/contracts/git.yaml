# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  GitBaseBranchRow:
    additionalProperties: false
    description: '``web_git.base_branch_list`` row.'
    properties:
      isDefault:
        type: boolean
      isRemote:
        type: boolean
      name:
        type: string
    required:
    - name
    - isRemote
    - isDefault
    type: object
  GitBaseBranchesResponse:
    additionalProperties: false
    description: '``git_base_branches_route``.'
    properties:
      branches:
        items:
          $ref: '#/components/schemas/GitBaseBranchRow'
        type: array
    required:
    - branches
    type: object
  GitBranchRow:
    additionalProperties: false
    description: '``web_git.branch_list`` row: local heads, then remote-tracking refs without a local head.'
    properties:
      checkedOut:
        type: boolean
      isDefault:
        type: boolean
      isRemote:
        type: boolean
      name:
        type: string
      worktreePath:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - name
    - checkedOut
    - isDefault
    - isRemote
    - worktreePath
    type: object
  GitBranchSwitchResponse:
    additionalProperties: false
    description: '``web_git.branch_switch`` — the sanitized branch that was switched to.'
    properties:
      branch:
        type: string
    required:
    - branch
    type: object
  GitBranchesResponse:
    additionalProperties: false
    description: '``git_branches_route``.'
    properties:
      branches:
        items:
          $ref: '#/components/schemas/GitBranchRow'
        type: array
    required:
    - branches
    type: object
  GitCommitContextResponse:
    additionalProperties: false
    description: '``web_git.review_commit_context`` — the diff that will commit plus recent subjects.'
    properties:
      diff:
        type: string
      recent:
        type: string
    required:
    - diff
    - recent
    type: object
  GitCreatePrResponse:
    additionalProperties: false
    description: '``web_git.review_create_pr`` — the last non-empty line ``gh pr create`` printed.'
    properties:
      url:
        type: string
    required:
    - url
    type: object
  GitDiffResponse:
    additionalProperties: false
    description: '``git_review_diff_route`` / ``git_file_diff_route``: unified diff text (``""`` when none).'
    properties:
      diff:
        type: string
    required:
    - diff
    type: object
  GitHubCliAuthResponse:
    additionalProperties: false
    description: '``git._probe_gh_auth`` (cached 5 min by ``gh_auth_status_route``).'
    properties:
      authenticated:
        type: boolean
      available:
        type: boolean
    required:
    - available
    - authenticated
    type: object
  GitPrListResponse:
    additionalProperties: false
    description: '``web_git.review_pr_list``.'
    properties:
      ghReady:
        type: boolean
      prs:
        items:
          $ref: '#/components/schemas/GitPullRequestRow'
        type: array
    required:
    - ghReady
    - prs
    type: object
  GitPullRequestRow:
    additionalProperties: false
    description: '``web_git._pr_payload``; ``state`` is GitHub''s PR state lowercased.'
    properties:
      branch:
        type: string
      draft:
        type: boolean
      number:
        type: integer
      state:
        type: string
      title:
        type: string
      url:
        type: string
    required:
    - branch
    - draft
    - number
    - state
    - title
    - url
    type: object
  GitRepoStatusResponse:
    additionalProperties: false
    description: '``web_git.repo_status`` (the route answers ``null`` for a non-repo). The four flag

      counters and ``changed`` cover every file; ``files`` is capped at 200.'
    properties:
      added:
        type: integer
      ahead:
        type: integer
      behind:
        type: integer
      branch:
        anyOf:
        - type: string
        - type: 'null'
      changed:
        type: integer
      conflicted:
        type: integer
      defaultBranch:
        anyOf:
        - type: string
        - type: 'null'
      detached:
        type: boolean
      files:
        items:
          $ref: '#/components/schemas/GitStatusFile'
        type: array
      removed:
        type: integer
      staged:
        type: integer
      unstaged:
        type: integer
      untracked:
        type: integer
    required:
    - branch
    - defaultBranch
    - detached
    - ahead
    - behind
    - staged
    - unstaged
    - untracked
    - conflicted
    - changed
    - added
    - removed
    - files
    type: object
  GitRevParseResponse:
    additionalProperties: false
    description: '``git_rev_parse_route``; ``null`` when the ref does not resolve.'
    properties:
      sha:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - sha
    type: object
  GitReviewFile:
    additionalProperties: false
    description: '``web_git.review_list`` row. ``status`` is ``"?"`` (untracked), ``"U"`` (conflicted) or

      git''s index/worktree code letter (``M``, ``A``, ``D``, ``R``, ...).'
    properties:
      added:
        type: integer
      path:
        type: string
      removed:
        type: integer
      staged:
        type: boolean
      status:
        type: string
    required:
    - path
    - added
    - removed
    - status
    - staged
    type: object
  GitReviewListResponse:
    additionalProperties: false
    description: '``web_git.review_list``; ``base`` is the resolved base ref for the branch/lastTurn scopes.'
    properties:
      base:
        anyOf:
        - type: string
        - type: 'null'
      files:
        items:
          $ref: '#/components/schemas/GitReviewFile'
        type: array
    required:
    - files
    - base
    type: object
  GitShipInfoPr:
    additionalProperties: false
    description: The ``gh pr view --json url,state,number`` fields ``web_git.review_ship_info`` keeps.
    properties:
      number:
        anyOf:
        - type: integer
        - type: 'null'
      state:
        anyOf:
        - type: string
        - type: 'null'
      url:
        type: string
    required:
    - url
    - state
    - number
    type: object
  GitShipInfoResponse:
    additionalProperties: false
    description: '``web_git.review_ship_info``.'
    properties:
      ghReady:
        type: boolean
      pr:
        anyOf:
        - $ref: '#/components/schemas/GitShipInfoPr'
        - type: 'null'
    required:
    - ghReady
    - pr
    type: object
  GitStatusFile:
    additionalProperties: false
    description: '``web_git._classify``.'
    properties:
      conflicted:
        type: boolean
      path:
        type: string
      staged:
        type: boolean
      unstaged:
        type: boolean
      untracked:
        type: boolean
    required:
    - path
    - staged
    - unstaged
    - untracked
    - conflicted
    type: object
  GitWorktreeAddResponse:
    additionalProperties: false
    description: '``web_git.worktree_add`` / ``web_git._worktree_for_existing``.'
    properties:
      branch:
        type: string
      path:
        type: string
      repoRoot:
        type: string
    required:
    - path
    - branch
    - repoRoot
    type: object
  GitWorktreeRemoveResponse:
    additionalProperties: false
    description: '``web_git.worktree_remove``.'
    properties:
      removed:
        type: string
    required:
    - removed
    type: object
  GitWorktreeRow:
    additionalProperties: false
    description: '``web_git.worktree_list`` row; the main tree comes first.'
    properties:
      branch:
        anyOf:
        - type: string
        - type: 'null'
      detached:
        type: boolean
      isMain:
        type: boolean
      locked:
        type: boolean
      path:
        type: string
    required:
    - path
    - branch
    - isMain
    - detached
    - locked
    type: object
  GitWorktreesResponse:
    additionalProperties: false
    description: '``git_worktrees_route``.'
    properties:
      worktrees:
        items:
          $ref: '#/components/schemas/GitWorktreeRow'
        type: array
    required:
    - worktrees
    type: object
