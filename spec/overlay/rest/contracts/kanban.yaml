# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  KanbanActiveWorker:
    additionalProperties: false
    description: '``list_active_workers`` SQL row (open run with a ``worker_pid`` on a running task).'
    properties:
      claim_expires:
        anyOf:
        - type: integer
        - type: 'null'
      claim_lock:
        anyOf:
        - type: string
        - type: 'null'
      last_heartbeat_at:
        anyOf:
        - type: integer
        - type: 'null'
      max_runtime_seconds:
        anyOf:
        - type: integer
        - type: 'null'
      profile:
        anyOf:
        - type: string
        - type: 'null'
      run_id:
        type: integer
      started_at:
        type: integer
      task_assignee:
        anyOf:
        - type: string
        - type: 'null'
      task_id:
        type: string
      task_status:
        type: string
      task_title:
        type: string
      worker_pid:
        type: integer
    required:
    - run_id
    - task_id
    - task_title
    - task_status
    - task_assignee
    - profile
    - worker_pid
    - started_at
    - claim_lock
    - claim_expires
    - last_heartbeat_at
    - max_runtime_seconds
    type: object
  KanbanActiveWorkersResponse:
    additionalProperties: false
    description: '``plugin_api.list_active_workers``.'
    properties:
      checked_at:
        type: integer
      count:
        type: integer
      workers:
        items:
          $ref: '#/components/schemas/KanbanActiveWorker'
        type: array
    required:
    - workers
    - count
    - checked_at
    type: object
  KanbanAssignee:
    additionalProperties: false
    description: '``kanban_db.known_assignees`` row.'
    properties:
      counts:
        additionalProperties:
          type: integer
        type: object
      name:
        type: string
      on_disk:
        type: boolean
    required:
    - name
    - on_disk
    - counts
    type: object
  KanbanAssigneesResponse:
    additionalProperties: false
    description: '``plugin_api.get_assignees``.'
    properties:
      assignees:
        items:
          $ref: '#/components/schemas/KanbanAssignee'
        type: array
    required:
    - assignees
    type: object
  KanbanAttachment:
    additionalProperties: false
    description: '``plugin_api._attachment_dict``; ``stored_path`` is the absolute path workers read.'
    properties:
      content_type:
        anyOf:
        - type: string
        - type: 'null'
      created_at:
        type: integer
      filename:
        type: string
      id:
        type: integer
      size:
        type: integer
      stored_path:
        type: string
      task_id:
        type: string
      uploaded_by:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - id
    - task_id
    - filename
    - content_type
    - size
    - uploaded_by
    - stored_path
    - created_at
    type: object
  KanbanAttachmentDeleteResponse:
    additionalProperties: false
    description: '``plugin_api.remove_attachment``.'
    properties:
      id:
        type: integer
      ok:
        type: boolean
    required:
    - ok
    - id
    type: object
  KanbanAttachmentListResponse:
    additionalProperties: false
    description: '``plugin_api.list_task_attachments``.'
    properties:
      attachments:
        items:
          $ref: '#/components/schemas/KanbanAttachment'
        type: array
    required:
    - attachments
    type: object
  KanbanAttachmentUploadResponse:
    additionalProperties: false
    description: '``plugin_api.upload_task_attachment``.'
    properties:
      attachment:
        anyOf:
        - $ref: '#/components/schemas/KanbanAttachment'
        - type: 'null'
    required:
    - attachment
    type: object
  KanbanBoard:
    additionalProperties: true
    description: '``plugin_api._annotate_board_meta`` (create / rename).'
    properties:
      archived:
        type: boolean
      color:
        type: string
      created_at:
        anyOf:
        - type: integer
        - type: 'null'
      db_path:
        type: string
      default_workdir:
        anyOf:
        - type: string
        - type: 'null'
      default_workspace_kind:
        enum:
        - scratch
        - worktree
        - dir
        type: string
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      project_id:
        anyOf:
        - type: string
        - type: 'null'
      project_name:
        anyOf:
        - type: string
        - type: 'null'
      slug:
        type: string
    required:
    - slug
    - name
    - description
    - icon
    - color
    - default_workdir
    - project_id
    - created_at
    - archived
    - db_path
    - default_workspace_kind
    - project_name
    type: object
  KanbanBoardColumn:
    additionalProperties: false
    properties:
      name:
        enum:
        - triage
        - todo
        - scheduled
        - ready
        - running
        - blocked
        - review
        - done
        - archived
        type: string
      tasks:
        items:
          $ref: '#/components/schemas/KanbanBoardCard'
        type: array
    required:
    - name
    - tasks
    type: object
  KanbanBoardCreateResponse:
    additionalProperties: false
    description: '``plugin_api.create_board_endpoint``.'
    properties:
      board:
        $ref: '#/components/schemas/KanbanBoard'
      current:
        type: string
    required:
    - board
    - current
    type: object
  KanbanBoardDeleteResponse:
    additionalProperties: false
    description: '``plugin_api.delete_board``.'
    properties:
      current:
        type: string
      result:
        $ref: '#/components/schemas/KanbanBoardRemoval'
    required:
    - result
    - current
    type: object
  KanbanBoardExportResponse:
    additionalProperties: false
    description: '``kanban_transfer.export_board``; ``counts`` = per-table rows + ``attachment_files`` /

      ``log_files``.'
    properties:
      archive:
        type: string
      board:
        type: string
      counts:
        additionalProperties:
          type: integer
        type: object
      size:
        type: integer
    required:
    - board
    - archive
    - size
    - counts
    type: object
  KanbanBoardImportResponse:
    additionalProperties: false
    description: '``kanban_transfer.import_board`` plus the active board slug.'
    properties:
      activated:
        type: boolean
      attachments_restored:
        type: integer
      board:
        type: string
      counts:
        additionalProperties:
          type: integer
        type: object
      current:
        type: string
      db_path:
        type: string
      name:
        type: string
      path:
        type: string
      renamed:
        type: boolean
      requested_board:
        type: string
      source:
        $ref: '#/components/schemas/KanbanBoardImportSource'
      tasks_parked:
        type: integer
      warnings:
        items:
          type: string
        type: array
    required:
    - board
    - requested_board
    - renamed
    - name
    - path
    - db_path
    - source
    - counts
    - attachments_restored
    - tasks_parked
    - warnings
    - activated
    - current
    type: object
  KanbanBoardImportSource:
    additionalProperties: false
    description: Read from the archive's ``manifest.json``; absent keys come back ``null``.
    properties:
      board:
        anyOf:
        - type: string
        - type: 'null'
      exported_at:
        anyOf:
        - type: integer
        - type: 'null'
      hermes_version:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - board
    - exported_at
    - hermes_version
    type: object
  KanbanBoardListResponse:
    additionalProperties: false
    description: '``plugin_api.list_boards``.'
    properties:
      boards:
        items:
          $ref: '#/components/schemas/KanbanBoardListRow'
        type: array
      current:
        type: string
    required:
    - boards
    - current
    type: object
  KanbanBoardListRow:
    additionalProperties: true
    description: 'One ``list_boards`` row; ``counts`` is ``{status: n}`` incl. archived, ``total`` excludes it.'
    properties:
      archived:
        type: boolean
      color:
        type: string
      counts:
        additionalProperties:
          type: integer
        type: object
      created_at:
        anyOf:
        - type: integer
        - type: 'null'
      db_path:
        type: string
      default_workdir:
        anyOf:
        - type: string
        - type: 'null'
      default_workspace_kind:
        enum:
        - scratch
        - worktree
        - dir
        type: string
      description:
        type: string
      icon:
        type: string
      is_current:
        type: boolean
      name:
        type: string
      project_id:
        anyOf:
        - type: string
        - type: 'null'
      project_name:
        anyOf:
        - type: string
        - type: 'null'
      slug:
        type: string
      total:
        type: integer
    required:
    - slug
    - name
    - description
    - icon
    - color
    - default_workdir
    - project_id
    - created_at
    - archived
    - db_path
    - default_workspace_kind
    - project_name
    - is_current
    - counts
    - total
    type: object
  KanbanBoardRemoval:
    additionalProperties: false
    description: '``kanban_db.remove_board``; ``new_path`` is ``""`` for a hard delete.'
    properties:
      action:
        enum:
        - archived
        - deleted
        type: string
      new_path:
        type: string
      slug:
        type: string
    required:
    - slug
    - action
    - new_path
    type: object
  KanbanBoardResponse:
    additionalProperties: false
    description: '``plugin_api.get_board`` — ``archived`` column only with ``include_archived``.'
    properties:
      assignees:
        items:
          type: string
        type: array
      columns:
        items:
          $ref: '#/components/schemas/KanbanBoardColumn'
        type: array
      latest_event_id:
        type: integer
      now:
        type: integer
      tenants:
        items:
          type: string
        type: array
    required:
    - columns
    - tenants
    - assignees
    - latest_event_id
    - now
    type: object
  KanbanBoardSwitchResponse:
    additionalProperties: false
    description: '``plugin_api.switch_board``.'
    properties:
      current:
        type: string
    required:
    - current
    type: object
  KanbanBoardUpdateResponse:
    additionalProperties: false
    description: '``plugin_api.rename_board``.'
    properties:
      board:
        $ref: '#/components/schemas/KanbanBoard'
    required:
    - board
    type: object
  KanbanBulkResult:
    additionalProperties: false
    properties:
      error:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      ok:
        type: boolean
    required:
    - id
    - ok
    type: object
  KanbanBulkUpdateResponse:
    additionalProperties: false
    description: '``plugin_api.bulk_update`` — one outcome per id.'
    properties:
      results:
        items:
          $ref: '#/components/schemas/KanbanBulkResult'
        type: array
    required:
    - results
    type: object
  KanbanChildProgress:
    additionalProperties: false
    properties:
      done:
        type: integer
      total:
        type: integer
    required:
    - done
    - total
    type: object
  KanbanDashboardConfigResponse:
    additionalProperties: false
    description: '``plugin_api.get_config`` — the ``dashboard.kanban`` config section with defaults.'
    properties:
      default_tenant:
        type: string
      include_archived_by_default:
        type: boolean
      lane_by_profile:
        type: boolean
      render_markdown:
        type: boolean
    required:
    - default_tenant
    - lane_by_profile
    - include_archived_by_default
    - render_markdown
    type: object
  KanbanDecomposeResponse:
    additionalProperties: false
    description: '``plugin_api.decompose_task_endpoint`` (``kanban_decompose.DecomposeOutcome``); non-OK is 200.'
    properties:
      child_ids:
        items:
          type: string
        type: array
      fanout:
        type: boolean
      new_title:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      reason:
        type: string
      task_id:
        type: string
    required:
    - ok
    - task_id
    - reason
    - fanout
    - child_ids
    - new_title
    type: object
  KanbanDiagnostic:
    additionalProperties: false
    description: '``kanban_diagnostics.Diagnostic.to_dict`` — one active distress signal on a task.'
    properties:
      actions:
        items:
          $ref: '#/components/schemas/KanbanDiagnosticAction'
        type: array
      count:
        type: integer
      data:
        additionalProperties: true
        type: object
      detail:
        type: string
      first_seen_at:
        type: integer
      kind:
        type: string
      last_seen_at:
        type: integer
      run_id:
        anyOf:
        - type: integer
        - type: 'null'
      severity:
        enum:
        - warning
        - error
        - critical
        type: string
      title:
        type: string
    required:
    - kind
    - severity
    - title
    - detail
    - actions
    - first_seen_at
    - last_seen_at
    - count
    - run_id
    - data
    type: object
  KanbanDiagnosticAction:
    additionalProperties: false
    description: '``kanban_diagnostics.DiagnosticAction.to_dict``; ``payload`` is per-``kind``.'
    properties:
      kind:
        type: string
      label:
        type: string
      payload:
        additionalProperties: true
        type: object
      suggested:
        type: boolean
    required:
    - kind
    - label
    - payload
    - suggested
    type: object
  KanbanDiagnosticsResponse:
    additionalProperties: false
    description: '``plugin_api.list_diagnostics``; ``count`` is the number of diagnostics, not tasks.'
    properties:
      count:
        type: integer
      diagnostics:
        items:
          $ref: '#/components/schemas/KanbanTaskDiagnostics'
        type: array
    required:
    - diagnostics
    - count
    type: object
  KanbanDispatchResponse:
    additionalProperties: false
    description: '``asdict(kanban_db_dispatch.DispatchResult)`` from ``plugin_api.dispatch``.'
    properties:
      auto_assigned_default:
        items:
          type: string
        type: array
      auto_blocked:
        items:
          type: string
        type: array
      crashed:
        items:
          type: string
        type: array
      memory_pressure:
        anyOf:
        - enum:
          - critical
          - elevated
          type: string
        - type: 'null'
      promoted:
        type: integer
      rate_limited:
        items:
          type: string
        type: array
      reaped_terminal_workers:
        items:
          type: string
        type: array
      reclaimed:
        type: integer
      reconciled_orphans:
        items:
          type: string
        type: array
      respawn_guarded:
        items:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: string
          - type: string
          type: array
        type: array
      skipped_locked:
        type: boolean
      skipped_nonspawnable:
        items:
          type: string
        type: array
      skipped_per_profile_capped:
        items:
          maxItems: 3
          minItems: 3
          prefixItems:
          - type: string
          - type: string
          - type: integer
          type: array
        type: array
      skipped_unassigned:
        items:
          type: string
        type: array
      spawned:
        items:
          maxItems: 3
          minItems: 3
          prefixItems:
          - type: string
          - type: string
          - type: string
          type: array
        type: array
      stale:
        items:
          type: string
        type: array
      timed_out:
        items:
          type: string
        type: array
    required:
    - reclaimed
    - promoted
    - reconciled_orphans
    - reaped_terminal_workers
    - spawned
    - skipped_unassigned
    - auto_assigned_default
    - skipped_nonspawnable
    - skipped_per_profile_capped
    - crashed
    - auto_blocked
    - timed_out
    - stale
    - respawn_guarded
    - rate_limited
    - skipped_locked
    - memory_pressure
    type: object
  KanbanEstimateResponse:
    additionalProperties: false
    description: '``plugin_api._run_estimate``: ``{ok: false, reason}`` or the parsed estimate.'
    properties:
      complexity:
        anyOf:
        - enum:
          - S
          - M
          - L
          type: string
        - type: 'null'
      est_tokens:
        anyOf:
        - type: integer
        - type: 'null'
      model:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      rationale:
        anyOf:
        - type: string
        - type: 'null'
      reason:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    type: object
  KanbanHomeChannel:
    additionalProperties: false
    description: '``plugin_api._configured_home_channels`` row; ``thread_id`` is ``""`` when unset.'
    properties:
      chat_id:
        type: string
      name:
        type: string
      platform:
        type: string
      thread_id:
        type: string
    required:
    - platform
    - chat_id
    - thread_id
    - name
    type: object
  KanbanHomeChannelState:
    additionalProperties: false
    properties:
      chat_id:
        type: string
      name:
        type: string
      platform:
        type: string
      subscribed:
        type: boolean
      thread_id:
        type: string
    required:
    - platform
    - chat_id
    - thread_id
    - name
    - subscribed
    type: object
  KanbanHomeChannelsResponse:
    additionalProperties: false
    description: '``plugin_api.get_home_channels``.'
    properties:
      home_channels:
        items:
          $ref: '#/components/schemas/KanbanHomeChannelState'
        type: array
    required:
    - home_channels
    type: object
  KanbanHomeSubscriptionResponse:
    additionalProperties: false
    description: '``plugin_api.subscribe_home`` / ``unsubscribe_home``.'
    properties:
      home_channel:
        $ref: '#/components/schemas/KanbanHomeChannel'
      ok:
        type: boolean
      task_id:
        type: string
    required:
    - ok
    - task_id
    - home_channel
    type: object
  KanbanLinkAddResponse:
    additionalProperties: false
    description: '``plugin_api.add_link``; ``gated`` = the link demoted a ready child back to ``todo``.'
    properties:
      gated:
        type: boolean
      ok:
        type: boolean
    required:
    - ok
    - gated
    type: object
  KanbanLinkCounts:
    additionalProperties: false
    properties:
      children:
        type: integer
      parents:
        type: integer
    required:
    - parents
    - children
    type: object
  KanbanModelOptionProvider:
    additionalProperties: false
    properties:
      label:
        type: string
      models:
        items:
          type: string
        type: array
      slug:
        type: string
    required:
    - slug
    - label
    - models
    type: object
  KanbanModelOptionsResponse:
    additionalProperties: false
    description: '``plugin_api.model_options``; ``providers`` is ``[]`` when the catalog fails to load.'
    properties:
      providers:
        items:
          $ref: '#/components/schemas/KanbanModelOptionProvider'
        type: array
    required:
    - providers
    type: object
  KanbanOrchestrationResponse:
    additionalProperties: false
    description: '``plugin_api.get_orchestration_settings`` (PUT returns the same); an unset profile is

      ``""`` while its ``resolved_*`` twin falls back to ``active_profile``.'
    properties:
      active_profile:
        type: string
      auto_decompose:
        type: boolean
      auto_promote_children:
        type: boolean
      default_assignee:
        type: string
      orchestrator_profile:
        type: string
      resolved_default_assignee:
        type: string
      resolved_orchestrator_profile:
        type: string
    required:
    - orchestrator_profile
    - default_assignee
    - auto_decompose
    - auto_promote_children
    - resolved_orchestrator_profile
    - resolved_default_assignee
    - active_profile
    type: object
  KanbanProfile:
    additionalProperties: false
    description: '``plugin_api.list_profile_roster`` row; empty strings for unset fields.'
    properties:
      description:
        type: string
      description_auto:
        type: boolean
      is_default:
        type: boolean
      model:
        type: string
      name:
        type: string
      provider:
        type: string
      skill_count:
        type: integer
    required:
    - name
    - is_default
    - model
    - provider
    - description
    - description_auto
    - skill_count
    type: object
  KanbanProfileAutoDescribeResponse:
    additionalProperties: false
    description: '``plugin_api.auto_describe_profile`` (``profile_describer.DescribeOutcome``); non-OK is 200.'
    properties:
      description:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      profile:
        type: string
      reason:
        type: string
    required:
    - ok
    - profile
    - reason
    - description
    type: object
  KanbanProfileDescriptionResponse:
    additionalProperties: false
    description: '``plugin_api.update_profile_description``; ``profile`` is the canonical name.'
    properties:
      description:
        type: string
      ok:
        type: boolean
      profile:
        type: string
    required:
    - ok
    - profile
    - description
    type: object
  KanbanProfilesResponse:
    additionalProperties: false
    description: '``plugin_api.list_profile_roster``.'
    properties:
      profiles:
        items:
          $ref: '#/components/schemas/KanbanProfile'
        type: array
    required:
    - profiles
    type: object
  KanbanProject:
    additionalProperties: false
    description: '``plugin_api.list_kanban_projects`` row; empty strings for unset fields.'
    properties:
      color:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      primary_path:
        type: string
      slug:
        type: string
    required:
    - id
    - slug
    - name
    - primary_path
    - icon
    - color
    type: object
  KanbanProjectsResponse:
    additionalProperties: false
    description: '``plugin_api.list_kanban_projects``.'
    properties:
      projects:
        items:
          $ref: '#/components/schemas/KanbanProject'
        type: array
    required:
    - projects
    type: object
  KanbanReassignResponse:
    additionalProperties: false
    description: '``plugin_api.reassign_task_endpoint``; ``assignee`` is ``None`` when unassigned.'
    properties:
      assignee:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      task_id:
        type: string
    required:
    - ok
    - task_id
    - assignee
    type: object
  KanbanRun:
    additionalProperties: false
    description: '``asdict(kanban_db.Run)`` — one attempt at a task (``task_runs`` row).'
    properties:
      claim_expires:
        anyOf:
        - type: integer
        - type: 'null'
      claim_lock:
        anyOf:
        - type: string
        - type: 'null'
      ended_at:
        anyOf:
        - type: integer
        - type: 'null'
      error:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: integer
      last_heartbeat_at:
        anyOf:
        - type: integer
        - type: 'null'
      max_runtime_seconds:
        anyOf:
        - type: integer
        - type: 'null'
      metadata:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      outcome:
        anyOf:
        - type: string
        - type: 'null'
      profile:
        anyOf:
        - type: string
        - type: 'null'
      started_at:
        type: integer
      status:
        type: string
      step_key:
        anyOf:
        - type: string
        - type: 'null'
      summary:
        anyOf:
