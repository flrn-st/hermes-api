# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  LocalModelCatalogRow:
    additionalProperties: false
    description: '``_catalog_row``. ``fits=false`` rows price the smallest build and add ``fit_detail``;

      ``fits=true`` rows add the selected variant, plus the start window unless physics refused.'
    properties:
      description:
        type: string
      display_name:
        type: string
      downloaded:
        type: boolean
      downloaded_model_id:
        anyOf:
        - type: string
        - type: 'null'
      downloaded_quant:
        anyOf:
        - type: string
        - type: 'null'
      fit_detail:
        anyOf:
        - type: string
        - type: 'null'
      fit_summary:
        type: string
      fits:
        type: boolean
      id:
        type: string
      min_engine:
        anyOf:
        - type: string
        - type: 'null'
      model_id:
        anyOf:
        - type: string
        - type: 'null'
      mtp:
        type: boolean
      native_context:
        type: integer
      native_context_label:
        type: string
      needs_engine:
        type: boolean
      quant:
        anyOf:
        - type: string
        - type: 'null'
      quant_reason:
        anyOf:
        - type: string
        - type: 'null'
      quant_validated:
        anyOf:
        - type: boolean
        - type: 'null'
      recommended:
        type: boolean
      recommended_reason:
        anyOf:
        - type: string
        - type: 'null'
      size_bytes:
        type: integer
      size_label:
        type: string
      spilled:
        anyOf:
        - type: boolean
        - type: 'null'
      start_window:
        anyOf:
        - type: integer
        - type: 'null'
      start_window_label:
        anyOf:
        - type: string
        - type: 'null'
      variant_count:
        anyOf:
        - type: integer
        - type: 'null'
      vision:
        type: boolean
    required:
    - id
    - display_name
    - description
    - native_context
    - native_context_label
    - recommended
    - recommended_reason
    - downloaded
    - downloaded_model_id
    - downloaded_quant
    - mtp
    - vision
    - needs_engine
    - min_engine
    - fits
    - size_bytes
    - size_label
    - fit_summary
    type: object
  LocalModelJob:
    additionalProperties: false
    description: '``_job`` record as rendered by ``_job_view``.'
    properties:
      bytes_per_sec:
        anyOf:
        - type: number
        - type: 'null'
        description: Only while running and measurable.
      can_pause:
        type: boolean
      can_resume:
        type: boolean
      detail:
        type: string
      done_bytes:
        type: integer
      error:
        anyOf:
        - type: string
        - type: 'null'
      eta_seconds:
        anyOf:
        - type: integer
        - type: 'null'
        description: With ``bytes_per_sec``; null when the total is unknown.
      job_id:
        type: string
      kind:
        enum:
        - runtime-install
        - model-download
        - quickstart
        - model-activate
        type: string
      model_id:
        anyOf:
        - type: string
        - type: 'null'
        description: Catalog/variant id for download-type jobs.
      pause_requested:
        type: boolean
      percent:
        anyOf:
        - type: integer
        - type: 'null'
        description: Only once ``total_bytes`` is known.
      phase:
        description: Current step name (``starting``, ``downloading``, ``done``, ...).
        type: string
      ranges:
        additionalProperties:
          items:
            items:
              type: integer
            type: array
          type: array
        description: Per-destination half-open ``[start, end)`` byte runs (``pm/downloader.py``).
        type: object
      started_at:
        type: number
      status:
        enum:
        - running
        - paused
        - done
        - error
        type: string
      target:
        type: string
      total_bytes:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - job_id
    - kind
    - target
    - model_id
    - status
    - phase
    - detail
    - total_bytes
    - done_bytes
    - started_at
    - error
    - pause_requested
    - can_pause
    - can_resume
    type: object
  LocalModelLoadProgress:
    additionalProperties: false
    description: '``hermes_cli/local_runtime/load_progress.py::get_loading_progress`` entry.'
    properties:
      percent:
        description: Composite 0-100 across all load stages.
        type: integer
      stage:
        type: string
      value:
        description: Progress within ``stage``, 0..1.
        type: number
    required:
    - stage
    - value
    - percent
    type: object
  LocalModelPlacement:
    additionalProperties: false
    description: '``_loaded_models`` facts: the preset decision (``window``/``spilled``) and the window the

      live server actually granted; each group only when known.'
    properties:
      granted_window:
        anyOf:
        - type: integer
        - type: 'null'
      granted_window_label:
        anyOf:
        - type: string
        - type: 'null'
      spilled:
        anyOf:
        - type: boolean
        - type: 'null'
      window:
        anyOf:
        - type: integer
        - type: 'null'
      window_label:
        anyOf:
        - type: string
        - type: 'null'
    type: object
  LocalModelRepoFile:
    additionalProperties: false
    description: '``hermes_cli/local_runtime/hf_browse.py::HFFileGroup`` priced by ``rough_fit``.'
    properties:
      fit:
        enum:
        - fits-gpu
        - needs-ram
        - too-big
        - unknown
        type: string
      label:
        type: string
      paths:
        description: Repo-relative; every part of a split GGUF, in order.
        items:
          type: string
        type: array
      total_bytes:
        type: integer
    required:
    - label
    - paths
    - total_bytes
    - fit
    type: object
  LocalModelSearchHit:
    additionalProperties: false
    description: '``hermes_cli/local_runtime/hf_browse.py::HFModelHit``.'
    properties:
      downloads:
        type: integer
      gated:
        type: boolean
      likes:
        type: integer
      repo:
        type: string
      updated:
        type: string
    required:
    - repo
    - downloads
    - likes
    - updated
    - gated
    type: object
  LocalModelStagedRow:
    additionalProperties: false
    description: '``_staged_row``: one downloaded variant (a split model''s whole size).'
    properties:
      id:
        type: string
      size_bytes:
        type: integer
      size_label:
        type: string
    required:
    - id
    - size_bytes
    - size_label
    type: object
  LocalModelsActivateResponse:
    additionalProperties: false
    description: '``local_models_activate``.'
    properties:
      job_id:
        type: string
    required:
    - job_id
    type: object
  LocalModelsCatalogResponse:
    additionalProperties: false
    description: '``local_models_catalog``.'
    properties:
      models:
        items:
          $ref: '#/components/schemas/LocalModelCatalogRow'
        type: array
    required:
    - models
    type: object
  LocalModelsDownloadPauseResponse:
    additionalProperties: false
    description: '``local_models_download_pause``; ``paused`` false when the job is not pausable now.'
    properties:
      ok:
        type: boolean
      paused:
        type: boolean
    required:
    - ok
    - paused
    type: object
  LocalModelsDownloadResponse:
    additionalProperties: false
    description: '``local_models_download`` / ``local_models_download_browsed``: ``job_id`` is null (and

      ``already_downloaded`` true) when every file is already on disk.'
    properties:
      already_downloaded:
        anyOf:
        - type: boolean
        - type: 'null'
      job_id:
        anyOf:
        - type: string
        - type: 'null'
      model_id:
        type: string
    required:
    - job_id
    - model_id
    type: object
  LocalModelsDownloadResumeResponse:
    additionalProperties: false
    description: '``local_models_download_resume``.'
    properties:
      ok:
        type: boolean
      resumed:
        type: boolean
    required:
    - ok
    - resumed
    type: object
  LocalModelsHardwareResponse:
    additionalProperties: false
    description: '``local_models_hardware``; the ``gpu_*``/``vram_used_bytes`` readouts are NVIDIA-only (null

      elsewhere).'
    properties:
      gpu_name:
        anyOf:
        - type: string
        - type: 'null'
      gpu_util_percent:
        anyOf:
        - type: integer
        - type: 'null'
      ram_available_bytes:
        type: integer
      ram_total_bytes:
        type: integer
      uma:
        type: boolean
      vram_label:
        type: string
      vram_total_bytes:
        type: integer
      vram_usable_bytes:
        type: integer
      vram_used_bytes:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - uma
    - vram_total_bytes
    - vram_usable_bytes
    - ram_total_bytes
    - ram_available_bytes
    - vram_label
    - gpu_name
    - gpu_util_percent
    - vram_used_bytes
    type: object
  LocalModelsJobsResponse:
    additionalProperties: false
    description: '``local_models_jobs``: running/paused first, then up to 20 settled jobs.'
    properties:
      jobs:
        items:
          $ref: '#/components/schemas/LocalModelJob'
        type: array
    required:
    - jobs
    type: object
  LocalModelsQuickstartResponse:
    additionalProperties: false
    description: '``local_models_quickstart``; ``model_id`` is the catalog family id.'
    properties:
      display_name:
        type: string
      download_bytes:
        type: integer
      job_id:
        type: string
      model_id:
        type: string
      needs_download:
        type: boolean
      needs_runtime:
        type: boolean
    required:
    - job_id
    - model_id
    - display_name
    - needs_runtime
    - needs_download
    - download_bytes
    type: object
  LocalModelsRuntimeInstallResponse:
    additionalProperties: false
    description: '``local_models_runtime_install``.'
    properties:
      backend:
        type: string
      job_id:
        type: string
      tag:
        type: string
    required:
    - job_id
    - backend
    - tag
    type: object
  LocalModelsSearchFilesResponse:
    additionalProperties: false
    description: '``local_models_search_files``.'
    properties:
      files:
        items:
          $ref: '#/components/schemas/LocalModelRepoFile'
        type: array
    required:
    - files
    type: object
  LocalModelsSearchResponse:
    additionalProperties: false
    description: '``local_models_search``.'
    properties:
      hits:
        items:
          $ref: '#/components/schemas/LocalModelSearchHit'
        type: array
    required:
    - hits
    type: object
  LocalModelsServerResponse:
    additionalProperties: false
    description: '``local_models_server``.'
    properties:
      action:
        enum:
        - stop
        - start
        type: string
      ok:
        type: boolean
    required:
    - ok
    - action
    type: object
  LocalModelsSideloadResponse:
    additionalProperties: false
    description: '``local_models_sideload``.'
    properties:
      already_present:
        anyOf:
        - type: boolean
        - type: 'null'
      model_id:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - model_id
    type: object
  LocalModelsStatusResponse:
    additionalProperties: false
    description: '``local_models_status``.'
    properties:
      active_model_id:
        anyOf:
        - type: string
        - type: 'null'
      configured_tag:
        type: string
      enabled:
        type: boolean
      loaded_models:
        additionalProperties:
          enum:
          - loaded
          - ready
          - loading
          type: string
        type: object
      loading:
        additionalProperties:
          $ref: '#/components/schemas/LocalModelLoadProgress'
        type: object
      models:
        items:
          $ref: '#/components/schemas/LocalModelStagedRow'
        type: array
      models_dir:
        type: string
      placement:
        additionalProperties:
          $ref: '#/components/schemas/LocalModelPlacement'
        type: object
      runtime_backend:
        anyOf:
        - type: string
        - type: 'null'
      runtime_installed:
        type: boolean
      server_base_url:
        anyOf:
        - type: string
        - type: 'null'
      server_running:
        type: boolean
      tag:
        type: string
      update_available:
        type: boolean
    required:
    - enabled
    - tag
    - configured_tag
    - update_available
    - runtime_installed
    - runtime_backend
    - server_running
    - server_base_url
    - active_model_id
    - loaded_models
    - loading
    - placement
    - models
    - models_dir
    type: object
