# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  LocalModelCatalogRow:
    additionalProperties: false
    description: '``_catalog_row``. ``fits=false`` rows price the smallest build and add ``fit_detail``;

      ``fits=true`` rows add the selected variant, plus the start window unless physics refused.'
    properties:
      description:
        type: string
      display_name:
        type: string
      downloaded:
        type: boolean
      downloaded_model_id:
        anyOf:
        - type: string
        - type: 'null'
      downloaded_quant:
        anyOf:
        - type: string
        - type: 'null'
      fit_detail:
        anyOf:
        - type: string
        - type: 'null'
      fit_summary:
        type: string
      fits:
        type: boolean
      id:
        type: string
      min_engine:
        anyOf:
        - type: string
        - type: 'null'
      model_id:
        anyOf:
        - type: string
        - type: 'null'
      mtp:
        type: boolean
      native_context:
        type: integer
      native_context_label:
        type: string
      needs_engine:
        type: boolean
      quant:
        anyOf:
        - type: string
        - type: 'null'
      quant_reason:
        anyOf:
        - type: string
        - type: 'null'
      quant_validated:
        anyOf:
        - type: boolean
        - type: 'null'
      recommended:
        type: boolean
      recommended_reason:
        anyOf:
        - type: string
        - type: 'null'
      size_bytes:
        type: integer
      size_label:
        type: string
      spilled:
        anyOf:
        - type: boolean
        - type: 'null'
      start_window:
        anyOf:
        - type: integer
        - type: 'null'
      start_window_label:
        anyOf:
        - type: string
        - type: 'null'
      variant_count:
        anyOf:
        - type: integer
        - type: 'null'
      vision:
        type: boolean
    required:
    - id
    - display_name
    - description
    - native_context
    - native_context_label
    - recommended
    - recommended_reason
    - downloaded
    - downloaded_model_id
    - downloaded_quant
    - mtp
    - vision
    - needs_engine
    - min_engine
    - fits
    - size_bytes
    - size_label
    - fit_summary
    type: object
  LocalModelRepoFile:
    additionalProperties: false
    description: '``hermes_cli/local_runtime/hf_browse.py::HFFileGroup`` priced by ``rough_fit``.'
    properties:
      fit:
        enum:
        - fits-gpu
        - needs-ram
        - too-big
        - unknown
        type: string
      label:
        type: string
      paths:
        description: Repo-relative; every part of a split GGUF, in order.
        items:
          type: string
        type: array
      total_bytes:
        type: integer
    required:
    - label
    - paths
    - total_bytes
    - fit
    type: object
  LocalModelSearchHit:
    additionalProperties: false
    description: '``hermes_cli/local_runtime/hf_browse.py::HFModelHit``.'
    properties:
      downloads:
        type: integer
      gated:
        type: boolean
      likes:
        type: integer
      repo:
        type: string
      updated:
        type: string
    required:
    - repo
    - downloads
    - likes
    - updated
    - gated
    type: object
  LocalModelsActivateResponse:
    additionalProperties: false
    description: '``local_models_activate``.'
    properties:
      job_id:
        type: string
    required:
    - job_id
    type: object
  LocalModelsCatalogResponse:
    additionalProperties: false
    description: '``local_models_catalog``.'
    properties:
      models:
        items:
          $ref: '#/components/schemas/LocalModelCatalogRow'
        type: array
    required:
    - models
    type: object
  LocalModelsHardwareResponse:
    additionalProperties: false
    description: '``local_models_hardware``; the ``gpu_*``/``vram_used_bytes`` readouts are NVIDIA-only (null

      elsewhere).'
    properties:
      gpu_name:
        anyOf:
        - type: string
        - type: 'null'
      gpu_util_percent:
        anyOf:
        - type: integer
        - type: 'null'
      ram_available_bytes:
        type: integer
      ram_total_bytes:
        type: integer
      uma:
        type: boolean
      vram_label:
        type: string
      vram_total_bytes:
        type: integer
      vram_usable_bytes:
        type: integer
      vram_used_bytes:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - uma
    - vram_total_bytes
    - vram_usable_bytes
    - ram_total_bytes
    - ram_available_bytes
    - vram_label
    - gpu_name
    - gpu_util_percent
    - vram_used_bytes
    type: object
  LocalModelsSearchFilesResponse:
    additionalProperties: false
    description: '``local_models_search_files``.'
    properties:
      files:
        items:
          $ref: '#/components/schemas/LocalModelRepoFile'
        type: array
    required:
    - files
    type: object
  LocalModelsSearchResponse:
    additionalProperties: false
    description: '``local_models_search``.'
    properties:
      hits:
        items:
          $ref: '#/components/schemas/LocalModelSearchHit'
        type: array
    required:
    - hits
    type: object
  LocalModelsServerResponse:
    additionalProperties: false
    description: '``local_models_server``.'
    properties:
      action:
        enum:
        - stop
        - start
        type: string
      ok:
        type: boolean
    required:
    - ok
    - action
    type: object
  LocalModelsSideloadResponse:
    additionalProperties: false
    description: '``local_models_sideload``.'
    properties:
      already_present:
        anyOf:
        - type: boolean
        - type: 'null'
      model_id:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - model_id
    type: object
