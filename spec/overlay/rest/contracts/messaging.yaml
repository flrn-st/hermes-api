# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  MessagingHomeChannel:
    additionalProperties: true
    description: '``gateway/config.py::HomeChannel.to_dict``; profile-scoped reads pass the config.yaml

      ``platforms.<id>.home_channel`` mapping through as written.'
    properties:
      chat_id:
        anyOf:
        - type: string
        - type: 'null'
      name:
        anyOf:
        - type: string
        - type: 'null'
      platform:
        anyOf:
        - type: string
        - type: 'null'
      scope_id:
        anyOf:
        - type: string
        - type: 'null'
      thread_id:
        anyOf:
        - type: string
        - type: 'null'
      user_id:
        anyOf:
        - type: string
        - type: 'null'
    type: object
  MessagingPlatform:
    additionalProperties: false
    description: '``_messaging_platform_payload`` for one ``_messaging_platform_catalog`` entry.'
    properties:
      configured:
        type: boolean
      description:
        type: string
      docs_url:
        type: string
      enabled:
        type: boolean
      env_vars:
        items:
          $ref: '#/components/schemas/MessagingPlatformEnvVar'
        type: array
      error_code:
        anyOf:
        - type: string
        - type: 'null'
      error_message:
        anyOf:
        - type: string
        - type: 'null'
      gateway_running:
        type: boolean
      home_channel:
        anyOf:
        - $ref: '#/components/schemas/MessagingHomeChannel'
        - type: 'null'
      id:
        type: string
      ingress_url:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      state:
        type: string
      updated_at:
        anyOf:
        - type: string
        - type: 'null'
      whatsapp_setup:
        anyOf:
        - $ref: '#/components/schemas/MessagingWhatsAppSetup'
        - type: 'null'
    required:
    - id
    - name
    - description
    - docs_url
    - enabled
    - configured
    - gateway_running
    - state
    - error_code
    - error_message
    - updated_at
    - home_channel
    - env_vars
    - ingress_url
    type: object
  MessagingPlatformEnvVar:
    additionalProperties: false
    description: One ``env_vars`` row of ``_messaging_platform_payload`` (``_messaging_env_info`` prose).
    properties:
      advanced:
        type: boolean
      description:
        type: string
      help:
        type: string
      is_password:
        type: boolean
      is_set:
        type: boolean
      key:
        type: string
      prompt:
        type: string
      redacted_value:
        anyOf:
        - type: string
        - type: 'null'
      required:
        type: boolean
      url:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - key
    - required
    - is_set
    - redacted_value
    - description
    - prompt
    - help
    - url
    - is_password
    - advanced
    type: object
  MessagingPlatformTestResponse:
    additionalProperties: false
    description: '``test_messaging_platform`` — a verdict over the same payload as the platform list.'
    properties:
      message:
        type: string
      ok:
        type: boolean
      state:
        type: string
    required:
    - ok
    - state
    - message
    type: object
  MessagingPlatformUpdateResponse:
    additionalProperties: false
    description: '``update_messaging_platform``.'
    properties:
      hot_served:
        type: boolean
      ok:
        type: boolean
      platform:
        type: string
    required:
    - ok
    - platform
    - hot_served
    type: object
  MessagingPlatformsResponse:
    additionalProperties: false
    description: '``get_messaging_platforms``.'
    properties:
      env_path:
        type: string
      gateway_start_command:
        type: string
      platforms:
        items:
          $ref: '#/components/schemas/MessagingPlatform'
        type: array
    required:
    - env_path
    - gateway_start_command
    - platforms
    type: object
  MessagingWhatsAppSetup:
    additionalProperties: false
    properties:
      allowed_users_set:
        type: boolean
      home_channel_set:
        type: boolean
      mode:
        enum:
        - ''
        - bot
        - self-chat
        type: string
    required:
    - mode
    - allowed_users_set
    - home_channel_set
    type: object
  TelegramOnboardingApplyResponse:
    additionalProperties: false
    description: '``apply_telegram_onboarding``.'
    properties:
      bot_username:
        anyOf:
        - type: string
        - type: 'null'
      needs_restart:
        type: boolean
      ok:
        type: boolean
      platform:
        const: telegram
        type: string
      restart_action:
        anyOf:
        - const: gateway-restart
          type: string
        - type: 'null'
      restart_error:
        anyOf:
        - type: string
        - type: 'null'
      restart_pid:
        anyOf:
        - type: integer
        - type: 'null'
      restart_started:
        type: boolean
    required:
    - ok
    - needs_restart
    - restart_started
    - platform
    - bot_username
    type: object
  TelegramOnboardingStartResponse:
    additionalProperties: false
    description: '``start_telegram_onboarding`` — the setup service''s pairing, trimmed to strings.'
    properties:
      deep_link:
        type: string
      expires_at:
        type: string
      pairing_id:
        type: string
      qr_payload:
        type: string
      suggested_username:
        type: string
    required:
    - pairing_id
    - suggested_username
    - deep_link
    - qr_payload
    - expires_at
    type: object
  TelegramOnboardingStatusResponse:
    additionalProperties: false
    description: '``get_telegram_onboarding_status``: ``waiting`` carries only ``expires_at``;

      ``ready`` is ``_telegram_ready_payload``. Terminal statuses are 410s.'
    properties:
      bot_username:
        anyOf:
        - type: string
        - type: 'null'
      expires_at:
        type: string
      owner_user_id:
        anyOf:
        - type: string
        - type: 'null'
      status:
        enum:
        - waiting
        - ready
        type: string
    required:
    - status
    - expires_at
    type: object
  WhatsAppOnboardingApplyResponse:
    additionalProperties: false
    description: '``apply_whatsapp_onboarding``.'
    properties:
      needs_restart:
        type: boolean
      ok:
        type: boolean
      platform:
        const: whatsapp
        type: string
      restart_action:
        anyOf:
        - const: gateway-restart
          type: string
        - type: 'null'
      restart_error:
        anyOf:
        - type: string
        - type: 'null'
      restart_pid:
        anyOf:
        - type: integer
        - type: 'null'
      restart_started:
        type: boolean
    required:
    - ok
    - needs_restart
    - restart_started
    - platform
    type: object
  WhatsAppOnboardingResponse:
    additionalProperties: false
    description: '``hermes_cli/web_server_messaging.py::_whatsapp_onboarding_payload`` — the

      ``_WhatsAppOnboardingSession`` fields in ``_WHATSAPP_PAYLOAD_FIELDS``.'
    properties:
      account_id:
        anyOf:
        - type: string
        - type: 'null'
      account_name:
        anyOf:
        - type: string
        - type: 'null'
      account_phone:
        anyOf:
        - type: string
        - type: 'null'
      allowed_users:
        type: string
      error:
        anyOf:
        - type: string
        - type: 'null'
      expires_at:
        type: string
      mode:
        enum:
        - bot
        - self-chat
        type: string
      pairing_id:
        type: string
      qr_payload:
        anyOf:
        - type: string
        - type: 'null'
      status:
        enum:
        - starting
        - installing
        - waiting
        - connected
        - error
        - expired
        - cancelled
        type: string
    required:
    - pairing_id
    - status
    - qr_payload
    - expires_at
    - mode
    - allowed_users
    - account_id
    - account_name
    - account_phone
    - error
    type: object
