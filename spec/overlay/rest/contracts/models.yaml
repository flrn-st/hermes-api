        - type: boolean
        - type: 'null'
      model:
        type: string
      provider:
        type: string
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - provider
    - model
    type: object
  ModelAssignmentResponse:
    additionalProperties: false
    description: '``set_model_assignment``: the expensive-model confirmation prompt (``ok: false``,

      ``confirm_required``), a main-slot assignment, an auxiliary assignment or the auxiliary

      ``__reset__`` — the union of ``_apply_main_assignment_sync`` and ``_apply_aux_assignment_sync``.'
    properties:
      base_url:
        anyOf:
        - type: string
        - type: 'null'
      confirm_message:
        anyOf:
        - type: string
        - type: 'null'
      confirm_required:
        anyOf:
        - type: boolean
        - type: 'null'
      gateway_tools:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      model:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      provider:
        anyOf:
        - type: string
        - type: 'null'
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
      reset:
        anyOf:
        - type: boolean
        - type: 'null'
      scope:
        enum:
        - main
        - auxiliary
        type: string
      stale_aux:
        anyOf:
        - items:
            $ref: '#/components/schemas/StaleAuxiliaryPin'
          type: array
        - type: 'null'
      tasks:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
    required:
    - ok
    - scope
    type: object
  ModelOptionCapabilities:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_capabilities``.'
    properties:
      can_disable_reasoning:
        anyOf:
        - type: boolean
        - type: 'null'
      fast:
        type: boolean
      reasoning:
        type: boolean
    required:
    - fast
    - reasoning
    type: object
  ModelOptionPricing:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_pricing`` — formatted $/Mtok strings (``""`` unknown,

      ``"free"``); the sale fields are Nous Portal-only.'
    properties:
      cache:
        anyOf:
        - type: string
        - type: 'null'
      discount_percent:
        anyOf:
        - type: integer
        - type: 'null'
      free:
        type: boolean
      input:
        type: string
      output:
        type: string
      was_input:
        anyOf:
        - type: string
        - type: 'null'
      was_output:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - input
    - output
    - free
    type: object
  ModelOptionProviderRow:
    additionalProperties: true
    description: 'One ``hermes_cli/inventory.py::build_models_payload`` provider row (the union of every field

      the builder sets). Same row as the ``model.options`` JSON-RPC result

