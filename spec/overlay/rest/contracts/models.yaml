    properties:
      active_preset:
        type: string
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      default_preset:
        type: string
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      presets:
        additionalProperties:
          $ref: '#/components/schemas/MoaPreset'
        type: object
      privacy_filter:
        enum:
        - ''
        - display
        - full
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    - default_preset
    - active_preset
    - presets
    - privacy_filter
    type: object
  MoaConfigSaveResponse:
    additionalProperties: false
    description: '``set_moa_models`` — ``{"ok": true}`` plus the normalized config that was saved.'
    properties:
      active_preset:
        type: string
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      default_preset:
        type: string
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      ok:
        type: boolean
      presets:
        additionalProperties:
          $ref: '#/components/schemas/MoaPreset'
        type: object
      privacy_filter:
        enum:
        - ''
        - display
        - full
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    - default_preset
    - active_preset
    - presets
    - privacy_filter
    - ok
    type: object
  MoaPreset:
    additionalProperties: false
    description: '``hermes_cli/moa_config.py::_normalize_preset``; a ``None`` number means "provider default".'
    properties:
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    type: object
