          type: array
        - type: 'null'
      api_url:
        anyOf:
        - type: string
        - type: 'null'
      auth_type:
        anyOf:
        - type: string
        - type: 'null'
      authenticated:
        anyOf:
        - type: boolean
        - type: 'null'
      capabilities:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ModelOptionCapabilities'
          type: object
        - type: 'null'
      featured_models:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      free_tier:
        anyOf:
        - type: boolean
        - type: 'null'
      free_tier_pending:
        anyOf:
        - type: boolean
        - type: 'null'
      free_tier_row:
        anyOf:
        - type: boolean
        - type: 'null'
      is_current:
        anyOf:
        - type: boolean
        - type: 'null'
      is_user_defined:
        anyOf:
        - type: boolean
        - type: 'null'
      key_env:
        anyOf:
        - type: string
        - type: 'null'
      models:
        items:
          type: string
        type: array
      name:
        type: string
      pricing:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ModelOptionPricing'
          type: object
        - type: 'null'
      pricing_pending:
        anyOf:
        - type: boolean
        - type: 'null'
      slug:
        type: string
      source:
        anyOf:
        - type: string
        - type: 'null'
      total_models:
        anyOf:
        - type: integer
        - type: 'null'
      unavailable_models:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      warning:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - slug
    - name
    type: object
  ModelOptionsResponse:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::build_model_options_payload`` — the REST twin of the

      ``model.options`` JSON-RPC result.'
    properties:
      model:
        default: ''
        type: string
      provider:
        default: ''
        type: string
      providers:
        items:
          $ref: '#/components/schemas/ModelOptionProviderRow'
        type: array
    required:
    - providers
    type: object
  ModelsDevCapabilities:
    additionalProperties: false
    description: '``agent/models_dev.py::ModelCapabilities``; ``{}`` when models.dev has no row.'
    properties:
      context_window:
        anyOf:
        - type: integer
        - type: 'null'
      max_output_tokens:
        anyOf:
        - type: integer
        - type: 'null'
      model_family:
        anyOf:
        - type: string
        - type: 'null'
      supports_reasoning:
        anyOf:
        - type: boolean
        - type: 'null'
      supports_tools:
        anyOf:
        - type: boolean
        - type: 'null'
      supports_vision:
        anyOf:
        - type: boolean
        - type: 'null'
    type: object
  RecommendedDefaultModelResponse:
    additionalProperties: false
    description: '``get_recommended_default_model``; ``free_tier`` is only a bool for Nous and ``model`` may

      be ``""``.'
    properties:
      free_tier:
        anyOf:
        - type: boolean
        - type: 'null'
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    - free_tier
    type: object
  StaleAuxiliaryPin:
    additionalProperties: false
    description: '``hermes_cli/web_server_config.py::_stale_aux_pins``.'
    properties:
