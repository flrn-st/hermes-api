# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  AuxiliaryEffectiveRoute:
    additionalProperties: false
    description: The route an inheriting plugin task resolves to right now (``_get_auxiliary_task_config``).
    properties:
      base_url:
        type: string
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    - base_url
    type: object
  AuxiliaryModelsResponse:
    additionalProperties: false
    description: '``get_auxiliary_models`` — one row per ``_AUX_TASK_SLOTS`` entry, then one per

      plugin-registered auxiliary task of the profile.'
    properties:
      main:
        $ref: '#/components/schemas/MainModelAssignment'
      tasks:
        items:
          $ref: '#/components/schemas/AuxiliaryTaskAssignment'
        type: array
    required:
    - tasks
    - main
    type: object
  AuxiliaryTaskAssignment:
    additionalProperties: false
    description: 'One slot''s own stored assignment. Plugin-registered tasks follow the built-in slots and add

      ``label``/``hint``/``plugin`` and ``inherit_from`` (base slot key or null); an inheriting row also

      carries ``effective``.'
    properties:
      base_url:
        type: string
      effective:
        anyOf:
        - $ref: '#/components/schemas/AuxiliaryEffectiveRoute'
        - type: 'null'
      hint:
        anyOf:
        - type: string
        - type: 'null'
      inherit_from:
        anyOf:
        - type: string
        - type: 'null'
      label:
        anyOf:
        - type: string
        - type: 'null'
      local_endpoint:
        type: boolean
      model:
        type: string
      plugin:
        anyOf:
        - type: string
        - type: 'null'
      provider:
        type: string
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
      task:
        type: string
    required:
    - task
    - provider
    - model
    - base_url
    - reasoning_effort
    - local_endpoint
    type: object
  MainModelAssignment:
    additionalProperties: false
    properties:
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    type: object
  MoaConfigResponse:
    additionalProperties: false
    description: '``hermes_cli/moa_config.py::normalize_moa_config`` — named presets plus the default preset''s

      fields flattened on top for older callers.'
    properties:
      active_preset:
        type: string
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      default_preset:
        type: string
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      presets:
        additionalProperties:
          $ref: '#/components/schemas/MoaPreset'
        type: object
      privacy_filter:
        enum:
        - ''
        - display
        - full
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    - default_preset
    - active_preset
    - presets
    - privacy_filter
    type: object
  MoaConfigSaveResponse:
    additionalProperties: false
    description: '``set_moa_models`` — ``{"ok": true}`` plus the normalized config that was saved.'
    properties:
      active_preset:
        type: string
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      default_preset:
        type: string
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      ok:
        type: boolean
      presets:
        additionalProperties:
          $ref: '#/components/schemas/MoaPreset'
        type: object
      privacy_filter:
        enum:
        - ''
        - display
        - full
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    - default_preset
    - active_preset
    - presets
    - privacy_filter
    - ok
    type: object
  MoaPreset:
    additionalProperties: false
    description: '``hermes_cli/moa_config.py::_normalize_preset``; a ``None`` number means "provider default".'
    properties:
      aggregator:
        $ref: '#/components/schemas/MoaSlot'
      aggregator_temperature:
        anyOf:
        - type: number
        - type: 'null'
      degraded_reference_policy:
        enum:
        - loud
        - silent
        type: string
      enabled:
        type: boolean
      fanout:
        description: '"user_turn", "per_iteration" or "every_n:<N>".'
        type: string
      reference_models:
        items:
          $ref: '#/components/schemas/MoaSlot'
        type: array
      reference_temperature:
        anyOf:
        - type: number
        - type: 'null'
      reference_timeout:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - enabled
    - reference_models
    - aggregator
    - reference_temperature
    - aggregator_temperature
    - reference_timeout
    - degraded_reference_policy
    - fanout
    type: object
  MoaSlot:
    additionalProperties: false
    description: '``hermes_cli/moa_config.py::_clean_slot``; ``enabled`` only on reference slots.'
    properties:
      enabled:
        anyOf:
        - type: boolean
        - type: 'null'
      model:
        type: string
      provider:
        type: string
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - provider
    - model
    type: object
  ModelAssignmentResponse:
    additionalProperties: false
    description: '``set_model_assignment``: the expensive-model confirmation prompt (``ok: false``,

      ``confirm_required``), a main-slot assignment, an auxiliary assignment or the auxiliary

      ``__reset__`` — the union of ``_apply_main_assignment_sync`` and ``_apply_aux_assignment_sync``.'
    properties:
      base_url:
        anyOf:
        - type: string
        - type: 'null'
      confirm_message:
        anyOf:
        - type: string
        - type: 'null'
      confirm_required:
        anyOf:
        - type: boolean
        - type: 'null'
      gateway_tools:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      model:
        anyOf:
        - type: string
        - type: 'null'
      ok:
        type: boolean
      provider:
        anyOf:
        - type: string
        - type: 'null'
      reasoning_effort:
        anyOf:
        - type: string
        - type: 'null'
      reset:
        anyOf:
        - type: boolean
        - type: 'null'
      scope:
        enum:
        - main
        - auxiliary
        type: string
      stale_aux:
        anyOf:
        - items:
            $ref: '#/components/schemas/StaleAuxiliaryPin'
          type: array
        - type: 'null'
      tasks:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
    required:
    - ok
    - scope
    type: object
  ModelInfoResponse:
    additionalProperties: false
    description: '``get_model_info``.'
    properties:
      auto_context_length:
        type: integer
      capabilities:
        $ref: '#/components/schemas/ModelsDevCapabilities'
      config_context_length:
        type: integer
      effective_context_length:
        type: integer
      model:
        type: string
      provider:
        type: string
    required:
    - model
    - provider
    - auto_context_length
    - config_context_length
    - effective_context_length
    - capabilities
    type: object
  ModelOptionCapabilities:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_capabilities``.'
    properties:
      can_disable_reasoning:
        anyOf:
        - type: boolean
        - type: 'null'
      fast:
        type: boolean
      reasoning:
        type: boolean
      ultrafast:
        anyOf:
        - type: boolean
        - type: 'null'
        description: Only ever ``true``; absent when not offered.
    required:
    - fast
    - reasoning
    type: object
  ModelOptionLimit:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_limits``: ``account`` — the whole login is rate-limited until

      ``resets_at`` (ISO); ``models`` — only these models are, each until its ISO time.'
    properties:
      models:
        anyOf:
        - additionalProperties:
            type: string
          type: object
        - type: 'null'
      resets_at:
        anyOf:
        - type: string
        - type: 'null'
      scope:
        enum:
        - account
        - models
        type: string
    required:
    - scope
    type: object
  ModelOptionPricing:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_pricing`` — formatted $/Mtok strings (``""`` unknown,

      ``"free"``); the sale fields are Nous Portal-only.'
    properties:
      cache:
        anyOf:
        - type: string
        - type: 'null'
      discount_percent:
        anyOf:
        - type: integer
        - type: 'null'
      free:
        type: boolean
      input:
        type: string
      output:
        type: string
      was_input:
        anyOf:
        - type: string
        - type: 'null'
      was_output:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - input
    - output
    - free
    type: object
  ModelOptionProviderRow:
    additionalProperties: true
    description: 'One ``hermes_cli/inventory.py::build_models_payload`` provider row (the union of every field

      the builder sets). Same row as the ``model.options`` JSON-RPC result

      (``tui_gateway/contracts/config_free_tier_control.py::ModelOptionProvider``).'
    properties:
      aliases:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      api_url:
        anyOf:
        - type: string
        - type: 'null'
      auth_type:
        anyOf:
        - type: string
        - type: 'null'
      authenticated:
        anyOf:
        - type: boolean
        - type: 'null'
      capabilities:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ModelOptionCapabilities'
          type: object
        - type: 'null'
      featured_models:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      free_tier:
        anyOf:
        - type: boolean
        - type: 'null'
      free_tier_pending:
        anyOf:
        - type: boolean
        - type: 'null'
      free_tier_row:
        anyOf:
        - type: boolean
        - type: 'null'
      is_current:
        anyOf:
        - type: boolean
        - type: 'null'
      is_user_defined:
        anyOf:
        - type: boolean
        - type: 'null'
      key_env:
        anyOf:
        - type: string
        - type: 'null'
      limit:
        anyOf:
        - $ref: '#/components/schemas/ModelOptionLimit'
        - type: 'null'
      models:
        items:
          type: string
        type: array
      name:
        type: string
      pricing:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ModelOptionPricing'
          type: object
        - type: 'null'
      pricing_pending:
        anyOf:
        - type: boolean
        - type: 'null'
      slug:
        type: string
      source:
        anyOf:
        - type: string
        - type: 'null'
      total_models:
        anyOf:
        - type: integer
        - type: 'null'
      unavailable_models:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      usage:
        anyOf:
        - $ref: '#/components/schemas/ModelOptionUsage'
        - type: 'null'
      warning:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - slug
    - name
    type: object
  ModelOptionUsage:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::_apply_usage`` (cache only): single-account providers carry

      ``windows``, multi-entry credential pools ``accounts`` instead.'
    properties:
      accounts:
        anyOf:
        - items:
            $ref: '#/components/schemas/ModelOptionUsageAccount'
          type: array
        - type: 'null'
      windows:
        anyOf:
        - items:
            $ref: '#/components/schemas/ModelOptionUsageWindow'
          type: array
        - type: 'null'
    type: object
  ModelOptionUsageAccount:
    additionalProperties: false
    description: 'One account of a multi-entry credential pool (``hermes_cli/inventory.py::_pool_usage_accounts``).

      ``id`` is a stable non-secret identity; ``windows`` is empty while usage is unknown; ``resets_at``

      is when a limited account is whole again (null when unknown).'
    properties:
      id:
        type: string
      label:
        type: string
      resets_at:
        anyOf:
        - type: string
        - type: 'null'
      state:
        enum:
        - ready
        - limited
        - unknown
        - unavailable
        type: string
      windows:
        items:
          $ref: '#/components/schemas/ModelOptionUsageWindow'
        type: array
    required:
    - id
    - label
    - windows
    - state
    - resets_at
    type: object
  ModelOptionUsageWindow:
    additionalProperties: false
    description: 'One subscription usage window (``agent/account_usage.py::AccountUsageWindow``): how much is

      spent and when it rolls over (ISO). ``model``-scoped windows cap one model family only.'
    properties:
      label:
        type: string
      resets_at:
        anyOf:
        - type: string
        - type: 'null'
      scope:
        enum:
        - account
        - model
        type: string
      used_percent:
        type: number
    required:
    - label
    - used_percent
    - resets_at
    - scope
    type: object
  ModelOptionsResponse:
    additionalProperties: false
    description: '``hermes_cli/inventory.py::build_model_options_payload`` — the REST twin of the

      ``model.options`` JSON-RPC result.'
    properties:
      model:
        default: ''
        type: string
      provider:
        default: ''
        type: string
      providers:
        items:
          $ref: '#/components/schemas/ModelOptionProviderRow'
        type: array
    required:
    - providers
    type: object
  ModelsDevCapabilities:
    additionalProperties: false
    description: '``agent/models_dev.py::ModelCapabilities``; ``{}`` when models.dev has no row.'
    properties:
      context_window:
        anyOf:
        - type: integer
        - type: 'null'
      max_output_tokens:
        anyOf:
        - type: integer
        - type: 'null'
      model_family:
        anyOf:
        - type: string
        - type: 'null'
      supports_reasoning:
        anyOf:
        - type: boolean
        - type: 'null'
      supports_tools:
        anyOf:
        - type: boolean
        - type: 'null'
      supports_vision:
        anyOf:
        - type: boolean
        - type: 'null'
    type: object
  RecommendedDefaultModelResponse:
    additionalProperties: false
    description: '``get_recommended_default_model``; ``free_tier`` is only a bool for Nous and ``model`` may

      be ``""``.'
    properties:
      free_tier:
        anyOf:
        - type: boolean
        - type: 'null'
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    - free_tier
    type: object
  StaleAuxiliaryPin:
    additionalProperties: false
    description: '``hermes_cli/web_server_config.py::_stale_aux_pins``.'
    properties:
      model:
        type: string
      provider:
        type: string
      task:
        type: string
    required:
    - task
    - provider
    - model
    type: object
