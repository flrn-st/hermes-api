    - task
    - provider
    - model
    - base_url
    - reasoning_effort
    - local_endpoint
    type: object
  MainModelAssignment:
    additionalProperties: false
    properties:
      model:
        type: string
      provider:
        type: string
    required:
    - provider
    - model
    type: object
