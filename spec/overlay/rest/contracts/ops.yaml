# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  CredentialPoolAddResponse:
    additionalProperties: false
    description: '``add_credential_pool_entry`` — ``count`` is the provider''s pool size after the add.'
    properties:
      count:
        type: integer
      ok:
        type: boolean
      provider:
        type: string
    required:
    - ok
    - provider
    - count
    type: object
  CredentialPoolEntrySummary:
    additionalProperties: false
    description: '``_pool_entry_summary``; ``index`` is 1-based (``CredentialPool.remove_index``).'
    properties:
      auth_type:
        type: string
      has_refresh:
        type: boolean
      id:
        type: string
      index:
        type: integer
      label:
        type: string
      last_status:
        anyOf:
        - type: string
        - type: 'null'
      priority:
        type: integer
      request_count:
        type: integer
      source:
        type: string
      token_preview:
        type: string
    required:
    - index
    - id
    - label
    - auth_type
    - source
    - priority
    - last_status
    - request_count
    - token_preview
    - has_refresh
    type: object
  CredentialPoolListResponse:
    additionalProperties: false
    description: '``list_credential_pool`` — providers with at least one pooled entry.'
    properties:
      providers:
        items:
          $ref: '#/components/schemas/CredentialPoolProvider'
        type: array
    required:
    - providers
    type: object
  CredentialPoolProvider:
    additionalProperties: false
    properties:
      entries:
        items:
          $ref: '#/components/schemas/CredentialPoolEntrySummary'
        type: array
      provider:
        type: string
    required:
    - provider
    - entries
    type: object
  CredentialPoolRemoveResponse:
    additionalProperties: false
    description: '``remove_credential_pool_entry`` — ``cleaned``/``hints`` come from the source''s RemovalStep.'
    properties:
      cleaned:
        items:
          type: string
        type: array
      count:
        type: integer
      hints:
        items:
          type: string
        type: array
      ok:
        type: boolean
      provider:
        type: string
    required:
    - ok
    - provider
    - count
    - cleaned
    - hints
    type: object
  MemoryBuiltinFileSizes:
    additionalProperties: false
    description: Byte size of ``memories/MEMORY.md`` / ``memories/USER.md`` (0 when absent).
    properties:
      memory:
        type: integer
      user:
        type: integer
    required:
    - memory
    - user
    type: object
  MemoryProviderSelectResponse:
    additionalProperties: false
    description: '``set_memory_provider``; ``active`` is ``""`` for the built-in provider.'
    properties:
      active:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - active
    type: object
  MemoryResetResponse:
    additionalProperties: false
    description: '``reset_memory`` — the file names actually deleted.'
    properties:
      deleted:
        items:
          type: string
        type: array
      ok:
        type: boolean
    required:
    - ok
    - deleted
    type: object
  MemoryStatusResponse:
    additionalProperties: false
    description: '``get_memory_status``; ``active`` is ``""`` for the built-in provider.'
    properties:
      active:
        type: string
      builtin_files:
        $ref: '#/components/schemas/MemoryBuiltinFileSizes'
      providers:
        items:
          $ref: '#/components/schemas/MemoryProviderStatusRow'
        type: array
    required:
    - active
    - providers
    - builtin_files
    type: object
  OpsBackupResponse:
    additionalProperties: false
    description: '``run_backup``; ``archive`` only when the dashboard chose the output path (no ``output``

      in the request), so the UI can offer ``/api/ops/backup/download``.'
    properties:
      archive:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      ok:
        type: boolean
      pid:
        type: integer
    required:
    - ok
    - pid
    - name
    type: object
  OpsCheckpointListResponse:
    additionalProperties: false
    description: '``list_checkpoints`` — per-session file count and size of the /rollback shadow store.'
    properties:
      sessions:
        items:
          $ref: '#/components/schemas/OpsCheckpointSession'
        type: array
      total_bytes:
        type: integer
    required:
    - sessions
    - total_bytes
    type: object
  OpsCheckpointSession:
    additionalProperties: false
    properties:
      bytes:
        type: integer
      files:
        type: integer
      session:
        type: string
    required:
    - session
    - files
    - bytes
    type: object
  OpsImportUploadResponse:
    additionalProperties: false
    description: '``run_import_upload`` — the staged archive path and its size in bytes.'
    properties:
      archive:
        type: string
      name:
        type: string
      ok:
        type: boolean
      pid:
        type: integer
      uploaded_bytes:
        type: integer
    required:
    - ok
    - pid
    - name
    - archive
    - uploaded_bytes
    type: object
  OpsShellHook:
    additionalProperties: false
    description: 'One ``list_hooks`` row (``ShellHookSpec`` + consent state); ``approved_at`` is the ISO

      timestamp from the allowlist entry.'
    properties:
      allowed:
        type: boolean
      approved_at:
        anyOf:
        - type: string
        - type: 'null'
      command:
        type: string
      event:
        type: string
      executable:
        type: boolean
      matcher:
        anyOf:
        - type: string
        - type: 'null'
      timeout:
        type: integer
    required:
    - event
    - matcher
    - command
    - timeout
    - allowed
    - approved_at
    - executable
    type: object
  OpsShellHookCreateResponse:
    additionalProperties: false
    description: '``create_hook``; ``approved`` is False when consent was not requested or recording it failed.'
    properties:
      approved:
        type: boolean
      command:
        type: string
      event:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - event
    - command
    - approved
    type: object
  OpsShellHookListResponse:
    additionalProperties: false
    description: '``list_hooks``; ``valid_events`` is ``[]`` when the plugin hook registry cannot be imported.'
    properties:
      hooks:
        items:
          $ref: '#/components/schemas/OpsShellHook'
        type: array
      valid_events:
        items:
          type: string
        type: array
    required:
    - hooks
    - valid_events
    type: object
  UserPairingApproveResponse:
    additionalProperties: false
    description: '``approve_pairing``.'
    properties:
      ok:
        type: boolean
      user:
        $ref: '#/components/schemas/UserPairingApprovedUser'
    required:
    - ok
    - user
    type: object
  UserPairingApprovedRow:
    additionalProperties: true
    description: '``PairingStore.list_approved`` — the stored ``{user_name, approved_at}`` record spread over

      ``platform``/``user_id``; ``approved_at`` is epoch seconds.'
    properties:
      approved_at:
        type: number
      platform:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    required:
    - platform
    - user_id
    - user_name
    - approved_at
    type: object
  UserPairingApprovedUser:
    additionalProperties: false
    description: '``PairingStore._finish_approval``.'
    properties:
      user_id:
        type: string
      user_name:
        type: string
    required:
    - user_id
    - user_name
    type: object
  UserPairingClearResponse:
    additionalProperties: false
    description: '``clear_pending_pairing`` — ``cleared`` counts the removed pending requests.'
    properties:
      cleared:
        type: integer
      ok:
        type: boolean
    required:
    - ok
    - cleared
    type: object
  UserPairingListResponse:
    additionalProperties: false
    description: '``list_pairing``.'
    properties:
      approved:
        items:
          $ref: '#/components/schemas/UserPairingApprovedRow'
        type: array
      pending:
        items:
          $ref: '#/components/schemas/UserPairingPendingRow'
        type: array
    required:
    - pending
    - approved
    type: object
  UserPairingPendingRow:
    additionalProperties: false
    description: '``PairingStore.list_pending``; ``request_id`` is ``""`` for legacy pre-hash entries (never the

      code itself).'
    properties:
      age_minutes:
        type: integer
      platform:
        type: string
      request_id:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    required:
    - platform
    - request_id
    - user_id
    - user_name
    - age_minutes
    type: object
  WebhookCreateResponse:
    additionalProperties: false
    description: '``create_webhook`` — the summary plus the HMAC secret, surfaced only here.'
    properties:
      created_at:
        anyOf:
        - type: string
        - type: 'null'
      deliver:
        type: string
      deliver_only:
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      events:
        items:
          type: string
        type: array
      name:
        type: string
      prompt:
        type: string
      script:
        type: string
      secret:
        type: string
      secret_set:
        type: boolean
      skills:
        items:
          type: string
        type: array
      url:
        type: string
    required:
    - name
    - description
    - events
    - deliver
    - deliver_only
    - prompt
    - script
    - skills
    - created_at
    - url
    - secret_set
    - enabled
    - secret
    type: object
  WebhookEnableResponse:
    additionalProperties: false
    description: '``enable_webhooks`` — spreads ``hermes_cli/web_server_gateway.py::_restart_gateway_after``:

      ``restart_action``/``restart_pid`` when the restart spawned, ``restart_error`` when it failed.'
    properties:
      enabled:
        type: boolean
      needs_restart:
        type: boolean
      ok:
        type: boolean
      platform:
        type: string
      restart_action:
        anyOf:
        - type: string
        - type: 'null'
      restart_error:
        anyOf:
        - type: string
        - type: 'null'
      restart_pid:
        anyOf:
        - type: integer
        - type: 'null'
      restart_started:
        type: boolean
    required:
    - ok
    - platform
    - enabled
    - needs_restart
    - restart_started
    type: object
  WebhookEnabledToggleResponse:
    additionalProperties: false
    description: '``set_webhook_enabled``.'
    properties:
      enabled:
        type: boolean
      name:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - name
    - enabled
    type: object
  WebhookListResponse:
    additionalProperties: false
    description: '``list_webhooks``.'
    properties:
      base_url:
        type: string
      enabled:
        type: boolean
      subscriptions:
        items:
          $ref: '#/components/schemas/WebhookSubscription'
        type: array
    required:
    - enabled
    - base_url
    - subscriptions
    type: object
  WebhookSubscription:
    additionalProperties: false
    description: '``_webhook_route_summary``; ``created_at`` is ``None`` for a hand-written route without one.'
    properties:
      created_at:
        anyOf:
        - type: string
        - type: 'null'
      deliver:
        type: string
      deliver_only:
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      events:
        items:
          type: string
        type: array
      name:
        type: string
      prompt:
        type: string
      script:
        type: string
      secret_set:
        type: boolean
      skills:
        items:
          type: string
        type: array
      url:
        type: string
    required:
    - name
    - description
    - events
    - deliver
    - deliver_only
    - prompt
    - script
    - skills
    - created_at
    - url
    - secret_set
    - enabled
    type: object
