# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  ProfileActiveResponse:
    additionalProperties: false
    description: '``get_active_profile_endpoint``: the sticky default and the profile this dashboard serves.'
    properties:
      active:
        type: string
      current:
        type: string
    required:
    - active
    - current
    type: object
  ProfileCreateResponse:
    additionalProperties: false
    description: '``create_profile_endpoint``; ``model_error`` is ``""`` unless the model pick was rejected.'
    properties:
      hub_installs:
        items:
          $ref: '#/components/schemas/ProfileHubInstall'
        type: array
      mcp_written:
        type: integer
      model_error:
        type: string
      model_set:
        type: boolean
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
      skills_disabled:
        type: integer
      soul_set:
        description: The request carried a ``soul`` (SOUL.md) for the new profile.
        type: boolean
    required:
    - ok
    - name
    - path
    - model_set
    - model_error
    - mcp_written
    - skills_disabled
    - hub_installs
    - soul_set
    type: object
  ProfileDeleteResponse:
    additionalProperties: false
    description: '``delete_profile_endpoint``; the settlement keys ride only when the directory is gone but

      ``ProfileIdentitySettlementPending`` left its identity unsettled.'
    properties:
      identity_settled:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      path:
        type: string
      retry_command:
        anyOf:
        - type: string
        - type: 'null'
      settlement_pending:
        anyOf:
        - type: boolean
        - type: 'null'
    required:
    - ok
    - path
    type: object
  ProfileDescribeAutoResponse:
    additionalProperties: false
    description: '``describe_profile_auto_endpoint`` over ``hermes_cli/profile_describer.py::DescribeOutcome``;

      a failed generation is ``ok: false`` with its ``reason``.'
    properties:
      description:
        anyOf:
        - type: string
        - type: 'null'
      description_auto:
        type: boolean
      ok:
        type: boolean
      reason:
        type: string
    required:
    - ok
    - reason
    - description
    - description_auto
    type: object
  ProfileDescriptionResponse:
    additionalProperties: false
    description: '``update_profile_description_endpoint``.'
    properties:
      description:
        type: string
      description_auto:
        type: boolean
      ok:
        type: boolean
    required:
    - ok
    - description
    - description_auto
    type: object
  ProfileDesktopOverlayResponse:
    additionalProperties: false
    description: '``get_profile_desktop_overlay``; ``desktop`` is the file''s JSON document (which may itself

      be ``null``).'
    properties:
      desktop: {}
      exists:
        type: boolean
    required:
    - exists
    - desktop
    type: object
  ProfileExportResponse:
    additionalProperties: false
    description: '``export_profile_endpoint``.'
    properties:
      archive:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - archive
    type: object
  ProfileFailedLoad:
    additionalProperties: false
    description: '``_profiles_failed``: a profile whose scan failed while its siblings listed (Retry-able).'
    properties:
      error:
        type: string
      failed:
        type: boolean
      retry:
        type: boolean
    required:
    - failed
    - retry
    - error
    type: object
  ProfileHubInstall:
    additionalProperties: false
    description: A spawned ``hermes skills install``; ``pid`` is null when the spawn failed.
    properties:
      identifier:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - identifier
    - pid
    type: object
  ProfileImportResponse:
    additionalProperties: false
    description: '``import_profile_endpoint``; ``desktop`` is the bundled ``desktop.json`` document, null when

      absent or unreadable.'
    properties:
      desktop: {}
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - name
    - path
    - desktop
    type: object
  ProfileListResponse:
    additionalProperties: false
    description: '``list_profiles_endpoint`` (``_read_profiles``).'
    properties:
      profiles:
        items:
          $ref: '#/components/schemas/ProfileSummary'
        type: array
    required:
    - profiles
    type: object
  ProfileModelResponse:
    additionalProperties: false
    description: '``update_profile_model_endpoint``.'
    properties:
      model:
        type: string
      ok:
        type: boolean
      provider:
        type: string
    required:
    - ok
    - provider
    - model
    type: object
  ProfileOpenTerminalResponse:
    additionalProperties: false
    description: '``open_profile_terminal_endpoint``.'
    properties:
      command:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - command
    type: object
  ProfileProjectTreeLane:
    additionalProperties: false
    description: 'One lane of ``tui_gateway/project_tree.py::_build_repos``; ``sessions`` stays empty (the

      all-profiles tree is built unhydrated).'
    properties:
      id:
        type: string
      isGit:
        default: true
        description: False for a path-only lane of a non-git folder (no branch switching); absent on the Home lane.
        type: boolean
      isKanban:
        type: boolean
      isMain:
        type: boolean
      label:
        type: string
      path:
        anyOf:
        - type: string
        - type: 'null'
      sessions:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeSession'
        type: array
    required:
    - id
    - label
    - path
    - isMain
    - isKanban
    - sessions
    type: object
  ProfileProjectTreeNode:
    additionalProperties: false
    description: '``tui_gateway/project_tree.py::_project_node`` after ``_merge_profile_tree`` folded the

      same folder across profiles (counts and totals summed).'
    properties:
      color:
        anyOf:
        - type: string
        - type: 'null'
      icon:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      isAuto:
        type: boolean
      isNoProject:
        type: boolean
      label:
        type: string
      lastActive:
        type: number
      mergeKey:
        description: The folder identity the merge keyed on (``project_tree._path_key``); a client merging per-profile
          reads (``?profile=``) folds on it.
        type: string
      path:
        anyOf:
        - type: string
        - type: 'null'
      previewSessions:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeSession'
        type: array
      repos:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeRepo'
        type: array
      sessionCount:
        type: integer
      sessionIds:
        items:
          type: string
        type: array
      totalCostUsd:
        type: number
      totalTokens:
        type: integer
    required:
    - id
    - label
    - path
    - color
    - icon
    - isAuto
    - isNoProject
    - sessionCount
    - lastActive
    - totalTokens
    - totalCostUsd
    - repos
    - previewSessions
    - sessionIds
    - mergeKey
    type: object
  ProfileProjectTreeRepo:
    additionalProperties: false
    description: '``tui_gateway/project_tree.py::_repo_node``.'
    properties:
      groups:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeLane'
        type: array
      id:
        type: string
      label:
        type: string
      path:
        anyOf:
        - type: string
        - type: 'null'
      sessionCount:
        type: integer
    required:
    - id
    - label
    - path
    - groups
    - sessionCount
    type: object
  ProfileProjectTreeSession:
    additionalProperties: false
    description: '``tui_gateway/methods_projects.py::_project_tree_row`` stamped by ``_merge_profile_tree``

      (the REST twin of ``ProjectTreeSession`` in ``tui_gateway/contracts/projects_pets.py``).'
    properties:
      _branched_from:
        anyOf:
        - type: string
        - type: 'null'
        description: Set on a /branch fork.
      _lineage_ids:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      _lineage_root_id:
        anyOf:
        - type: string
        - type: 'null'
      _reset_from:
        anyOf:
        - type: string
        - type: 'null'
        description: Set on a /new sibling (not a fork).
      actual_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
      archived:
        type: boolean
      cwd:
        anyOf:
        - type: string
        - type: 'null'
      ended_at:
        anyOf:
        - type: number
        - type: 'null'
      estimated_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
      git_branch:
        anyOf:
        - type: string
        - type: 'null'
      git_repo_root:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      input_tokens:
        type: integer
      is_active:
        type: boolean
      is_default_profile:
        type: boolean
      last_active:
        type: number
      message_count:
        type: integer
      model:
        anyOf:
        - type: string
        - type: 'null'
      output_tokens:
        type: integer
      parent_session_id:
        anyOf:
        - type: string
        - type: 'null'
      preview:
        type: string
      profile:
        type: string
      source:
        type: string
      started_at:
        type: number
      title:
        anyOf:
        - type: string
        - type: 'null'
      tool_call_count:
        type: integer
    required:
    - id
    - _lineage_root_id
    - _lineage_ids
    - parent_session_id
    - _reset_from
    - _branched_from
    - title
    - preview
    - started_at
    - ended_at
    - last_active
    - source
    - archived
    - message_count
    - tool_call_count
    - input_tokens
    - output_tokens
    - actual_cost_usd
    - estimated_cost_usd
    - model
    - is_active
    - cwd
    - git_branch
    - git_repo_root
    - profile
    - is_default_profile
    type: object
  ProfileProjectsTreeResponse:
    additionalProperties: false
    description: '``get_profiles_projects_tree`` — the ``projects.tree`` JSON-RPC result

      (``ProjectsTreeResult``) across every profile (or only ``?profile=``), plus per-profile read

      ``errors``.'
    properties:
      active_id:
        type: 'null'
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      projects:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeNode'
        type: array
      scoped_session_ids:
        items:
          type: string
        type: array
    required:
    - projects
    - active_id
    - scoped_session_ids
    - errors
    type: object
  ProfileReadError:
    additionalProperties: false
    description: One profile whose ``state.db`` read failed (``_read_profile_db``).
    properties:
      error:
        type: string
      profile:
        type: string
    required:
    - profile
    - error
    type: object
  ProfileRenameResponse:
    additionalProperties: false
    description: '``rename_profile_endpoint``; renaming ``default`` only sets ``display_name`` and keeps

      ``name: "default"``.'
    properties:
      display_name:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - name
    - path
    type: object
  ProfileSessionPullRequest:
    additionalProperties: false
    properties:
      number:
        type: integer
      url:
        type: string
    required:
    - number
    - url
    type: object
  ProfileSessionPullRequestsResponse:
    additionalProperties: false
    description: '``post_profiles_sessions_pull_requests`` — session id -> the PR its transcript opened.'
    properties:
      pull_requests:
        additionalProperties:
          $ref: '#/components/schemas/ProfileSessionPullRequest'
        type: object
      scanned:
        items:
          type: string
        type: array
    required:
    - pull_requests
    - scanned
    type: object
  ProfileSessionsResponse:
    additionalProperties: false
    description: '``get_profiles_sessions`` — rows from every profile''s store, tagged with their owner.'
    properties:
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      profile_totals:
        additionalProperties:
          type: integer
        type: object
      sessions:
        items:
          $ref: '#/components/schemas/SessionListRow'
        type: array
      storage:
        additionalProperties:
          const: corrupt
          type: string
        type: object
      total:
        type: integer
    required:
    - sessions
    - total
    - profile_totals
    - limit
    - offset
    - errors
    - storage
    type: object
  ProfileSessionsSidebarResponse:
    additionalProperties: false
    description: '``get_profiles_sessions_sidebar`` — the recents / cron / messaging slices in one scan.'
    properties:
      cron:
        $ref: '#/components/schemas/ProfileSidebarSlice'
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      messaging:
        $ref: '#/components/schemas/ProfileSidebarMessaging'
      profiles_failed:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ProfileFailedLoad'
          type: object
        - type: 'null'
      recents:
        $ref: '#/components/schemas/ProfileSidebarRecents'
      storage:
        additionalProperties:
          const: corrupt
          type: string
        type: object
    required:
    - recents
    - cron
    - messaging
    - errors
    - storage
    type: object
  ProfileSetActiveResponse:
    additionalProperties: false
    description: '``set_active_profile_endpoint``.'
    properties:
      active:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - active
    type: object
  ProfileSetupCommandResponse:
    additionalProperties: false
    description: '``get_profile_setup_command``.'
    properties:
      command:
        type: string
    required:
    - command
    type: object
  ProfileSidebarMessaging:
    additionalProperties: false
    properties:
      errors:
        anyOf:
        - items:
            $ref: '#/components/schemas/ProfileReadError'
          type: array
        - type: 'null'
      failed:
        anyOf:
        - type: boolean
        - type: 'null'
      profiles_failed:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ProfileFailedLoad'
          type: object
        - type: 'null'
      retry:
        anyOf:
        - type: boolean
        - type: 'null'
      sessions:
        anyOf:
        - items:
            $ref: '#/components/schemas/SessionListRow'
          type: array
        - type: 'null'
      total:
        type: integer
    required:
    - total
    type: object
  ProfileSidebarRecents:
    additionalProperties: false
    properties:
      errors:
        anyOf:
        - items:
            $ref: '#/components/schemas/ProfileReadError'
          type: array
        - type: 'null'
      failed:
        anyOf:
        - type: boolean
        - type: 'null'
      profiles_failed:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ProfileFailedLoad'
          type: object
        - type: 'null'
      profiles_truncated:
        additionalProperties:
          type: boolean
        type: object
      profiles_usage:
        additionalProperties:
          $ref: '#/components/schemas/ProfileSidebarUsage'
        type: object
      retry:
        anyOf:
        - type: boolean
        - type: 'null'
      sessions:
        anyOf:
        - items:
            $ref: '#/components/schemas/SessionListRow'
          type: array
        - type: 'null'
    required:
    - profiles_truncated
    - profiles_usage
    type: object
  ProfileSidebarSlice:
    additionalProperties: false
    description: 'A sidebar slice. When the requested scope''s scan failed it is a failed load

      (``_failed_load_slice``): ``failed``/``retry``/``errors`` and NO ``sessions`` — an empty list

      would read as a successful empty read. ``profiles_failed``/``errors`` also mark a sibling

      profile that failed while others listed.'
    properties:
      errors:
        anyOf:
        - items:
            $ref: '#/components/schemas/ProfileReadError'
          type: array
        - type: 'null'
      failed:
        anyOf:
        - type: boolean
        - type: 'null'
      profiles_failed:
        anyOf:
        - additionalProperties:
            $ref: '#/components/schemas/ProfileFailedLoad'
          type: object
        - type: 'null'
      retry:
        anyOf:
        - type: boolean
        - type: 'null'
      sessions:
        anyOf:
        - items:
            $ref: '#/components/schemas/SessionListRow'
          type: array
        - type: 'null'
    type: object
  ProfileSidebarUsage:
    additionalProperties: false
    description: '``SessionDB.usage_totals``.'
    properties:
      cost_usd:
        type: number
      tokens:
        type: integer
    required:
    - tokens
    - cost_usd
    type: object
  ProfileSoulResponse:
    additionalProperties: false
    description: '``get_profile_soul``; a missing SOUL.md is ``content: ""``, ``exists: false``.'
    properties:
      content:
        type: string
      exists:
        type: boolean
    required:
    - content
    - exists
    type: object
  ProfileSummary:
    additionalProperties: false
    description: '``_profile_to_dict``, or ``web_server_profiles.py::_fallback_profile_entry`` when

      ``list_profiles`` fails (that scan omits ``display_name``).'
    properties:
      bot_title:
        type: string
      description:
        type: string
      description_auto:
        type: boolean
      display_name:
        anyOf:
        - type: string
        - type: 'null'
      distribution_name:
        anyOf:
        - type: string
        - type: 'null'
      distribution_source:
        anyOf:
        - type: string
        - type: 'null'
      distribution_version:
        anyOf:
        - type: string
        - type: 'null'
      gateway_running:
        type: boolean
      has_alias:
        type: boolean
      has_env:
        type: boolean
      is_default:
        type: boolean
      model:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      path:
        type: string
      provider:
        anyOf:
        - type: string
        - type: 'null'
      skill_count:
        type: integer
    required:
    - name
    - path
    - is_default
    - model
    - provider
    - has_env
    - skill_count
    - gateway_running
    - description
    - description_auto
    - bot_title
    - distribution_name
    - distribution_version
    - distribution_source
    - has_alias
    type: object
