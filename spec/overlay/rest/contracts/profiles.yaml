# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  ProfileActiveResponse:
    additionalProperties: false
    description: '``get_active_profile_endpoint``: the sticky default and the profile this dashboard serves.'
    properties:
      active:
        type: string
      current:
        type: string
    required:
    - active
    - current
    type: object
  ProfileCreateResponse:
    additionalProperties: false
    description: '``create_profile_endpoint``; ``model_error`` is ``""`` unless the model pick was rejected.'
    properties:
      hub_installs:
        items:
          $ref: '#/components/schemas/ProfileHubInstall'
        type: array
      mcp_written:
        type: integer
      model_error:
        type: string
      model_set:
        type: boolean
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
      skills_disabled:
        type: integer
    required:
    - ok
    - name
    - path
    - model_set
    - model_error
    - mcp_written
    - skills_disabled
    - hub_installs
    type: object
  ProfileDeleteResponse:
    additionalProperties: false
    description: '``delete_profile_endpoint``; the settlement keys ride only when the directory is gone but

      ``ProfileIdentitySettlementPending`` left its identity unsettled.'
    properties:
      identity_settled:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      path:
        type: string
      retry_command:
        anyOf:
        - type: string
        - type: 'null'
      settlement_pending:
        anyOf:
        - type: boolean
        - type: 'null'
    required:
    - ok
    - path
    type: object
  ProfileDescribeAutoResponse:
    additionalProperties: false
    description: '``describe_profile_auto_endpoint`` over ``hermes_cli/profile_describer.py::DescribeOutcome``;

      a failed generation is ``ok: false`` with its ``reason``.'
    properties:
      description:
        anyOf:
        - type: string
        - type: 'null'
      description_auto:
        type: boolean
      ok:
        type: boolean
      reason:
        type: string
    required:
    - ok
    - reason
    - description
    - description_auto
    type: object
  ProfileDescriptionResponse:
    additionalProperties: false
    description: '``update_profile_description_endpoint``.'
    properties:
      description:
        type: string
      description_auto:
        type: boolean
      ok:
        type: boolean
    required:
    - ok
    - description
    - description_auto
    type: object
  ProfileDesktopOverlayResponse:
    additionalProperties: false
    description: '``get_profile_desktop_overlay``; ``desktop`` is the file''s JSON document (which may itself

      be ``null``).'
    properties:
      desktop: {}
      exists:
        type: boolean
    required:
    - exists
    - desktop
    type: object
  ProfileExportResponse:
    additionalProperties: false
    description: '``export_profile_endpoint``.'
    properties:
      archive:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - archive
    type: object
  ProfileHubInstall:
    additionalProperties: false
    description: A spawned ``hermes skills install``; ``pid`` is null when the spawn failed.
    properties:
      identifier:
        type: string
      pid:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - identifier
    - pid
    type: object
  ProfileListResponse:
    additionalProperties: false
    description: '``list_profiles_endpoint`` (``_read_profiles``).'
    properties:
      profiles:
        items:
          $ref: '#/components/schemas/ProfileSummary'
        type: array
    required:
    - profiles
    type: object
  ProfileModelResponse:
    additionalProperties: false
    description: '``update_profile_model_endpoint``.'
    properties:
      model:
        type: string
      ok:
        type: boolean
      provider:
        type: string
    required:
    - ok
    - provider
    - model
    type: object
  ProfileOpenTerminalResponse:
    additionalProperties: false
    description: '``open_profile_terminal_endpoint``.'
    properties:
      command:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - command
    type: object
  ProfileProjectTreeNode:
    additionalProperties: false
    description: '``tui_gateway/project_tree.py::_project_node`` after ``_merge_profile_tree`` folded the

      same folder across profiles (counts and totals summed).'
    properties:
      color:
        anyOf:
        - type: string
        - type: 'null'
      icon:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      isAuto:
        type: boolean
      isNoProject:
        type: boolean
      label:
        type: string
      lastActive:
        type: number
      path:
        anyOf:
        - type: string
        - type: 'null'
      previewSessions:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeSession'
        type: array
      repos:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeRepo'
        type: array
      sessionCount:
        type: integer
      sessionIds:
        items:
          type: string
        type: array
      totalCostUsd:
        type: number
      totalTokens:
        type: integer
    required:
    - id
    - label
    - path
    - color
    - icon
    - isAuto
    - isNoProject
    - sessionCount
    - lastActive
    - totalTokens
    - totalCostUsd
    - repos
    - previewSessions
    - sessionIds
    type: object
  ProfileProjectTreeRepo:
    additionalProperties: false
    description: '``tui_gateway/project_tree.py::_repo_node``.'
    properties:
      groups:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeLane'
        type: array
      id:
        type: string
      label:
        type: string
      path:
        anyOf:
        - type: string
        - type: 'null'
      sessionCount:
        type: integer
    required:
    - id
    - label
    - path
    - groups
    - sessionCount
    type: object
  ProfileProjectsTreeResponse:
    additionalProperties: false
    description: '``get_profiles_projects_tree`` — the ``projects.tree`` JSON-RPC result

      (``ProjectsTreeResult``) across every profile, plus per-profile read ``errors``.'
    properties:
      active_id:
        type: 'null'
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      projects:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeNode'
        type: array
      scoped_session_ids:
        items:
          type: string
        type: array
    required:
    - projects
    - active_id
    - scoped_session_ids
    - errors
    type: object
  ProfileReadError:
    additionalProperties: false
    description: One profile whose ``state.db`` read failed (``_read_profile_db``).
    properties:
      error:
        type: string
      profile:
        type: string
    required:
    - profile
    - error
    type: object
  ProfileRenameResponse:
    additionalProperties: false
    description: '``rename_profile_endpoint``; renaming ``default`` only sets ``display_name`` and keeps

      ``name: "default"``.'
    properties:
      display_name:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - name
    - path
    type: object
  ProfileSessionPullRequest:
    additionalProperties: false
    properties:
      number:
        type: integer
      url:
        type: string
    required:
    - number
    - url
    type: object
  ProfileSessionPullRequestsResponse:
    additionalProperties: false
    description: '``post_profiles_sessions_pull_requests`` — session id -> the PR its transcript opened.'
    properties:
      pull_requests:
        additionalProperties:
          $ref: '#/components/schemas/ProfileSessionPullRequest'
        type: object
      scanned:
        items:
          type: string
        type: array
    required:
    - pull_requests
    - scanned
    type: object
  ProfileSessionsResponse:
    additionalProperties: false
    description: '``get_profiles_sessions`` — rows from every profile''s store, tagged with their owner.'
    properties:
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      profile_totals:
        additionalProperties:
          type: integer
        type: object
      sessions:
        items:
          $ref: '#/components/schemas/SessionListRow'
        type: array
      storage:
        additionalProperties:
          const: corrupt
          type: string
        type: object
      total:
        type: integer
    required:
    - sessions
    - total
    - profile_totals
    - limit
    - offset
    - errors
    - storage
    type: object
  ProfileSetActiveResponse:
    additionalProperties: false
    description: '``set_active_profile_endpoint``.'
    properties:
      active:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - active
    type: object
  ProfileSetupCommandResponse:
    additionalProperties: false
    description: '``get_profile_setup_command``.'
    properties:
      command:
        type: string
    required:
    - command
    type: object
  ProfileSummary:
    additionalProperties: false
    description: '``_profile_to_dict``, or ``web_server_profiles.py::_fallback_profile_entry`` when

      ``list_profiles`` fails (that scan omits ``display_name`` and ``role``).'
    properties:
      bot_title:
        type: string
      description:
        type: string
      description_auto:
        type: boolean
      display_name:
        anyOf:
        - type: string
        - type: 'null'
      distribution_name:
        anyOf:
        - type: string
        - type: 'null'
      distribution_source:
        anyOf:
        - type: string
        - type: 'null'
      distribution_version:
        anyOf:
        - type: string
        - type: 'null'
      gateway_running:
        type: boolean
      has_alias:
        type: boolean
      has_env:
        type: boolean
      is_default:
        type: boolean
      model:
        anyOf:
        - type: string
        - type: 'null'
      name:
        type: string
      path:
        type: string
      provider:
        anyOf:
        - type: string
        - type: 'null'
      role:
        anyOf:
        - type: string
        - type: 'null'
        description: '``hermes_cli.profiles.PROFILE_ROLES`` ("setup") or null.'
      skill_count:
        type: integer
    required:
    - name
    - path
    - is_default
    - model
    - provider
    - has_env
    - skill_count
    - gateway_running
    - description
    - description_auto
    - bot_title
    - distribution_name
    - distribution_version
    - distribution_source
    - has_alias
    type: object
