        - type: 'null'
      codex_reasoning_items:
        anyOf:
        - type: string
        - type: 'null'
      compacted:
        type: integer
      content: {}
      display_commentary:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      display_content: {}
      display_kind:
        anyOf:
        - type: string
        - type: 'null'
      display_metadata:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      display_reasoning:
        anyOf:
        - type: string
        - type: 'null'
      effect_disposition:
        anyOf:
        - type: string
        - type: 'null'
      finish_reason:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: integer
      message_uid:
        anyOf:
        - type: string
        - type: 'null'
        description: Stable message identity; null on legacy rows until backfilled.
      observed:
        type: integer
      platform_message_id:
        anyOf:
        - type: string
        - type: 'null'
      reasoning:
        anyOf:
        - type: string
        - type: 'null'
      reasoning_content:
        anyOf:
        - type: string
        - type: 'null'
      reasoning_details:
        anyOf:
        - type: string
        - type: 'null'
      role:
        type: string
      session_id:
        type: string
      timestamp:
        type: number
      token_count:
        anyOf:
        - type: integer
        - type: 'null'
      tool_call_id:
