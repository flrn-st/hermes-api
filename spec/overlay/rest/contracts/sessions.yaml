# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  SessionBulkDeleteResponse:
    additionalProperties: false
    description: '``bulk_delete_sessions_endpoint``: ``deleted`` counts the selected rows (compression chains are

      deleted whole); ``skipped_active`` lists ids a live turn or compression still owns, which stay.'
    properties:
      deleted:
        type: integer
      ok:
        type: boolean
      skipped_active:
        items:
          type: string
        type: array
    required:
    - ok
    - deleted
    - skipped_active
    type: object
  SessionDeleteResponse:
    additionalProperties: false
    description: '``delete_session_endpoint``: the ``delete`` mutation receipt (``deleted_ids``: every retired

      row of the compression chain), or ``{ok, already_absent: true}`` when the id is already gone.'
    properties:
      already_absent:
        anyOf:
        - type: boolean
        - type: 'null'
      deleted_ids:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      execution_generation:
        anyOf:
        - type: integer
        - type: 'null'
      ok:
        type: boolean
      operation:
        anyOf:
        - const: delete
          type: string
        - type: 'null'
      revision:
        anyOf:
        - type: integer
        - type: 'null'
      session_id:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    type: object
  SessionDeletedCountResponse:
    additionalProperties: false
    description: '``delete_empty_sessions_endpoint``.'
    properties:
      deleted:
        type: integer
      ok:
        type: boolean
    required:
    - ok
    - deleted
    type: object
  SessionDisplayMessage:
    additionalProperties: true
    description: 'A message after ``_project_for_display``: bridge tool-call labels, the compaction display

      projection and ``agent/history_commentary.py::_project_one`` keys, each only when it applies.

      A recovered compaction carrier drops ``display_kind`` in favour of ``display_content``.'
