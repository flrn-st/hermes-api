# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  CuratorPausedResponse:
    additionalProperties: false
    description: '``set_curator_paused``.'
    properties:
      ok:
        type: boolean
      paused:
        type: boolean
    required:
    - ok
    - paused
    type: object
  CuratorStatusResponse:
    additionalProperties: false
    description: '``get_curator_status``; a getter that raised reads as ``null``.'
    properties:
      archive_after_days:
        anyOf:
        - type: integer
        - type: 'null'
      enabled:
        type: boolean
      interval_hours:
        anyOf:
        - type: integer
        - type: 'null'
      last_run_at:
        anyOf:
        - type: string
        - type: 'null'
      min_idle_hours:
        anyOf:
        - type: number
        - type: 'null'
      paused:
        type: boolean
      stale_after_days:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - enabled
    - paused
    - interval_hours
    - last_run_at
    - min_idle_hours
    - stale_after_days
    - archive_after_days
    type: object
  DebugShareResponse:
    additionalProperties: false
    description: '``run_debug_share_endpoint`` — ``hermes_cli/debug.py::DebugShareResult`` minus ``report``.'
    properties:
      auto_delete_seconds:
        type: integer
      failures:
        items:
          type: string
        type: array
      ok:
        type: boolean
      redacted:
        type: boolean
      urls:
        additionalProperties:
          type: string
        description: Label ("Report", "agent.log", …) → paste URL.
        type: object
    required:
    - ok
    - urls
    - failures
    - redacted
    - auto_delete_seconds
    type: object
  HealthIdleResponse:
    additionalProperties: false
    description: '``get_health_idle`` — ``{"ok": true}`` plus ``hermes_cli/web_server_idle_proof.py::idle_proof``.

      ``idle: null`` means a ledger was unreadable (treat as busy).'
    properties:
      detail:
        anyOf:
        - type: string
        - type: 'null'
      idle:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      reason:
        anyOf:
        - enum:
          - turn_probe_unavailable
          - turn_in_flight
          - input_probe_unavailable
          - awaiting_human_input
          type: string
        - type: 'null'
    required:
    - ok
    - idle
    - reason
    type: object
  HealthRetirementResponse:
    additionalProperties: false
    description: '``post_health_retirement`` — ``hermes_cli/backend_retirement.py::RetirementFence``

      ``prepare`` / ``commit`` / ``cancel``. Only ``prepare`` carries ``idle`` (``null`` = cannot

      prove idle) and, when it succeeded, ``token``.'
    properties:
      idle:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      token:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    type: object
  HostIdentityResponse:
    additionalProperties: false
    description: '``get_host_identity``.'
    properties:
      ok:
        type: boolean
      pid:
        type: integer
      protocolVersion:
        type: integer
      role:
        description: The published host role; "serve" when none was recorded.
        type: string
      servesSpa:
        type: boolean
    required:
    - ok
    - protocolVersion
    - pid
    - role
    - servesSpa
    type: object
  LearningGraphCluster:
    additionalProperties: false
    properties:
      category:
        type: string
      count:
        type: integer
    required:
    - category
    - count
    type: object
  LearningGraphEdge:
    additionalProperties: false
    properties:
      source:
        type: string
      target:
        type: string
    required:
    - source
    - target
    type: object
  LearningGraphNode:
    additionalProperties: false
    description: A learned skill or a memory card; ``memorySource`` only on memory nodes.
    properties:
      category:
        type: string
      createdBy:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      kind:
        enum:
        - skill
        - memory
        type: string
      label:
        type: string
      memorySource:
        anyOf:
        - enum:
          - memory
          - profile
          type: string
        - type: 'null'
      pinned:
        type: boolean
      state:
        type: string
      timestamp:
        anyOf:
        - type: integer
        - type: 'null'
      useCount:
        type: integer
    required:
    - id
    - label
    - kind
    - timestamp
    - category
    - useCount
    - state
    - createdBy
    - pinned
    type: object
  LearningGraphResponse:
    additionalProperties: false
    description: '``agent/learning_graph.py::build_learning_graph``.'
    properties:
      clusters:
        items:
          $ref: '#/components/schemas/LearningGraphCluster'
        type: array
      edges:
        items:
          $ref: '#/components/schemas/LearningGraphEdge'
        type: array
      memory:
        items:
          $ref: '#/components/schemas/LearningGraphMemoryCard'
        type: array
      nodes:
        items:
          $ref: '#/components/schemas/LearningGraphNode'
        type: array
      stats:
        $ref: '#/components/schemas/LearningGraphStats'
    required:
    - nodes
    - edges
    - clusters
    - memory
    - stats
    type: object
  LearningGraphStats:
    additionalProperties: false
    description: '``agent/learning_graph.py::density_stats`` plus the memory counts.'
    properties:
      agent_created:
        type: integer
      categories:
        type: integer
      edges_per_node:
        type: number
      isolated_pct:
        type: number
      learned_skills:
        type: integer
      linked_nodes:
        type: integer
      memory_nodes:
        type: integer
      memory_skill_edges:
        type: integer
      nodes:
        type: integer
      related_edges:
        type: integer
      top_categories:
        description: Up to 8 ``[category, count]`` pairs.
        items:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: string
          - type: integer
          type: array
        type: array
      used:
        type: integer
    required:
    - nodes
    - related_edges
    - edges_per_node
    - linked_nodes
    - isolated_pct
    - categories
    - agent_created
    - used
    - top_categories
    - memory_nodes
    - memory_skill_edges
    - learned_skills
    type: object
  LearningNodeDetailResponse:
    additionalProperties: false
    description: '``agent/learning_mutations.py::node_detail`` (the non-ok results become a 404).'
    properties:
      content:
        type: string
      id:
        type: string
      kind:
        enum:
        - skill
        - memory
        type: string
      label:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - kind
    - id
    - label
    - content
    type: object
  LearningNodeMutationResponse:
    additionalProperties: false
    description: '``agent/learning_mutations.py::delete_node`` / ``edit_node`` (the non-ok results become

      a 400).'
    properties:
      message:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - message
    type: object
  LogsResponse:
    additionalProperties: false
    description: '``get_logs`` — raw log lines (trailing newline kept); ``[]`` when the file does not exist.'
    properties:
      file:
        type: string
      lines:
        items:
          type: string
        type: array
    required:
    - file
    - lines
    type: object
  PortalFeature:
    additionalProperties: false
    properties:
      label:
        type: string
      state:
        description: '"via Nous Portal", the active provider name, "active" or "not configured".'
        type: string
    required:
    - label
    - state
    type: object
  PortalStatusResponse:
    additionalProperties: false
    description: '``_get_portal_status_sync``.'
    properties:
      account_tier:
        anyOf:
        - type: string
        - type: 'null'
      features:
        items:
          $ref: '#/components/schemas/PortalFeature'
        type: array
      free_tier:
        type: boolean
      inference_url:
        anyOf:
        - type: string
        - type: 'null'
      logged_in:
        type: boolean
      portal_url:
        anyOf:
        - type: string
        - type: 'null'
      provider:
        type: string
      subscription_url:
        type: string
    required:
    - logged_in
    - portal_url
    - inference_url
    - provider
    - free_tier
    - account_tier
    - subscription_url
    - features
    type: object
  SshOwnershipResponse:
    additionalProperties: false
    description: '``get_ssh_ownership``.'
    properties:
      ok:
        type: boolean
      protocolVersion:
        type: integer
      runtimeIntact:
        type: boolean
      sshOwnerNonce:
        type: string
    required:
    - ok
    - sshOwnerNonce
    - protocolVersion
    - runtimeIntact
    type: object
