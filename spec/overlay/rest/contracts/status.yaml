# Drafted by tools/import_contracts.py from the response contracts named in x-contract;
# re-run the importer rather than editing, and review changes like any overlay.
components:
  CuratorPausedResponse:
    additionalProperties: false
    description: '``set_curator_paused``.'
    properties:
      ok:
        type: boolean
      paused:
        type: boolean
    required:
    - ok
    - paused
    type: object
  CuratorStatusResponse:
    additionalProperties: false
    description: '``get_curator_status``; a getter that raised reads as ``null``.'
    properties:
      archive_after_days:
        anyOf:
        - type: integer
        - type: 'null'
      enabled:
        type: boolean
      interval_hours:
        anyOf:
        - type: integer
        - type: 'null'
      last_run_at:
        anyOf:
        - type: string
        - type: 'null'
      min_idle_hours:
        anyOf:
        - type: number
        - type: 'null'
      paused:
        type: boolean
      stale_after_days:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - enabled
    - paused
    - interval_hours
    - last_run_at
    - min_idle_hours
    - stale_after_days
    - archive_after_days
    type: object
  DebugShareResponse:
    additionalProperties: false
    description: '``run_debug_share_endpoint`` — ``hermes_cli/debug.py::DebugShareResult`` minus ``report``.'
    properties:
      auto_delete_seconds:
        type: integer
      failures:
        items:
          type: string
        type: array
      ok:
        type: boolean
      redacted:
        type: boolean
      urls:
        additionalProperties:
          type: string
        description: Label ("Report", "agent.log", …) → paste URL.
        type: object
    required:
    - ok
    - urls
    - failures
    - redacted
    - auto_delete_seconds
    type: object
  HealthIdleResponse:
    additionalProperties: false
    description: '``get_health_idle`` — ``{"ok": true}`` plus ``hermes_cli/web_server_idle_proof.py::idle_proof``.

      ``idle: null`` means a ledger was unreadable (treat as busy).'
    properties:
      detail:
        anyOf:
        - type: string
        - type: 'null'
      idle:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      reason:
        anyOf:
        - enum:
          - turn_probe_unavailable
          - turn_in_flight
          - input_probe_unavailable
          - awaiting_human_input
          type: string
        - type: 'null'
    required:
    - ok
    - idle
    - reason
    type: object
  HealthResponse:
    additionalProperties: false
    description: '``get_health``. ``commit`` is the code the process booted from (``VersionInfo.commit``;

      ``null`` when the install cannot name one).'
    properties:
      auth_required:
        type: boolean
      commit:
        anyOf:
        - type: string
        - type: 'null'
      displayVersion:
        type: string
      ok:
        type: boolean
      version:
        type: string
    required:
    - ok
    - version
    - displayVersion
    - commit
    - auth_required
    type: object
  HealthRetirementResponse:
    additionalProperties: false
    description: '``post_health_retirement`` — ``hermes_cli/backend_retirement.py::RetirementFence``

      ``prepare`` / ``commit`` / ``cancel``. Only ``prepare`` carries ``idle`` (``null`` = cannot

      prove idle) and, when it succeeded, ``token``.'
    properties:
      idle:
        anyOf:
        - type: boolean
        - type: 'null'
      ok:
        type: boolean
      token:
        anyOf:
        - type: string
        - type: 'null'
    required:
    - ok
    type: object
  HostIdentityResponse:
    additionalProperties: false
    description: '``get_host_identity``.'
    properties:
      ok:
        type: boolean
      pid:
        type: integer
      protocolVersion:
        type: integer
      role:
        description: The published host role; "serve" when none was recorded.
        type: string
      servesSpa:
        type: boolean
    required:
    - ok
    - protocolVersion
    - pid
    - role
    - servesSpa
    type: object
  LearningGraphCluster:
    additionalProperties: false
    properties:
      category:
        type: string
      count:
        type: integer
    required:
    - category
    - count
    type: object
  LearningGraphEdge:
    additionalProperties: false
    properties:
      source:
        type: string
      target:
        type: string
    required:
    - source
    - target
    type: object
  LearningGraphMemoryCard:
    additionalProperties: false
    description: '``agent/learning_graph.py::_memory_cards``.'
    properties:
      body:
        type: string
      fingerprint:
        type: string
      source:
        enum:
        - memory
        - profile
        type: string
      timestamp:
        anyOf:
        - type: integer
        - type: 'null'
      title:
        type: string
    required:
    - source
    - timestamp
    - title
    - body
    - fingerprint
    type: object
  LearningGraphNode:
    additionalProperties: false
    description: A learned skill or a memory card; ``memorySource`` only on memory nodes.
    properties:
      category:
        type: string
      createdBy:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      kind:
        enum:
        - skill
        - memory
        type: string
      label:
        type: string
      memorySource:
        anyOf:
        - enum:
          - memory
          - profile
          type: string
        - type: 'null'
      pinned:
        type: boolean
      state:
        type: string
      timestamp:
        anyOf:
        - type: integer
        - type: 'null'
      useCount:
        type: integer
    required:
    - id
    - label
    - kind
    - timestamp
    - category
    - useCount
    - state
    - createdBy
    - pinned
    type: object
  LearningGraphResponse:
    additionalProperties: false
    description: '``agent/learning_graph.py::build_learning_graph``.'
    properties:
      clusters:
        items:
          $ref: '#/components/schemas/LearningGraphCluster'
        type: array
      edges:
        items:
          $ref: '#/components/schemas/LearningGraphEdge'
        type: array
      memory:
        items:
          $ref: '#/components/schemas/LearningGraphMemoryCard'
        type: array
      nodes:
        items:
          $ref: '#/components/schemas/LearningGraphNode'
        type: array
      stats:
        $ref: '#/components/schemas/LearningGraphStats'
    required:
    - nodes
    - edges
    - clusters
    - memory
    - stats
    type: object
  LearningGraphStats:
    additionalProperties: false
    description: '``agent/learning_graph.py::density_stats`` plus the memory counts.'
    properties:
      agent_created:
        type: integer
      categories:
        type: integer
      edges_per_node:
        type: number
      isolated_pct:
        type: number
      learned_skills:
        type: integer
      linked_nodes:
        type: integer
      memory_nodes:
        type: integer
      memory_skill_edges:
        type: integer
      nodes:
        type: integer
      related_edges:
        type: integer
      top_categories:
        description: Up to 8 ``[category, count]`` pairs.
        items:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: string
          - type: integer
          type: array
        type: array
      used:
        type: integer
    required:
    - nodes
    - related_edges
    - edges_per_node
    - linked_nodes
    - isolated_pct
    - categories
    - agent_created
    - used
    - top_categories
    - memory_nodes
    - memory_skill_edges
    - learned_skills
    type: object
  LearningNodeDetailResponse:
    additionalProperties: false
    description: '``agent/learning_mutations.py::node_detail`` (the non-ok results become a 404).'
    properties:
      content:
        type: string
      id:
        type: string
      kind:
        enum:
        - skill
        - memory
        type: string
      label:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - kind
    - id
    - label
    - content
    type: object
  LearningNodeMutationResponse:
    additionalProperties: false
    description: '``agent/learning_mutations.py::delete_node`` / ``edit_node`` (the non-ok results become

      a 400).'
    properties:
      message:
        type: string
      ok:
        type: boolean
    required:
    - ok
    - message
    type: object
  LogsResponse:
    additionalProperties: false
    description: '``get_logs`` — raw log lines (trailing newline kept); ``[]`` when the file does not exist.'
    properties:
      file:
        type: string
      lines:
        items:
          type: string
        type: array
    required:
    - file
    - lines
    type: object
  PortalFeature:
    additionalProperties: false
    properties:
      label:
        type: string
      state:
        description: '"via Nous Portal", the active provider name, "active" or "not configured".'
        type: string
    required:
    - label
    - state
    type: object
  PortalStatusResponse:
    additionalProperties: false
    description: '``_get_portal_status_sync``.'
    properties:
      account_tier:
        anyOf:
        - type: string
        - type: 'null'
      features:
        items:
          $ref: '#/components/schemas/PortalFeature'
        type: array
      free_tier:
        type: boolean
      inference_url:
        anyOf:
        - type: string
        - type: 'null'
      logged_in:
        type: boolean
      portal_url:
        anyOf:
        - type: string
        - type: 'null'
      provider:
        type: string
      subscription_url:
        type: string
    required:
    - logged_in
    - portal_url
    - inference_url
    - provider
    - free_tier
    - account_tier
    - subscription_url
    - features
    type: object
  SshOwnershipResponse:
    additionalProperties: false
    description: '``get_ssh_ownership``.'
    properties:
      ok:
        type: boolean
      protocolVersion:
        type: integer
      runtimeIntact:
        type: boolean
      sshOwnerNonce:
        type: string
    required:
    - ok
    - sshOwnerNonce
    - protocolVersion
    - runtimeIntact
    type: object
  StatusApiServerMetrics:
    additionalProperties: false
    description: '``gateway/platforms/api_server.py::_api_server_status_payload`` — the only platform that

      publishes ``metrics`` today (``last_*`` are ISO timestamps).'
    properties:
      active_runs:
        type: integer
      host:
        type: string
      last_heartbeat:
        anyOf:
        - type: string
        - type: 'null'
      last_request_at:
        anyOf:
        - type: string
        - type: 'null'
      metrics_today:
        $ref: '#/components/schemas/StatusApiServerMetricsToday'
      port:
        type: integer
      stored_runs:
        type: integer
    required:
    - host
    - port
    - active_runs
    - stored_runs
    - last_request_at
    - last_heartbeat
    - metrics_today
    type: object
  StatusApiServerMetricsToday:
    additionalProperties: false
    description: UTC-day counters; ``latency_p95_ms`` is null before the first request of the day.
    properties:
      day:
        type: string
      latency_p95_ms:
        anyOf:
        - type: number
        - type: 'null'
      messages:
        type: integer
      requests:
        type: integer
      tokens:
        type: integer
    required:
    - day
    - requests
    - messages
    - tokens
    - latency_p95_ms
    type: object
  StatusComponents:
    additionalProperties: false
    description: '``_component_health``.'
    properties:
      dashboard:
        $ref: '#/components/schemas/StatusDashboardComponent'
      gateway:
        $ref: '#/components/schemas/StatusGatewayComponent'
      platforms:
        $ref: '#/components/schemas/StatusPlatformsComponent'
      storage:
        $ref: '#/components/schemas/StatusStorageComponent'
    required:
    - gateway
    - dashboard
    - storage
    - platforms
    type: object
  StatusDashboardComponent:
    additionalProperties: false
    description: '``hermes_cli/web_server.py::DashboardHealth.snapshot``.'
    properties:
      last_error_at:
        anyOf:
        - type: number
        - type: 'null'
      recent_unhandled_errors:
        type: integer
      selftest:
        enum:
        - unknown
        - ok
        - failing
        type: string
      status:
        enum:
        - ok
        - degraded
        type: string
    required:
    - status
    - recent_unhandled_errors
    - last_error_at
    - selftest
    type: object
  StatusDiskPressure:
    additionalProperties: false
    description: '``gateway/disk_status.py::collect_disk_status``; only ``pressure`` when the collector

      raised.'
    properties:
      free_mb:
        anyOf:
        - type: integer
        - type: 'null'
      pressure:
        enum:
        - ok
        - elevated
        - critical
        - unknown
        type: string
      total_mb:
        anyOf:
        - type: integer
        - type: 'null'
      used_percent:
        anyOf:
        - type: number
        - type: 'null'
    required:
    - pressure
    type: object
  StatusFtsRebuild:
    additionalProperties: false
    description: '``hermes_state_search.py::_rebuild_status``.'
    properties:
      indexed:
        type: integer
      pending:
        type: boolean
      percent:
        type: integer
      total:
        type: integer
    required:
    - pending
    - total
    - indexed
    - percent
    type: object
  StatusGatewayComponent:
    additionalProperties: false
    properties:
      state:
        type: string
      status:
        enum:
        - ok
        - degraded
        type: string
    required:
    - status
    - state
    type: object
  StatusGatewayPlatform:
    additionalProperties: true
    description: 'One runtime platform entry (``gateway/status.py::_prepare_runtime_status_update``) with the

      writer-identity stamps stripped; mirrored api_server/webhook entries of a served profile add

      ``ingress_url`` / ``mirrored_from`` (``shared_listener_mirror_platforms``).'
    properties:
      error_code:
        anyOf:
        - type: string
        - type: 'null'
      error_message:
        anyOf:
        - type: string
        - type: 'null'
      ingress_url:
        anyOf:
        - type: string
        - type: 'null'
      listener_base:
        anyOf:
        - type: string
        - type: 'null'
      metrics:
        anyOf:
        - $ref: '#/components/schemas/StatusApiServerMetrics'
        - type: 'null'
      mirrored_from:
        anyOf:
        - type: string
        - type: 'null'
      needs_attention:
        anyOf:
        - type: boolean
        - type: 'null'
      retrying_since:
        anyOf:
        - type: string
        - type: 'null'
      state:
        anyOf:
        - type: string
        - type: 'null'
      updated_at:
        anyOf:
        - type: string
        - type: 'null'
    type: object
  StatusGatewayTopologyEntry:
    additionalProperties: false
    description: One live gateway from ``hermes_cli/web_server_gateway.py::_collect_profile_gateway_topology``.
    properties:
      ports:
        additionalProperties:
          type: integer
        type: object
      profile:
        type: string
      served_profiles:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
    required:
    - profile
    - ports
    type: object
  StatusMemoryPressure:
    additionalProperties: false
    description: '``gateway/memory_status.py::collect_memory_status``; only ``pressure`` when the collector

      raised.'
    properties:
      boot_id:
        anyOf:
        - type: string
        - type: 'null'
      gateway_rss_mb:
        anyOf:
        - type: integer
        - type: 'null'
      last_boot_suspected_oom:
        default: false
        type: boolean
      last_boot_unclean:
        default: false
        type: boolean
      pressure:
        enum:
        - ok
        - elevated
        - critical
        - unknown
        type: string
      sampled_at:
        anyOf:
        - type: string
        - type: 'null'
      swap_used_mb:
        anyOf:
        - type: integer
        - type: 'null'
      system_available_mb:
        anyOf:
        - type: integer
        - type: 'null'
      system_total_mb:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - pressure
    type: object
  StatusPlatformsComponent:
    additionalProperties: false
    properties:
      configured:
        type: integer
      connected:
        type: integer
      status:
        enum:
        - ok
        - degraded
        type: string
    required:
    - status
    - configured
    - connected
    type: object
  StatusResponse:
    additionalProperties: false
    description: '``get_status`` — the public liveness probe. The host-recon keys (``hermes_home`` …

      ``gateways``) are present only when the auth gate is off; ``install_id`` only when it could be

      persisted; ``fts_rebuild`` only while a deferred FTS rebuild is pending.'
    properties:
      active_agents:
        type: integer
      active_sessions:
        type: integer
      auth_flows:
        items:
          enum:
          - cookie
          - native_pkce
          type: string
        type: array
      auth_providers:
        items:
          type: string
        type: array
      auth_required:
        type: boolean
      can_update_hermes:
        type: boolean
      components:
        $ref: '#/components/schemas/StatusComponents'
      config_path:
        anyOf:
        - type: string
        - type: 'null'
      config_version:
        type: integer
      disk:
        $ref: '#/components/schemas/StatusDiskPressure'
      env_path:
        anyOf:
        - type: string
        - type: 'null'
      fts_rebuild:
        anyOf:
        - $ref: '#/components/schemas/StatusFtsRebuild'
        - type: 'null'
      gateway_busy:
        type: boolean
      gateway_drainable:
        type: boolean
      gateway_exit_reason:
        anyOf:
        - type: string
        - type: 'null'
      gateway_health_url:
        anyOf:
        - type: string
        - type: 'null'
      gateway_heartbeat_stale_s:
        anyOf:
        - type: integer
        - type: 'null'
      gateway_mode:
        enum:
        - multiplex
        - single
        - multiple
        - none
        - unknown
        type: string
      gateway_pid:
        anyOf:
        - type: integer
        - type: 'null'
      gateway_platforms:
        additionalProperties:
          $ref: '#/components/schemas/StatusGatewayPlatform'
        description: Plain platform names plus validated "<profile>:<platform>" keys.
        type: object
      gateway_running:
        type: boolean
      gateway_shared_with:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      gateway_state:
        anyOf:
        - type: string
        - type: 'null'
      gateway_updated_at:
        anyOf:
        - type: string
        - type: 'null'
      gateways:
        anyOf:
        - items:
            $ref: '#/components/schemas/StatusGatewayTopologyEntry'
          type: array
        - type: 'null'
      hermes_home:
        anyOf:
        - type: string
        - type: 'null'
      install_id:
        anyOf:
        - type: string
        - type: 'null'
      latest_config_version:
        type: integer
      memory:
        $ref: '#/components/schemas/StatusMemoryPressure'
      multiplex_standalone_reason:
        anyOf:
        - type: string
        - type: 'null'
      nous_session_valid:
        enum:
        - valid
        - terminal
        - unknown
        type: string
      overall:
        enum:
        - ok
        - degraded
        type: string
      parked_profiles:
        items:
          type: string
        type: array
      profiles:
        items:
          type: string
        type: array
      release_date:
        type: string
      restart_drain_timeout:
        type: number
      shared_profile_warning:
        type: boolean
      version:
        type: string
    required:
    - version
    - release_date
    - config_version
    - latest_config_version
    - can_update_hermes
    - gateway_running
    - gateway_state
    - gateway_platforms
    - gateway_exit_reason
    - gateway_updated_at
    - gateway_heartbeat_stale_s
    - gateway_shared_with
    - active_agents
    - gateway_busy
    - gateway_drainable
    - restart_drain_timeout
    - active_sessions
    - auth_required
    - auth_providers
    - auth_flows
    - nous_session_valid
    - shared_profile_warning
    - components
    - overall
    - memory
    - disk
    - profiles
    - parked_profiles
    - gateway_mode
    - multiplex_standalone_reason
    type: object
  StatusStorageComponent:
    additionalProperties: false
    description: '``gateway/readiness.py::_probe_state_db`` reduced to its status enum.'
    properties:
      reason:
        anyOf:
        - const: corrupt
          type: string
        - type: 'null'
      status:
        enum:
        - ok
        - degraded
        type: string
    required:
    - status
    type: object
  SystemStatsDisk:
    additionalProperties: false
    properties:
      free:
        type: integer
      percent:
        type: number
      total:
        type: integer
      used:
        type: integer
    required:
    - total
    - used
    - free
    - percent
    type: object
  SystemStatsMemory:
    additionalProperties: false
    properties:
      available:
        type: integer
      percent:
        type: number
      total:
        type: integer
      used:
        type: integer
    required:
    - total
    - available
    - used
    - percent
    type: object
  SystemStatsProcess:
    additionalProperties: false
    properties:
      create_time:
        type: integer
      num_threads:
        type: integer
      pid:
        type: integer
      rss:
        type: integer
    required:
    - pid
    - rss
    - create_time
    - num_threads
    type: object
  SystemStatsResponse:
    additionalProperties: false
    description: '``get_system_stats``; every psutil-derived key is absent when psutil (or that probe) is

      unavailable.'
    properties:
      arch:
        type: string
      cpu_count:
        anyOf:
        - type: integer
        - type: 'null'
      cpu_percent:
        anyOf:
        - type: number
        - type: 'null'
      disk:
        anyOf:
        - $ref: '#/components/schemas/SystemStatsDisk'
        - type: 'null'
      hermes_version:
        type: string
      hostname:
        type: string
      load_avg:
        anyOf:
        - items:
            type: number
          type: array
        - type: 'null'
      memory:
        anyOf:
        - $ref: '#/components/schemas/SystemStatsMemory'
        - type: 'null'
      os:
        type: string
      os_release:
        type: string
      os_version:
        type: string
      platform:
        type: string
      process:
        anyOf:
        - $ref: '#/components/schemas/SystemStatsProcess'
        - type: 'null'
      psutil:
        type: boolean
      python_impl:
        type: string
      python_version:
        type: string
      uptime_seconds:
        anyOf:
        - type: integer
        - type: 'null'
    required:
    - os
    - os_release
    - os_version
    - platform
    - arch
    - hostname
    - python_version
    - python_impl
    - hermes_version
    - cpu_count
    - psutil
    type: object
