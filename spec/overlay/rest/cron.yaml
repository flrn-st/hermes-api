# Hand-reviewed against the tagged handlers: operations whose handler changed after the tag, and
# components whose producer drifted. These win over spec/overlay/rest/contracts/.
components:
  CronFireRequest:
    type: object
    additionalProperties: false
    required:
    - job_id
    description: '``cron_fire_webhook`` reads ``job_id`` from the JSON body; the caller authenticates with a Chronos
      fire token (``Authorization: Bearer``).'
    properties:
      job_id:
        type: string
  CronJobRunSession:
    additionalProperties: true
    description: 'One ``SessionDB.list_cron_job_runs`` row (the ``list_sessions_rich`` shape, compression

      lineage skipped) annotated by ``_list_cron_job_runs_sync``: ``archived`` becomes a bool,

      ``pinned`` stays SQLite 0/1.'
    properties:
      actual_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
      api_call_count:
        type: integer
      archived:
        type: boolean
      billing_base_url:
        anyOf:
        - type: string
        - type: 'null'
      billing_mode:
        anyOf:
        - type: string
        - type: 'null'
      billing_provider:
        anyOf:
        - type: string
        - type: 'null'
      cache_read_tokens:
        type: integer
      cache_write_tokens:
        type: integer
      chat_id:
        anyOf:
        - type: string
        - type: 'null'
      chat_type:
        anyOf:
        - type: string
        - type: 'null'
      compression_failure_cooldown_until:
        anyOf:
        - type: number
        - type: 'null'
      compression_failure_error:
        anyOf:
        - type: string
        - type: 'null'
      compression_fallback_streak:
        type: integer
      compression_ineffective_count:
