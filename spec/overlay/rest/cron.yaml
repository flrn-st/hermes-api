    type: object
  CronJobRunsResponse:
    additionalProperties: false
    description: '``_list_cron_job_runs_sync`` — the job''s run sessions (``SessionDB.list_cron_job_runs``), newest
      first, annotated with ``is_active``/``archived`` and ``profile`` when a profile holds the job.'
    properties:
      limit:
        type: integer
      runs:
        items:
          $ref: '#/components/schemas/CronJobRunSession'
        type: array
    required:
    - runs
    - limit
    type: object
