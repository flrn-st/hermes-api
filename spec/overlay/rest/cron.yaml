        - type: 'null'
      display_name:
        anyOf:
        - type: string
        - type: 'null'
      end_reason:
        anyOf:
        - type: string
        - type: 'null'
      ended_at:
        anyOf:
        - type: number
        - type: 'null'
      estimated_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
