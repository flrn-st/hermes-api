# Hand-reviewed against the tagged handlers: corrections the response contracts get wrong for the tag
# (undeclared request bodies, media types, values Hermes copies unchecked). These win over
# spec/overlay/rest/contracts/.
components:
  AgentPluginActivateRequest:
    type: object
    additionalProperties: false
    required:
    - name
    - home
    description: '``post_agent_plugin_activate``: load plugin ``name`` for the profile whose home is ``home``.'
    properties:
      name:
        type: string
      home:
        type: string
  AgentPluginUpdateRequest:
    type: object
    additionalProperties: false
    description: '``post_agent_plugin_update``: ``accept_capabilities: true`` applies a re-pin the user confirmed
      after a ``consent_required`` answer.'
    properties:
      accept_capabilities:
        type: boolean
  DashboardPluginManifest:
    additionalProperties: false
    description: '``hermes_cli/web_server_dashboard.py::_dashboard_plugin_entry`` with the internal ``_*`` keys
      stripped. ``name``, ``label``, ``description``, ``icon``, ``version``, ``entry`` and ``css`` are the plugin''s
      ``manifest.json`` values as written (defaults when absent), which Hermes does not validate: a number or ``null``
      there arrives as is.'
    properties:
      css:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      description:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      entry:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      has_api:
        type: boolean
      icon:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      label:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      name:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      slots:
        items:
          type: string
        type: array
      source:
        enum:
        - user
        - bundled
        - project
        type: string
      tab:
        $ref: '#/components/schemas/DashboardPluginTab'
      version:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
    required:
    - name
    - label
    - description
    - icon
    - version
    - tab
    - slots
    - entry
    - css
    - has_api
    - source
    type: object
  PluginsHubContextOption:
    additionalProperties: false
    description: '``hermes_cli/plugins_cmd.py::_discover_context_engines`` pair. ``description`` is the engine''s
      ``plugin.yaml`` value as written, which Hermes does not validate: a number or ``null`` there arrives as is.'
    properties:
      description:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      name:
        type: string
    required:
    - name
    - description
    type: object
  PluginsHubPluginRow:
    additionalProperties: false
    description: 'One ``hermes_cli/web_server_dashboard.py::_merged_plugins_hub`` agent-plugin row. ``name``, ``version``
      and ``description`` are the plugin''s ``plugin.yaml`` values as written, which Hermes does not validate (``version:
      1.0`` is a number); an empty ``version`` or ``description`` becomes ``""``, while an empty ``name`` stays
      ``null``.'
    properties:
      auth_command:
        type: string
      auth_required:
        type: boolean
      can_remove:
        type: boolean
      can_update_git:
        type: boolean
      dashboard_manifest:
        anyOf:
        - $ref: '#/components/schemas/DashboardPluginManifest'
        - type: 'null'
      description:
        anyOf:
        - type: string
        - type: number
      has_dashboard_manifest:
        type: boolean
      name:
        anyOf:
        - type: string
        - type: number
        - type: 'null'
      path:
        type: string
      removed_reason:
        anyOf:
        - type: string
        - type: 'null'
      runtime_status:
        enum:
        - enabled
        - disabled
        - inactive
        type: string
      source:
        enum:
        - bundled
        - user
        - git
        - entrypoint
        type: string
      user_hidden:
        type: boolean
      version:
        anyOf:
        - type: string
        - type: number
    required:
    - name
    - version
    - description
    - source
    - runtime_status
    - has_dashboard_manifest
    - dashboard_manifest
    - path
    - can_remove
    - can_update_git
    - auth_required
    - auth_command
    - user_hidden
    - removed_reason
    type: object
operations:
