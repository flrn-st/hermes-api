  x-handler-hash: 7a8c7656977731c29d6f41a641e1d6c2fba20ed88eab050d6edbbb0265860fec
  x-contract:
    commit: 000b6ee1ccf7cb698844da0b8c8fd82168d48ce7
    model: AgentPluginActivateResponse
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentPluginActivateResponse'
      description: Successful Response
  request:
    required: true
    schema:
      $ref: '#/components/schemas/AgentPluginActivateRequest'
- method: POST
  path: /api/dashboard/agent-plugins/{name}/update
  x-source: hermes_cli/web_routers/dashboard_ui.py:271
