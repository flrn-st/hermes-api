# Hand-reviewed against the tagged handlers: operations whose handler changed after the tag, and
# components whose producer drifted. These win over spec/overlay/rest/contracts/.
components:
  ProfileImportResponse:
    additionalProperties: false
    description: '``import_profile_endpoint``; ``desktop`` is the bundled ``desktop.json`` document, null when

      absent or unreadable.'
    properties:
      desktop: {}
      name:
        type: string
      ok:
        type: boolean
      path:
        type: string
    required:
    - ok
    - name
    - path
    - desktop
    type: object
  ProfileProjectTreeLane:
    additionalProperties: false
    description: 'One lane of ``tui_gateway/project_tree.py::_build_repos``; ``sessions`` stays empty (the

      all-profiles tree is built unhydrated).'
    properties:
      id:
        type: string
      isKanban:
        type: boolean
      isMain:
        type: boolean
      label:
        type: string
      path:
        anyOf:
        - type: string
        - type: 'null'
      sessions:
        items:
          $ref: '#/components/schemas/ProfileProjectTreeSession'
        type: array
    required:
    - id
    - label
    - path
    - isMain
    - isKanban
    - sessions
    type: object
  ProfileProjectTreeSession:
    additionalProperties: false
    description: '``tui_gateway/methods_projects.py::_project_tree_row`` stamped by ``_merge_profile_tree``

      (the REST twin of ``ProjectTreeSession`` in ``tui_gateway/contracts/projects_pets.py``).'
    properties:
      _lineage_ids:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
      _lineage_root_id:
        anyOf:
        - type: string
        - type: 'null'
      actual_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
      archived:
        type: boolean
      cwd:
        anyOf:
        - type: string
        - type: 'null'
      ended_at:
        anyOf:
        - type: number
        - type: 'null'
      estimated_cost_usd:
        anyOf:
        - type: number
        - type: 'null'
      git_branch:
        anyOf:
        - type: string
        - type: 'null'
      git_repo_root:
        anyOf:
        - type: string
        - type: 'null'
      id:
        type: string
      input_tokens:
        type: integer
      is_active:
        type: boolean
      is_default_profile:
        type: boolean
      last_active:
        type: number
      message_count:
        type: integer
      model:
        anyOf:
        - type: string
        - type: 'null'
      output_tokens:
        type: integer
      parent_session_id:
        anyOf:
        - type: string
        - type: 'null'
      preview:
        type: string
      profile:
        type: string
      source:
        type: string
      started_at:
        type: number
      title:
        anyOf:
        - type: string
        - type: 'null'
      tool_call_count:
        type: integer
    required:
    - id
    - _lineage_root_id
    - _lineage_ids
    - parent_session_id
    - title
    - preview
    - started_at
    - ended_at
    - last_active
    - source
    - archived
    - message_count
    - tool_call_count
    - input_tokens
    - output_tokens
    - actual_cost_usd
    - estimated_cost_usd
    - model
    - is_active
    - cwd
    - git_branch
    - git_repo_root
    - profile
    - is_default_profile
    type: object
  ProfileSessionsSidebarResponse:
    additionalProperties: false
    description: '``get_profiles_sessions_sidebar`` — the recents / cron / messaging slices in one scan.'
    properties:
      cron:
        $ref: '#/components/schemas/ProfileSidebarSlice'
      errors:
        items:
          $ref: '#/components/schemas/ProfileReadError'
        type: array
      messaging:
        $ref: '#/components/schemas/ProfileSidebarMessaging'
      recents:
        $ref: '#/components/schemas/ProfileSidebarRecents'
      storage:
        additionalProperties:
          const: corrupt
          type: string
        type: object
    required:
    - recents
    - cron
    - messaging
    - errors
    - storage
    type: object
  ProfileSidebarMessaging:
    additionalProperties: false
    properties:
      sessions:
        items:
          $ref: '#/components/schemas/SessionListRow'
        type: array
      total:
        type: integer
    required:
    - sessions
    - total
    type: object
  ProfileSidebarRecents:
    additionalProperties: false
    properties:
      sessions:
        items:
          $ref: '#/components/schemas/SessionListRow'
        type: array
      profiles_truncated:
        additionalProperties:
          type: boolean
        type: object
      profiles_usage:
        additionalProperties:
          $ref: '#/components/schemas/ProfileSidebarUsage'
        type: object
    required:
    - sessions
    - profiles_truncated
    - profiles_usage
    type: object
  ProfileSidebarSlice:
    additionalProperties: false
    description: 'A sidebar slice: the merged, recency-sorted window across the scanned profiles

      (plus pinned rows past it). A profile whose scan failed only shows in the top-level

      ``errors``.'
    properties:
      sessions:
        items:
          $ref: '#/components/schemas/SessionListRow'
        type: array
    required:
    - sessions
    type: object
  ProfileSidebarUsage:
    additionalProperties: false
    description: '``SessionDB.usage_totals``.'
    properties:
      cost_usd:
        type: number
      tokens:
        type: integer
    required:
    - tokens
    - cost_usd
    type: object
  ProfileSoulResponse:
    additionalProperties: false
    description: '``get_profile_soul``; a missing SOUL.md is ``content: ""``, ``exists: false``.'
    properties:
      content:
        type: string
      exists:
        type: boolean
    required:
    - content
    - exists
    type: object
