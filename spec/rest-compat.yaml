# Older Hermes releases the generated REST client still reads: `floor` (v0.21.5) and every release up to the
# pinned one (v0.22.0 is the stable channel). The reviewed contracts describe the pinned release and stay as
# they are; tools/gen_rest_api.py relaxes only the generated models, so `make check-rest` covers this file.
#
# Derived mechanically (tools/gen_rest_api.py `older_release_fields`): for every schema a success response
# reaches that the floor's contract (spec/out/<floor>/openapi.json) defines under the same name, a field the
# pinned release requires that the floor does not declare, does not require, or allows to be null decodes
# as optional (Swift `T?`, Kotlin `T? = null`), in strict and tolerant decoding alike. A variant of an
# untagged union (CronJobRunSession) keeps the fields the floor already declared, which tell it from its
# siblings; only the fields the floor never sent are relaxed there.
#
# The entries below are the manual extras the derivation cannot see:
# optional: required fields of a schema the floor names differently (it then has no counterpart).
# retired: fields the floor sends that the pinned release dropped from a closed object, declared as
#   optional so strict decoding of the floor's responses does not fail on them.
#
# Generation fails when an extra no longer names a required field (optional), names one the derivation
# already covers, or names a declared field (retired). `olderReleaseRESTResponsesDecode` (Swift and Kotlin)
# decodes every REST response in fixtures/<floor>.
floor: v0.21.5
optional:
  # v0.21.5 answered bulk-delete with SessionDeletedCountResponse.
  SessionBulkDeleteResponse: [skipped_active]
retired:
  ProfileSummary:
    role:
      anyOf: [{type: string}, {type: "null"}]
      description: '`hermes_cli.profiles.PROFILE_ROLES` ("setup") or null; sent before v0.22.1.'
